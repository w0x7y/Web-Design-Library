<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>
  <!-- Native Chromium screenshots and SVG/canvas captures must use the same
       antialiasing. Keep the system fonts, hinting and antialiasing enabled,
       but disable LCD subpixel rendering, which SVG foreignObject cannot use. -->
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
