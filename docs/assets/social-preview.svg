<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Patternbook — UI layouts ready to copy</title>
  <desc>Patternbook's folded-page mark with the words UI layouts. Ready to copy. For developers building with AI agents.</desc>
  <rect width="1200" height="630" fill="#fafafa"/>
  <defs>
    <mask id="tiles">
      <path d="M2 5a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v6.5L11.5 18H5a3 3 0 0 1-3-3Z" fill="#fff"/>
      <rect x="5" y="5" width="4" height="4" rx="1" fill="#000"/>
      <rect x="11" y="5" width="4" height="4" rx="1" fill="#777"/>
      <rect x="5" y="11" width="4" height="4" rx="1" fill="#777"/>
    </mask>
    <g id="mark">
      <rect width="20" height="20" fill="#09090b" mask="url(#tiles)"/>
      <path d="M11.5 18v-3.5a3 3 0 0 1 3-3H18Z" fill="#09090b" opacity="0.4"/>
    </g>
  </defs>
  <use href="#mark" transform="translate(60 50) scale(2.4)"/>
  <text x="123" y="88" font-family="Geist" font-size="32" font-weight="600" fill="#09090b">Patternbook</text>
  <text x="64" y="250" font-family="Geist" font-size="76" font-weight="600" letter-spacing="-3" fill="#09090b">UI layouts.</text>
  <text x="64" y="338" font-family="Geist" font-size="76" font-weight="600" letter-spacing="-3" fill="#09090b">Ready to copy.</text>
  <text x="68" y="407" font-family="Geist" font-size="25" fill="#71717a">For developers building</text>
  <text x="68" y="442" font-family="Geist" font-size="25" fill="#71717a">with AI agents.</text>
  <use href="#mark" transform="translate(756 161) scale(18)"/>
  <path d="M64 531H1136" fill="none" stroke="#d4d4d8"/>
  <g font-family="Geist Mono" font-size="16" fill="#52525b">
    <text x="64" y="578">React + Tailwind</text>
    <text x="273" y="578">HTML + CSS</text>
    <text x="434" y="578">AI briefs + PNG</text>
  </g>
  <path d="M245 562v20M406 562v20" fill="none" stroke="#d4d4d8"/>
  <text x="1136" y="578" text-anchor="end" font-family="Geist" font-size="17" fill="#71717a">Free · MIT licensed</text>
</svg>
