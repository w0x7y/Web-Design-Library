<section class="testimonials-dark-mosaic testimonials-dark-mosaic__part-1"><div class="testimonials-dark-mosaic__part-2"><p class="testimonials-dark-mosaic__part-3">From teams in the work</p><h2 class="testimonials-dark-mosaic__part-4">Less friction.<br>More Friday launches.</h2><div class="testimonials-dark-mosaic__part-5"><figure class="testimonials-dark-mosaic__part-6"><blockquote class="testimonials-dark-mosaic__part-7">Our deploy checklist used to live in someone's head. Cinder made it visible, repeatable and safe enough for anyone on the team to ship.</blockquote><figcaption class="testimonials-dark-mosaic__part-8"><p class="testimonials-dark-mosaic__part-9">Nadia Tran</p><p class="testimonials-dark-mosaic__part-10">Engineering lead / Waypoint</p></figcaption></figure><div class="testimonials-dark-mosaic__part-11"><figure class="testimonials-dark-mosaic__part-12"><blockquote class="testimonials-dark-mosaic__part-13">The first tool we added this year that actually removed a meeting.</blockquote><figcaption class="testimonials-dark-mosaic__part-14"><span class="testimonials-dark-mosaic__part-15">Owen Ellis</span><br>Founder / Small Batch</figcaption></figure><figure class="testimonials-dark-mosaic__part-12"><blockquote class="testimonials-dark-mosaic__part-13">The logs tell us what happened. The rollback button lets us sleep. Both matter.</blockquote><figcaption class="testimonials-dark-mosaic__part-14"><span class="testimonials-dark-mosaic__part-15">Priya Shah</span><br>Staff engineer / Loop Labs</figcaption></figure></div></div></div></section>
