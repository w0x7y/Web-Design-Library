<section aria-labelledby="toggles-corporate-title" class="toggles-corporate">
  <div class="toggles-corporate__header">
    <h2 id="toggles-corporate-title" class="toggles-corporate__title">Payroll notifications</h2>
    <p class="toggles-corporate__subtitle">Sent to d.okafor@meridian.co</p>
  </div>

  <ul role="list" class="toggles-corporate__list">
    <li class="toggles-corporate__row">
      <div class="toggles-corporate__text">
        <label for="toggles-corporate-payslip" class="toggles-corporate__label">Payslip published</label>
        <p id="toggles-corporate-payslip-hint" class="toggles-corporate__hint">Email on each pay date</p>
      </div>
      <span class="toggles-corporate__switch">
        <input id="toggles-corporate-payslip" type="checkbox" role="switch" checked aria-describedby="toggles-corporate-payslip-hint" class="toggles-corporate__input" />
        <span aria-hidden="true" class="toggles-corporate__track"></span>
        <span aria-hidden="true" class="toggles-corporate__knob">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 6.25 2 2 4-4.5" />
          </svg>
        </span>
        <span aria-hidden="true" class="toggles-corporate__state"></span>
      </span>
    </li>

    <li class="toggles-corporate__row">
      <div class="toggles-corporate__text">
        <label for="toggles-corporate-timesheet" class="toggles-corporate__label">Timesheet reminders</label>
        <p id="toggles-corporate-timesheet-hint" class="toggles-corporate__hint">Fridays at 15:00</p>
      </div>
      <span class="toggles-corporate__switch">
        <input id="toggles-corporate-timesheet" type="checkbox" role="switch" aria-describedby="toggles-corporate-timesheet-hint" class="toggles-corporate__input" />
        <span aria-hidden="true" class="toggles-corporate__track"></span>
        <span aria-hidden="true" class="toggles-corporate__knob">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 6.25 2 2 4-4.5" />
          </svg>
        </span>
        <span aria-hidden="true" class="toggles-corporate__state"></span>
      </span>
    </li>

    <li class="toggles-corporate__row">
      <div class="toggles-corporate__text">
        <label for="toggles-corporate-approvals" class="toggles-corporate__label">Expense approvals</label>
        <p id="toggles-corporate-approvals-hint" class="toggles-corporate__hint">Push alert per request</p>
      </div>
      <span class="toggles-corporate__switch">
        <input id="toggles-corporate-approvals" type="checkbox" role="switch" checked aria-describedby="toggles-corporate-approvals-hint" class="toggles-corporate__input" />
        <span aria-hidden="true" class="toggles-corporate__track"></span>
        <span aria-hidden="true" class="toggles-corporate__knob">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 6.25 2 2 4-4.5" />
          </svg>
        </span>
        <span aria-hidden="true" class="toggles-corporate__state"></span>
      </span>
    </li>

    <li class="toggles-corporate__row toggles-corporate__row--disabled">
      <div class="toggles-corporate__text">
        <label for="toggles-corporate-tax" class="toggles-corporate__label">Year-end tax forms</label>
        <p id="toggles-corporate-tax-hint" class="toggles-corporate__hint">
          <svg aria-hidden="true" viewBox="0 0 16 16" fill="currentColor">
            <path
              fill-rule="evenodd"
              d="M8 1.5a3 3 0 0 0-3 3V6.5h-.5A1.5 1.5 0 0 0 3 8v5a1.5 1.5 0 0 0 1.5 1.5h7A1.5 1.5 0 0 0 13 13V8a1.5 1.5 0 0 0-1.5-1.5H11V4.5a3 3 0 0 0-3-3Zm1.5 5V4.5a1.5 1.5 0 0 0-3 0V6.5h3Z"
              clip-rule="evenodd"
            />
          </svg>
          Set by your admin
        </p>
      </div>
      <span class="toggles-corporate__switch">
        <input id="toggles-corporate-tax" type="checkbox" role="switch" checked disabled aria-describedby="toggles-corporate-tax-hint" class="toggles-corporate__input" />
        <span aria-hidden="true" class="toggles-corporate__track"></span>
        <span aria-hidden="true" class="toggles-corporate__knob">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 6.25 2 2 4-4.5" />
          </svg>
        </span>
        <span aria-hidden="true" class="toggles-corporate__state"></span>
      </span>
    </li>
  </ul>
</section>
