<div class="inputs-glass">
  <div aria-hidden="true" class="inputs-glass__glow"></div>
  <div aria-hidden="true" class="inputs-glass__ember"></div>

  <div class="inputs-glass__field">
    <label for="inputs-glass-name" class="inputs-glass__label">Name</label>
    <input
      id="inputs-glass-name"
      type="text"
      name="name"
      autocomplete="name"
      value="Aino Virtanen"
      class="inputs-glass__control"
    />
  </div>

  <div class="inputs-glass__field">
    <label for="inputs-glass-email" class="inputs-glass__label">Email</label>
    <input
      id="inputs-glass-email"
      type="email"
      name="email"
      autocomplete="email"
      value="aino.virtanen@"
      aria-invalid="true"
      aria-describedby="inputs-glass-email-error"
      class="inputs-glass__control"
    />
    <p id="inputs-glass-email-error" class="inputs-glass__error">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="currentColor">
        <path
          fill-rule="evenodd"
          d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14Zm0-10.5a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 4.5Zm0 7a.875.875 0 1 0 0-1.75.875.875 0 0 0 0 1.75Z"
          clip-rule="evenodd"
        />
      </svg>
      Add the domain after the @.
    </p>
  </div>

  <div class="inputs-glass__field">
    <label for="inputs-glass-session" class="inputs-glass__label">Session</label>
    <div class="inputs-glass__select">
      <select id="inputs-glass-session" name="session" class="inputs-glass__control">
        <option value="morning">Morning · 07:00–08:30</option>
        <option value="evening" selected>Evening · 19:00–21:00</option>
        <option value="late">Late · 21:30–23:00</option>
      </select>
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m4 6 4 4 4-4" />
      </svg>
    </div>
  </div>

  <div class="inputs-glass__field inputs-glass__field--notes">
    <div class="inputs-glass__label-row">
      <label for="inputs-glass-notes" class="inputs-glass__label">Notes for the host</label>
      <span id="inputs-glass-notes-hint" class="inputs-glass__hint">Optional</span>
    </div>
    <textarea
      id="inputs-glass-notes"
      name="notes"
      placeholder="Towel hire, first visit…"
      aria-describedby="inputs-glass-notes-hint"
      class="inputs-glass__control"
    >First visit, could we borrow towels?</textarea>
  </div>
</div>
