<div class="dropdowns-chess-lessons">
  <p class="dropdowns-chess-lessons__brand">Knightpath / Coaching</p>
  <details open class="dropdowns-chess-lessons__disclosure">
    <summary class="dropdowns-chess-lessons__summary">
      <span>Find your lesson level</span>
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="dropdowns-chess-lessons__chevron">
        <path d="m4 6 4 4 4-4" />
      </svg>
    </summary>
    <fieldset class="dropdowns-chess-lessons__levels">
      <legend class="dropdowns-chess-lessons__legend">Chess lesson level</legend>
      <label class="dropdowns-chess-lessons__level">
        <input type="radio" name="dropdowns-chess-lessons-level" value="400" aria-labelledby="dropdowns-chess-lessons-400-name" aria-describedby="dropdowns-chess-lessons-400-hint" class="dropdowns-chess-lessons__radio" />
        <span aria-hidden="true" class="dropdowns-chess-lessons__rating">400+</span>
        <span><span id="dropdowns-chess-lessons-400-name" class="dropdowns-chess-lessons__name">First moves</span><span id="dropdowns-chess-lessons-400-hint" class="dropdowns-chess-lessons__hint">Piece play & mates</span></span>
      </label>
      <label class="dropdowns-chess-lessons__level">
        <input type="radio" name="dropdowns-chess-lessons-level" value="900" aria-labelledby="dropdowns-chess-lessons-900-name" aria-describedby="dropdowns-chess-lessons-900-hint" checked class="dropdowns-chess-lessons__radio" />
        <span aria-hidden="true" class="dropdowns-chess-lessons__rating">900+</span>
        <span><span id="dropdowns-chess-lessons-900-name" class="dropdowns-chess-lessons__name">Club player</span><span id="dropdowns-chess-lessons-900-hint" class="dropdowns-chess-lessons__hint">Tactics & planning</span></span>
      </label>
      <label class="dropdowns-chess-lessons__level">
        <input type="radio" name="dropdowns-chess-lessons-level" value="1400" aria-labelledby="dropdowns-chess-lessons-1400-name" aria-describedby="dropdowns-chess-lessons-1400-hint" class="dropdowns-chess-lessons__radio" />
        <span aria-hidden="true" class="dropdowns-chess-lessons__rating">1400+</span>
        <span><span id="dropdowns-chess-lessons-1400-name" class="dropdowns-chess-lessons__name">Tournament</span><span id="dropdowns-chess-lessons-1400-hint" class="dropdowns-chess-lessons__hint">Analysis & endings</span></span>
      </label>
    </fieldset>
    <p class="dropdowns-chess-lessons__note">Not rated yet? Your first session includes a short skills check.</p>
  </details>
</div>
