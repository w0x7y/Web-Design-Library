<section class="settings-account-profile">
  <form class="settings-account-profile__form" action="#">
    <header class="settings-account-profile__header">
      <span class="settings-account-profile__avatar">AR</span>
      <div class="settings-account-profile__identity">
        <h2 class="settings-account-profile__heading">Your profile</h2>
        <p class="settings-account-profile__description">How you appear to the community.</p>
      </div>
    </header>
    <div class="settings-account-profile__names">
      <label class="settings-account-profile__field" for="settings-account-profile-first">
        First name (required)
        <input class="settings-account-profile__input" id="settings-account-profile-first" type="text" autocomplete="given-name" placeholder="Alex" required="" name="first">
      </label>
      <label class="settings-account-profile__field" for="settings-account-profile-last">
        Last name (required)
        <input class="settings-account-profile__input" id="settings-account-profile-last" type="text" autocomplete="family-name" placeholder="Rivera" required="" name="last">
      </label>
    </div>
    <div class="settings-account-profile__details">
      <label class="settings-account-profile__field" for="settings-account-profile-email">
        Email address (required)
        <input
          class="settings-account-profile__input"
          id="settings-account-profile-email"
          type="email"
          autocomplete="email"
          placeholder="alex@example.com"
          required=""
          name="email"
        >
      </label>
      <label class="settings-account-profile__field" for="settings-account-profile-bio">
        A few words about you
        <textarea
          class="settings-account-profile__bio"
          name="bio"
          id="settings-account-profile-bio"
          maxlength="240"
          aria-describedby="settings-account-profile-bio-hint"
          placeholder="What are you working on?"
        ></textarea>
        <span id="settings-account-profile-bio-hint" class="settings-account-profile__hint">Up to 240 characters.</span>
      </label>
    </div>
    <footer class="settings-account-profile__footer">
      <a class="settings-account-profile__profile-link" href="#">View public profile</a>
      <button class="settings-account-profile__save" type="button">Save profile</button>
    </footer>
  </form>
</section>
