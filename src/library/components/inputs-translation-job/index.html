<section class="inputs-translation-job" aria-label="Lexbridge translation estimate">
  <p class="inputs-translation-job__brand">Lexbridge / Document translation</p>
  <h2 class="inputs-translation-job__heading">Set the language pair</h2>
  <div class="inputs-translation-job__pair">
    <div>
      <label class="inputs-translation-job__label" for="inputs-translation-job-source">From</label>
      <select class="inputs-translation-job__field" id="inputs-translation-job-source" name="source">
        <option value="de">German</option>
        <option value="en">English</option>
        <option value="fr">French</option>
      </select>
    </div>
    <span class="inputs-translation-job__arrow" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M2 8h12m-4-4 4 4-4 4" />
      </svg>
    </span>
    <div>
      <label class="inputs-translation-job__label" for="inputs-translation-job-target">To</label>
      <select class="inputs-translation-job__field" id="inputs-translation-job-target" name="target">
        <option value="en">English</option>
        <option value="de">German</option>
        <option value="fr">French</option>
      </select>
    </div>
  </div>
  <div class="inputs-translation-job__count">
    <label class="inputs-translation-job__label" for="inputs-translation-job-count">Document word count</label>
    <input
      class="inputs-translation-job__field"
      id="inputs-translation-job-count"
      name="words"
      type="number"
      min="1"
      step="1"
      value="2400"
      aria-describedby="inputs-translation-job-hint"
    >
    <p
      class="inputs-translation-job__hint"
      id="inputs-translation-job-hint"
    >An estimate is fine. We confirm after review.</p>
  </div>
</section>
