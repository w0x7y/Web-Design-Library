<article class="product-card-dog-travel">
  <p class="product-card-dog-travel__brand">puddlehound</p>
  <div class="product-card-dog-travel__header">
    <img
      class="product-card-dog-travel__photo"
      src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=800&q=80"
      alt="A small pug looking up, ready to accompany its owner"
      width="800"
      height="1067"
    />
    <h2 class="product-card-dog-travel__title">Their spot.<br />Anywhere.</h2>
  </div>
  <p class="product-card-dog-travel__description">
    A wipe-clean travel mat. Folds small enough for the café bag.
  </p>
  <label
    class="product-card-dog-travel__field"
    for="product-card-dog-travel-size"
    >Fold-up mat size</label
  >
  <select
    class="product-card-dog-travel__select"
    id="product-card-dog-travel-size"
    name="mat-size"
  >
    <option value="small">Small · 60 × 45 cm</option>
    <option value="large">Large · 90 × 65 cm</option>
  </select>
  <div class="product-card-dog-travel__footer">
    <p class="product-card-dog-travel__price">£32</p>
    <a
      class="product-card-dog-travel__cta"
      href="#puddlehound-mat"
      aria-label="Shop the Puddlehound fold-up travel mat"
      >Pack their mat →</a
    >
  </div>
</article>
