<fieldset aria-describedby="toggles-theme-previews-hint" class="toggles-theme-previews">
  <legend class="toggles-theme-previews__title">Theme</legend>
  <p id="toggles-theme-previews-hint" class="toggles-theme-previews__hint">System matches the setting on your device</p>
  <div class="toggles-theme-previews__options">
    <label class="toggles-theme-previews__option">
      <input type="radio" name="toggles-theme-previews-theme" checked value="light" class="toggles-theme-previews__input">
      <span aria-hidden="true" class="toggles-theme-previews__frame">
        <span class="toggles-theme-previews__screen">
          <span class="toggles-theme-previews__line toggles-theme-previews__line--title"></span>
          <span class="toggles-theme-previews__line"></span>
          <span class="toggles-theme-previews__line toggles-theme-previews__line--short"></span>
          <span class="toggles-theme-previews__button"></span>
        </span>
      </span>
      <span class="toggles-theme-previews__name"><span aria-hidden="true" class="toggles-theme-previews__indicator"><span class="toggles-theme-previews__dot"></span></span>Light</span>
    </label>
    <label class="toggles-theme-previews__option">
      <input type="radio" name="toggles-theme-previews-theme" value="dark" class="toggles-theme-previews__input">
      <span aria-hidden="true" class="toggles-theme-previews__frame">
        <span class="toggles-theme-previews__screen toggles-theme-previews__screen--dark">
          <span class="toggles-theme-previews__line toggles-theme-previews__line--title"></span>
          <span class="toggles-theme-previews__line"></span>
          <span class="toggles-theme-previews__line toggles-theme-previews__line--short"></span>
          <span class="toggles-theme-previews__button"></span>
        </span>
      </span>
      <span class="toggles-theme-previews__name"><span aria-hidden="true" class="toggles-theme-previews__indicator"><span class="toggles-theme-previews__dot"></span></span>Dark</span>
    </label>
    <label class="toggles-theme-previews__option">
      <input type="radio" name="toggles-theme-previews-theme" value="system" class="toggles-theme-previews__input">
      <span aria-hidden="true" class="toggles-theme-previews__frame">
        <span class="toggles-theme-previews__split">
          <span class="toggles-theme-previews__screen">
            <span class="toggles-theme-previews__line toggles-theme-previews__line--title"></span>
            <span class="toggles-theme-previews__line"></span>
            <span class="toggles-theme-previews__line toggles-theme-previews__line--short"></span>
            <span class="toggles-theme-previews__button"></span>
          </span>
          <span class="toggles-theme-previews__screen toggles-theme-previews__screen--dark">
            <span class="toggles-theme-previews__line toggles-theme-previews__line--title"></span>
            <span class="toggles-theme-previews__line"></span>
            <span class="toggles-theme-previews__line toggles-theme-previews__line--short"></span>
            <span class="toggles-theme-previews__button"></span>
          </span>
        </span>
      </span>
      <span class="toggles-theme-previews__name"><span aria-hidden="true" class="toggles-theme-previews__indicator"><span class="toggles-theme-previews__dot"></span></span>System</span>
    </label>
  </div>
</fieldset>
