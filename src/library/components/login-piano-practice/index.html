<section class="login-piano-practice">
  <div class="login-piano-practice__inner">
    <div class="login-piano-practice__body">
      <div class="login-piano-practice__intro">
        <div class="login-piano-practice__copy">
          <p class="login-piano-practice__brand">CADENZA HOUSE / PIANO TUITION</p>
          <h1 class="login-piano-practice__heading">A little practice, every day.</h1>
          <p
            id="login-piano-practice-hint"
            class="login-piano-practice__hint"
          >
            Lesson notes, repertoire and your teacher’s feedback, ready when you sit down to play.
          </p>
        </div>
        <figure class="login-piano-practice__keyboard">
          <svg viewBox="0 0 560 100" preserveAspectRatio="none" aria-hidden="true" class="login-piano-practice__keys">
            <rect x="0" y="0" width="560" height="100" fill="#f4f4f5" />
            <path d="M80 0v100" stroke="#09090b" stroke-width="2" />
            <path d="M160 0v100" stroke="#09090b" stroke-width="2" />
            <path d="M240 0v100" stroke="#09090b" stroke-width="2" />
            <path d="M320 0v100" stroke="#09090b" stroke-width="2" />
            <path d="M400 0v100" stroke="#09090b" stroke-width="2" />
            <path d="M480 0v100" stroke="#09090b" stroke-width="2" />
            <rect x="65" y="0" width="30" height="62" fill="#09090b" />
            <rect x="145" y="0" width="30" height="62" fill="#09090b" />
            <rect x="305" y="0" width="30" height="62" fill="#09090b" />
            <rect x="385" y="0" width="30" height="62" fill="#09090b" />
            <rect x="465" y="0" width="30" height="62" fill="#09090b" />
          </svg>
          <figcaption class="login-piano-practice__caption">Your next lesson begins with the last one.</figcaption>
        </figure>
      </div>
      <div class="login-piano-practice__access">
        <h2 class="login-piano-practice__form-heading">Student sign-in</h2>
        <form action="#" method="post" class="login-piano-practice__form">
          <label for="login-piano-practice-email" class="login-piano-practice__label">
            Student email
            <input
              id="login-piano-practice-email"
              name="email"
              type="email"
              autocomplete="username"
              required
              aria-describedby="login-piano-practice-hint"
              class="login-piano-practice__input"
            >
          </label>
          <label for="login-piano-practice-password" class="login-piano-practice__label">
            Password
            <input
              id="login-piano-practice-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="login-piano-practice__input"
            >
          </label>
          <label for="login-piano-practice-remember" class="login-piano-practice__remember-label">
            <input
              type="checkbox"
              name="remember"
              id="login-piano-practice-remember"
              aria-describedby="login-piano-practice-device"
              class="login-piano-practice__remember"
            >
            Remember this device
          </label>
          <button type="submit" class="login-piano-practice__submit">Open my lesson notes</button>
          <a href="#" class="login-piano-practice__help">Trouble signing in?</a>
        </form>
        <p
          id="login-piano-practice-device"
          class="login-piano-practice__device-hint"
        >
          Use this option on your own device. Leave it unchecked on a shared practice-room computer.
        </p>
      </div>
    </div>
  </div>
</section>
