<fieldset aria-describedby="toggles-time-slot-grid-hint" class="toggles-time-slot-grid">
  <legend class="toggles-time-slot-grid__title">Tuesday, March 14</legend>
  <p id="toggles-time-slot-grid-hint" class="toggles-time-slot-grid__hint">30-minute slots in UTC+1</p>
  <fieldset class="toggles-time-slot-grid__period">
    <legend class="toggles-time-slot-grid__period-title">Morning</legend>
    <div class="toggles-time-slot-grid__slots">
      <label class="toggles-time-slot-grid__slot">
        <input type="radio" name="toggles-time-slot-grid-time" value="09:00" class="toggles-time-slot-grid__input">
        09:00
      </label>
      <label class="toggles-time-slot-grid__slot">
        <input type="radio" name="toggles-time-slot-grid-time" value="09:30" class="toggles-time-slot-grid__input">
        09:30
      </label>
      <label class="toggles-time-slot-grid__slot">
        <input type="radio" name="toggles-time-slot-grid-time" disabled aria-label="10:00, unavailable" value="10:00" class="toggles-time-slot-grid__input">
        10:00
      </label>
      <label class="toggles-time-slot-grid__slot">
        <input type="radio" name="toggles-time-slot-grid-time" value="10:30" class="toggles-time-slot-grid__input">
        10:30
      </label>
      <label class="toggles-time-slot-grid__slot">
        <input type="radio" name="toggles-time-slot-grid-time" value="11:00" class="toggles-time-slot-grid__input">
        11:00
      </label>
      <label class="toggles-time-slot-grid__slot">
        <input type="radio" name="toggles-time-slot-grid-time" disabled aria-label="11:30, unavailable" value="11:30" class="toggles-time-slot-grid__input">
        11:30
      </label>
    </div>
  </fieldset>
  <fieldset class="toggles-time-slot-grid__period">
    <legend class="toggles-time-slot-grid__period-title">Afternoon</legend>
    <div class="toggles-time-slot-grid__slots">
      <label class="toggles-time-slot-grid__slot">
        <input type="radio" name="toggles-time-slot-grid-time" value="13:00" class="toggles-time-slot-grid__input">
        13:00
      </label>
      <label class="toggles-time-slot-grid__slot">
        <input type="radio" name="toggles-time-slot-grid-time" checked value="13:30" class="toggles-time-slot-grid__input">
        13:30
      </label>
      <label class="toggles-time-slot-grid__slot">
        <input type="radio" name="toggles-time-slot-grid-time" value="14:00" class="toggles-time-slot-grid__input">
        14:00
      </label>
      <label class="toggles-time-slot-grid__slot">
        <input type="radio" name="toggles-time-slot-grid-time" disabled aria-label="14:30, unavailable" value="14:30" class="toggles-time-slot-grid__input">
        14:30
      </label>
      <label class="toggles-time-slot-grid__slot">
        <input type="radio" name="toggles-time-slot-grid-time" value="15:00" class="toggles-time-slot-grid__input">
        15:00
      </label>
      <label class="toggles-time-slot-grid__slot">
        <input type="radio" name="toggles-time-slot-grid-time" value="15:30" class="toggles-time-slot-grid__input">
        15:30
      </label>
    </div>
  </fieldset>
</fieldset>
