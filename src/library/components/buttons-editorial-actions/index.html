<section aria-label="Journal actions" class="buttons-editorial-actions">
  <p class="buttons-editorial-actions__eyebrow">The Common Reader</p>
  <h2 class="buttons-editorial-actions__heading">Keep a good story<br />close.</h2>
  <div class="buttons-editorial-actions__reading-actions">
    <button type="button" class="buttons-editorial-actions__button">
      <span aria-hidden="true" class="buttons-editorial-actions__number">01</span>
      Save to reading list
      <span aria-hidden="true" class="buttons-editorial-actions__plus">+</span>
    </button>
    <button type="button" class="buttons-editorial-actions__button">
      <span aria-hidden="true" class="buttons-editorial-actions__number">02</span>
      Share this story
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="buttons-editorial-actions__share-icon">
        <path d="M4 12 12 4M4 4h8v8" />
      </svg>
    </button>
  </div>
  <a href="#subscribe" class="buttons-editorial-actions__subscribe">Become a subscriber</a>
</section>
