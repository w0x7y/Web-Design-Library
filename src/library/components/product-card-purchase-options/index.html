<article class="product-card-purchase-options">
  <div class="product-card-purchase-options__summary">
    <div role="img" aria-label="Image placeholder: product package" class="product-card-purchase-options__media">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="product-card-purchase-options__media-icon">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <circle cx="9" cy="9" r="2"></circle>
        <path d="m21 15-5-5L5 21"></path>
      </svg>
    </div>
    <div class="product-card-purchase-options__identity">
      <h3 class="product-card-purchase-options__name">Product name</h3>
      <p class="product-card-purchase-options__variant">Pack size or variant</p>
    </div>
  </div>
  <form class="product-card-purchase-options__form">
    <fieldset>
      <legend class="product-card-purchase-options__legend">Purchase option</legend>
      <div class="product-card-purchase-options__options">
        <label class="product-card-purchase-options__option product-card-purchase-options__choice">
          <input type="radio" name="product-card-purchase-options-plan" value="once" class="product-card-purchase-options__radio">
          <span class="product-card-purchase-options__choice-text product-card-purchase-options__choice-title">One-time purchase</span>
          <span class="product-card-purchase-options__choice-price">$24.00</span>
        </label>
        <div class="product-card-purchase-options__option">
          <label class="product-card-purchase-options__choice product-card-purchase-options__choice--top">
            <input type="radio" aria-describedby="product-card-purchase-options-subscribe-hint" name="product-card-purchase-options-plan" checked value="subscribe" class="product-card-purchase-options__radio">
            <span class="product-card-purchase-options__choice-text"><span class="product-card-purchase-options__choice-title">Subscribe and save</span><span id="product-card-purchase-options-subscribe-hint" class="product-card-purchase-options__choice-hint">Save 10%, cancel any time</span></span>
            <span class="product-card-purchase-options__choice-price">$21.60</span>
          </label>
          <div class="product-card-purchase-options__frequency">
            <label for="product-card-purchase-options-frequency" class="product-card-purchase-options__frequency-label">Deliver every</label>
            <div class="product-card-purchase-options__select-wrap">
              <select id="product-card-purchase-options-frequency" name="frequency" class="product-card-purchase-options__select">
                <option value="2">2 weeks</option>
                <option value="4" selected>4 weeks</option>
                <option value="6">6 weeks</option>
                <option value="8">8 weeks</option>
              </select>
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="product-card-purchase-options__chevron">
                <path d="m6 9 6 6 6-6"></path>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </fieldset>
    <button type="submit" class="product-card-purchase-options__cart-action">Add to cart</button>
  </form>
</article>
