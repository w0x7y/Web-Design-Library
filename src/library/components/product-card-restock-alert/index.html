<article class="product-card-restock-alert">
  <div role="img" aria-label="Image placeholder: sold-out product photograph" class="product-card-restock-alert__media">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="product-card-restock-alert__media-icon">
      <rect x="3" y="3" width="18" height="18" rx="2"></rect>
      <circle cx="9" cy="9" r="2"></circle>
      <path d="m21 15-5-5L5 21"></path>
    </svg>
  </div>
  <div class="product-card-restock-alert__title-row">
    <h3 class="product-card-restock-alert__name">Product name</h3>
    <p class="product-card-restock-alert__price">$48</p>
  </div>
  <div class="product-card-restock-alert__status">
    <span class="product-card-restock-alert__badge">Sold out</span>
    <p class="product-card-restock-alert__variant">Size M, light gray</p>
  </div>
  <form class="product-card-restock-alert__form">
    <label for="product-card-restock-alert-email" class="product-card-restock-alert__label">Email me when it is back</label>
    <p id="product-card-restock-alert-hint" class="product-card-restock-alert__hint">One email when this size returns.</p>
    <div class="product-card-restock-alert__field-row">
      <input id="product-card-restock-alert-email" type="email" autocomplete="email" required placeholder="Email address" aria-describedby="product-card-restock-alert-hint" name="email" class="product-card-restock-alert__email">
      <button type="submit" class="product-card-restock-alert__submit">Notify me</button>
    </div>
  </form>
</article>
