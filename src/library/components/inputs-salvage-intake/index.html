<section class="inputs-salvage-intake" aria-label="Reclaimant salvage intake">
  <header class="inputs-salvage-intake__header">
    <p class="inputs-salvage-intake__brand">RECLAIMANT / SITE 08</p>
    <h2 class="inputs-salvage-intake__heading">RECOVERY TICKET</h2>
  </header>
  <label class="inputs-salvage-intake__label" for="inputs-salvage-intake-item">Item description</label>
  <input
    class="inputs-salvage-intake__field"
    id="inputs-salvage-intake-item"
    name="item"
    type="text"
    value="Cast-iron radiator"
  >
  <div class="inputs-salvage-intake__grid">
    <div>
      <label class="inputs-salvage-intake__label" for="inputs-salvage-intake-material">Material</label>
      <select class="inputs-salvage-intake__field" id="inputs-salvage-intake-material" name="material">
        <option value="iron">Cast iron</option>
        <option value="timber">Timber</option>
        <option value="stone">Stone</option>
      </select>
    </div>
    <div>
      <label class="inputs-salvage-intake__label" for="inputs-salvage-intake-quantity">Units</label>
      <input
        class="inputs-salvage-intake__field"
        id="inputs-salvage-intake-quantity"
        name="quantity"
        type="number"
        min="1"
        max="9999"
        step="1"
        value="6"
        aria-describedby="inputs-salvage-intake-note"
      >
    </div>
  </div>
  <p class="inputs-salvage-intake__footer" id="inputs-salvage-intake-note">Count intact units only. Assess on site.</p>
</section>
