<article class="product-card-spec-columns">
  <div class="product-card-spec-columns__header">
    <p class="product-card-spec-columns__eyebrow">Category label</p>
    <span class="product-card-spec-columns__badge">Digital</span>
  </div>
  <div role="img" aria-label="Image placeholder: product cover or package preview" class="product-card-spec-columns__media">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="product-card-spec-columns__icon">
      <rect x="3" y="3" width="18" height="18" rx="2"></rect>
      <circle cx="9" cy="9" r="2"></circle>
      <path d="m21 15-5-5L5 21"></path>
    </svg>
  </div>
  <h3 class="product-card-spec-columns__name">Product name</h3>
  <p class="product-card-spec-columns__description">Short description of what is included and how to use it.</p>
  <dl class="product-card-spec-columns__specs">
    <div class="product-card-spec-columns__spec product-card-spec-columns__spec--first">
      <dt class="product-card-spec-columns__spec-label">Format</dt>
      <dd class="product-card-spec-columns__spec-value">24-bit</dd>
    </div>
    <div class="product-card-spec-columns__spec product-card-spec-columns__spec--middle">
      <dt class="product-card-spec-columns__spec-label">Size</dt>
      <dd class="product-card-spec-columns__spec-value">1.2 GB</dd>
    </div>
    <div class="product-card-spec-columns__spec product-card-spec-columns__spec--last">
      <dt class="product-card-spec-columns__spec-label">Files</dt>
      <dd class="product-card-spec-columns__spec-value">120</dd>
    </div>
  </dl>
  <footer class="product-card-spec-columns__footer">
    <p class="product-card-spec-columns__price">$48</p>
    <button type="button" aria-label="Buy Product name" class="product-card-spec-columns__buy-action">Buy</button>
  </footer>
</article>
