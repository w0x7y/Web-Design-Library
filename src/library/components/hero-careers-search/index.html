<section class="hero-careers-search">
  <div class="hero-careers-search__inner">
    <p class="hero-careers-search__eyebrow">Good work starts with the right team</p>
    <h1 class="hero-careers-search__heading">Find a role worth<br class="hero-careers-search__heading-break"> getting up for.</h1>
    <p class="hero-careers-search__description">Thoughtful companies. Transparent salaries. A smaller list of better opportunities, updated every morning.</p>
    <form class="hero-careers-search__search-form" action="#" method="get">
      <div>
        <label for="hero-careers-search-keyword" class="hero-careers-search__label">Role or keyword</label>
        <input id="hero-careers-search-keyword" placeholder="Designer, engineer, writer..." class="hero-careers-search__keyword" name="role">
      </div>
      <div>
        <label for="hero-careers-search-location" class="hero-careers-search__label">Location</label>
        <select id="hero-careers-search-location" name="location" class="hero-careers-search__location"><option>Remote, anywhere</option><option>London</option><option>New York</option><option>Amsterdam</option></select>
      </div>
      <button type="submit" class="hero-careers-search__submit">Find my next role</button>
    </form>
    <div class="hero-careers-search__popular-searches">
      <span class="hero-careers-search__popular-label">Popular searches</span>
      <a href="#" class="hero-careers-search__category-link">Design</a>
      <a href="#" class="hero-careers-search__category-link">Engineering</a>
      <a href="#" class="hero-careers-search__category-link">Marketing</a>
      <a href="#" class="hero-careers-search__category-link">Operations</a>
    </div>
    <p class="hero-careers-search__statistic"><strong class="hero-careers-search__role-count">218 open roles</strong> from 64 teams that put people first.</p>
  </div>
</section>
