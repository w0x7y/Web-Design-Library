<div class="badges-status-list">
  <div class="badges-status-list__header">
    <h2 class="badges-status-list__title">Status overview</h2>
    <a href="#" class="badges-status-list__view-all">View all</a>
  </div>
  <ul role="list">
    <li class="badges-status-list__row badges-status-list__row--divided">
      <div class="badges-status-list__identity">
        <p class="badges-status-list__name">Item name</p>
        <p class="badges-status-list__timestamp">Updated 2 min ago</p>
      </div>
      <span class="badges-status-list__status"><span aria-hidden="true" class="badges-status-list__dot badges-status-list__dot--filled"></span>Live</span>
    </li>
    <li class="badges-status-list__row badges-status-list__row--divided">
      <div class="badges-status-list__identity">
        <p class="badges-status-list__name">Process name</p>
        <p class="badges-status-list__timestamp">Updated 12 min ago</p>
      </div>
      <span class="badges-status-list__status"><span aria-hidden="true" class="badges-status-list__progress"><span class="badges-status-list__progress-fill"></span></span>In progress</span>
    </li>
    <li class="badges-status-list__row badges-status-list__row--divided">
      <div class="badges-status-list__identity">
        <p class="badges-status-list__name">Attempt name</p>
        <p class="badges-status-list__timestamp">Updated 1 hour ago</p>
      </div>
      <span class="badges-status-list__status"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="badges-status-list__failed-icon">
        <path d="m6 6 12 12M18 6 6 18"></path>
      </svg>Failed</span>
    </li>
    <li class="badges-status-list__row">
      <div class="badges-status-list__identity">
        <p class="badges-status-list__name">Queue item</p>
        <p class="badges-status-list__timestamp">Added 2 hours ago</p>
      </div>
      <span class="badges-status-list__status"><span aria-hidden="true" class="badges-status-list__dot"></span>Queued</span>
    </li>
  </ul>
</div>
