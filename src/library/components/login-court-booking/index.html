<section class="login-court-booking">
  <div class="login-court-booking__inner">
    <div class="login-court-booking__club">
      <p class="login-court-booking__brand">rallymint / padel club</p>
      <h1 class="login-court-booking__heading">Less admin. More rallies.</h1>
      <figure class="login-court-booking__court">
        <svg
          viewBox="0 0 400 200"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          aria-hidden="true"
          class="login-court-booking__diagram"
        >
          <rect x="10" y="10" width="380" height="180" rx="3" />
          <path d="M200 10v180M80 10v180M320 10v180M80 100h240" stroke-width="2" />
          <circle cx="285" cy="72" r="14" fill="#fef9c3" stroke="none" />
        </svg>
        <figcaption class="login-court-booking__caption">Your court, doubles partner and league nights, together.</figcaption>
      </figure>
    </div>
    <div class="login-court-booking__pass">
      <header class="login-court-booking__pass-header">
        <p class="login-court-booking__pass-label">MEMBER PASS</p>
        <p class="login-court-booking__season">AUTUMN 26</p>
      </header>
      <h2 class="login-court-booking__form-heading">Back for another set?</h2>
      <form action="#" method="post" class="login-court-booking__form">
        <label for="login-court-booking-email" class="login-court-booking__label">
          Club email
          <input
            id="login-court-booking-email"
            name="email"
            type="email"
            autocomplete="username"
            required
            aria-describedby="login-court-booking-hint"
            class="login-court-booking__input"
          >
        </label>
        <label for="login-court-booking-password" class="login-court-booking__label">
          Password
          <input
            id="login-court-booking-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            class="login-court-booking__input"
          >
        </label>
        <button type="submit" class="login-court-booking__submit">Find my next game</button>
        <a href="#" class="login-court-booking__help">Trouble signing in?</a>
      </form>
      <p
        id="login-court-booking-hint"
        class="login-court-booking__hint"
      >
        First visit? Your welcome email includes your account invitation.
      </p>
    </div>
  </div>
</section>
