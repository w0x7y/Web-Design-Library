<fieldset class="toggles-checklist-rows">
  <legend class="toggles-checklist-rows__legend">Select items</legend>
  <ul role="list" class="toggles-checklist-rows__checklist">
    <li class="toggles-checklist-rows__checklist-row"><label class="toggles-checklist-rows__checklist-label">
      <input id="toggles-checklist-rows-first" type="checkbox" aria-describedby="toggles-checklist-rows-first-hint" name="items" checked value="first" class="toggles-checklist-rows__checklist-input">
      <span class="toggles-checklist-rows__item-copy"><span class="toggles-checklist-rows__item-title">First item title</span><span id="toggles-checklist-rows-first-hint" class="toggles-checklist-rows__item-hint">Short reason to select it.</span></span>
      <span class="toggles-checklist-rows__item-state">Required</span>
    </label></li>
    <li class="toggles-checklist-rows__checklist-row"><label class="toggles-checklist-rows__checklist-label">
      <input id="toggles-checklist-rows-second" type="checkbox" aria-describedby="toggles-checklist-rows-second-hint" name="items" value="second" class="toggles-checklist-rows__checklist-input">
      <span class="toggles-checklist-rows__item-copy"><span class="toggles-checklist-rows__item-title">Second item title</span><span id="toggles-checklist-rows-second-hint" class="toggles-checklist-rows__item-hint">Explain the optional choice.</span></span>
      <span class="toggles-checklist-rows__item-state">Optional</span>
    </label></li>
    <li class="toggles-checklist-rows__checklist-row"><label class="toggles-checklist-rows__checklist-label">
      <input id="toggles-checklist-rows-third" type="checkbox" aria-describedby="toggles-checklist-rows-third-hint" name="items" checked value="third" class="toggles-checklist-rows__checklist-input">
      <span class="toggles-checklist-rows__item-copy"><span class="toggles-checklist-rows__item-title">Third item title</span><span id="toggles-checklist-rows-third-hint" class="toggles-checklist-rows__item-hint">Describe this separate item.</span></span>
      <span class="toggles-checklist-rows__item-state">Optional</span>
    </label></li>
  </ul>
</fieldset>
