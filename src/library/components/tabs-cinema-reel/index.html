<section aria-label="Aisle Eleven cinema programme and visit" class="tabs-cinema-reel">
  <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800&q=80" alt="Red cinema seats beside a central aisle in a dark auditorium" width="800" height="533" class="tabs-cinema-reel__photo">
  <header class="tabs-cinema-reel__masthead">
    <h2 class="tabs-cinema-reel__brand">Aisle Eleven</h2>
    <span class="tabs-cinema-reel__date">10 Oct / Screen 1</span>
  </header>
  <section id="tabs-cinema-reel-tonight-panel" aria-labelledby="tabs-cinema-reel-tonight-label" class="tabs-cinema-reel__panel tabs-cinema-reel__panel--tonight">
    <p class="tabs-cinema-reel__kicker">19:45 / Director Q&amp;A</p>
    <h3 class="tabs-cinema-reel__film-title">Rooms without doors</h3>
    <p class="tabs-cinema-reel__film-note">A film by Inez Mora · 94 minutes</p>
    <p class="tabs-cinema-reel__detail">Original language · English subtitles</p>
  </section>
  <section id="tabs-cinema-reel-visit-panel" aria-labelledby="tabs-cinema-reel-visit-label" class="tabs-cinema-reel__panel tabs-cinema-reel__panel--visit">
    <p class="tabs-cinema-reel__kicker">Doors open / 19:15</p>
    <h3 class="tabs-cinema-reel__film-title">Make an evening of it</h3>
    <p class="tabs-cinema-reel__film-note">Café until 22:30 · 48 seats</p>
    <p class="tabs-cinema-reel__detail">Step-free entry · Hearing loop available</p>
  </section>
  <fieldset class="tabs-cinema-reel__selector">
    <legend class="tabs-cinema-reel__legend">Choose cinema information</legend>
    <label id="tabs-cinema-reel-tonight-label" class="tabs-cinema-reel__tab">
      <input id="tabs-cinema-reel-tonight" type="radio" name="tabs-cinema-reel-view" value="tonight" checked aria-controls="tabs-cinema-reel-tonight-panel" class="tabs-cinema-reel__radio">
      <span>Tonight</span>
      <span class="tabs-cinema-reel__stub">01</span>
    </label>
    <label id="tabs-cinema-reel-visit-label" class="tabs-cinema-reel__tab">
      <input id="tabs-cinema-reel-visit" type="radio" name="tabs-cinema-reel-view" value="visit" aria-controls="tabs-cinema-reel-visit-panel" class="tabs-cinema-reel__radio">
      <span>Your visit</span>
      <span class="tabs-cinema-reel__stub">02</span>
    </label>
  </fieldset>
</section>
