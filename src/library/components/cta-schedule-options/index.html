<section class="cta-schedule-options">
  <div class="cta-schedule-options__container">
    <header class="cta-schedule-options__header">
      <p class="cta-schedule-options__eyebrow">Eyebrow for the section</p>
      <h2 class="cta-schedule-options__heading">Heading for choosing a session time</h2>
      <p class="cta-schedule-options__lede">Explain the session length and what participants should prepare.</p>
    </header>
    <form action="#" class="cta-schedule-options__schedule-form">
      <fieldset aria-describedby="cta-schedule-options-hint">
        <legend class="cta-schedule-options__choices-label">Choose a time</legend>
        <div class="cta-schedule-options__time-options">
          <label class="cta-schedule-options__time-option">
            <input type="radio" name="session-time" checked value="0" class="cta-schedule-options__time-radio">
            <span><span class="cta-schedule-options__date">Mar 14</span><span class="cta-schedule-options__time">10:00 AM</span></span>
          </label>
          <label class="cta-schedule-options__time-option">
            <input type="radio" name="session-time" value="1" class="cta-schedule-options__time-radio">
            <span><span class="cta-schedule-options__date">Mar 15</span><span class="cta-schedule-options__time">2:00 PM</span></span>
          </label>
          <label class="cta-schedule-options__time-option">
            <input type="radio" name="session-time" value="2" class="cta-schedule-options__time-radio">
            <span><span class="cta-schedule-options__date">Mar 16</span><span class="cta-schedule-options__time">11:30 AM</span></span>
          </label>
        </div>
      </fieldset>
      <div class="cta-schedule-options__form-footer">
        <p id="cta-schedule-options-hint" class="cta-schedule-options__time-zone-hint">All times use your local time zone.</p>
        <button type="submit" class="cta-schedule-options__submit">Continue</button>
      </div>
    </form>
  </div>
</section>
