<section aria-label="Appointment actions" class="buttons-calendar-actions">
  <div class="buttons-calendar-actions__header">
    <time datetime="2026-10-16" aria-label="October 16, 2026" class="buttons-calendar-actions__date">
      <span class="buttons-calendar-actions__month">Oct</span>
      <span class="buttons-calendar-actions__day">16</span>
    </time>
    <div>
      <h2 class="buttons-calendar-actions__heading">Project check-in</h2>
      <p class="buttons-calendar-actions__time">Friday, 10:00–10:30 AM</p>
    </div>
  </div>
  <p class="buttons-calendar-actions__description">Your time with Morgan is reserved. Confirm when you're ready.</p>
  <button type="button" class="buttons-calendar-actions__button buttons-calendar-actions__button--confirm">Confirm appointment</button>
  <div class="buttons-calendar-actions__secondary">
    <button type="button" class="buttons-calendar-actions__button buttons-calendar-actions__button--reschedule">Reschedule</button>
    <button type="button" class="buttons-calendar-actions__button buttons-calendar-actions__button--cancel">Cancel booking</button>
  </div>
</section>
