<div class="badges-access-matrix">
  <table class="badges-access-matrix__access-table">
    <caption class="badges-access-matrix__table-caption">Access summary</caption>
    <thead>
      <tr>
        <th scope="col" class="badges-access-matrix__column-label badges-access-matrix__column-label--group">Group</th>
        <th scope="col" class="badges-access-matrix__column-label badges-access-matrix__column-label--view">View</th>
        <th scope="col" class="badges-access-matrix__column-label badges-access-matrix__column-label--edit">Edit</th>
      </tr>
    </thead>
    <tbody>
      <tr class="badges-access-matrix__access-row">
        <th scope="row" class="badges-access-matrix__group-label">Group name</th>
        <td class="badges-access-matrix__access-cell-view"><span class="badges-access-matrix__access-badge">Enabled</span></td>
        <td class="badges-access-matrix__access-cell-edit"><span class="badges-access-matrix__access-badge">Read only</span></td>
      </tr>
      <tr class="badges-access-matrix__access-row">
        <th scope="row" class="badges-access-matrix__group-label">Another group</th>
        <td class="badges-access-matrix__access-cell-view"><span class="badges-access-matrix__access-badge">Enabled</span></td>
        <td class="badges-access-matrix__access-cell-edit"><span class="badges-access-matrix__access-badge">Enabled</span></td>
      </tr>
      <tr class="badges-access-matrix__access-row">
        <th scope="row" class="badges-access-matrix__group-label">Final group</th>
        <td class="badges-access-matrix__access-cell-view"><span class="badges-access-matrix__access-badge">Unavailable</span></td>
        <td class="badges-access-matrix__access-cell-edit"><span class="badges-access-matrix__access-badge">Enabled</span></td>
      </tr>
    </tbody>
  </table>
</div>
