<section aria-labelledby="toggles-ice-cream-cart-title" class="toggles-ice-cream-cart">
  <p class="toggles-ice-cream-cart__eyebrow">SCOOPSTEP / CART MENU</p>
  <h2 id="toggles-ice-cream-cart-title" class="toggles-ice-cream-cart__title">On the scoop.</h2>
  <p class="toggles-ice-cream-cart__intro">Show today’s small-batch flavors.</p>
  <div class="toggles-ice-cream-cart__flavors">
    <div class="toggles-ice-cream-cart__flavor-cocoa">
      <span class="toggles-ice-cream-cart__batch-number">01</span>
      <label for="toggles-ice-cream-cart-cocoa" class="toggles-ice-cream-cart__label">Dark cocoa</label>
      <p id="toggles-ice-cream-cart-cocoa-hint" class="toggles-ice-cream-cart__hint">12 tubs left</p>
      <div class="toggles-ice-cream-cart__flavor-toggle">
        <input
          id="toggles-ice-cream-cart-cocoa"
          name="toggles-ice-cream-cart-cocoa"
          type="checkbox"
          role="switch"
          checked
          aria-describedby="toggles-ice-cream-cart-cocoa-hint"
          class="toggles-ice-cream-cart__switch"
        >
      </div>
    </div>
    <div class="toggles-ice-cream-cart__flavor-pistachio">
      <span class="toggles-ice-cream-cart__batch-number">02</span>
      <label for="toggles-ice-cream-cart-pistachio" class="toggles-ice-cream-cart__label">Pistachio</label>
      <p id="toggles-ice-cream-cart-pistachio-hint" class="toggles-ice-cream-cart__hint">6 tubs left</p>
      <div class="toggles-ice-cream-cart__flavor-toggle">
        <input
          id="toggles-ice-cream-cart-pistachio"
          name="toggles-ice-cream-cart-pistachio"
          type="checkbox"
          role="switch"
          aria-describedby="toggles-ice-cream-cart-pistachio-hint"
          class="toggles-ice-cream-cart__switch"
        >
      </div>
    </div>
  </div>
  <p class="toggles-ice-cream-cart__footnote">Off flavors stay hidden from the cart menu.</p>
</section>
