<section class="signup-workspace-starter">
  <div class="signup-workspace-starter__inner">
    <aside class="signup-workspace-starter__benefits">
      <span class="signup-workspace-starter__trial">14-DAY TEAM TRIAL</span>
      <h2 class="signup-workspace-starter__heading">Good work needs a shared place.</h2>
      <ul class="signup-workspace-starter__benefit-list" role="list">
        <li class="signup-workspace-starter__benefit">Unlimited projects during your trial</li>
        <li class="signup-workspace-starter__benefit">Invite your whole team from day one</li>
        <li class="signup-workspace-starter__benefit">Export your work whenever you need</li>
      </ul>
      <p class="signup-workspace-starter__trial-note">No card required to get started.</p>
    </aside>
    <form class="signup-workspace-starter__form" action="#" method="post">
      <h2 class="signup-workspace-starter__form-title">Create your workspace</h2>
      <label class="signup-workspace-starter__field" for="signup-workspace-starter-workspace">
        Workspace name
        <input class="signup-workspace-starter__input" id="signup-workspace-starter-workspace" name="workspace" type="text" autocomplete="off" placeholder="Acme Design" required>
      </label>
      <label class="signup-workspace-starter__field" for="signup-workspace-starter-email">
        Work email
        <input class="signup-workspace-starter__input" id="signup-workspace-starter-email" name="email" type="email" autocomplete="email" placeholder="" required>
      </label>
      <label class="signup-workspace-starter__field" for="signup-workspace-starter-password">
        Password
        <input class="signup-workspace-starter__input" id="signup-workspace-starter-password" aria-describedby="signup-workspace-starter-password-hint" minlength="12" name="password" type="password" autocomplete="new-password" placeholder="" required>
        <span class="signup-workspace-starter__password-hint" id="signup-workspace-starter-password-hint">Use at least 12 characters.</span>
      </label>
      <div class="signup-workspace-starter__terms">
        <input class="signup-workspace-starter__checkbox" type="checkbox" name="terms" id="signup-workspace-starter-terms" aria-labelledby="signup-workspace-starter-terms-label" aria-describedby="signup-workspace-starter-terms-hint" required>
        <div class="signup-workspace-starter__terms-copy">
          <label class="signup-workspace-starter__terms-label" for="signup-workspace-starter-terms" id="signup-workspace-starter-terms-label">I accept the terms of service</label>
          <a class="signup-workspace-starter__terms-link" id="signup-workspace-starter-terms-hint" href="#">Read the terms of service</a>
        </div>
      </div>
      <button class="signup-workspace-starter__submit" type="submit">Create workspace</button>
      <p class="signup-workspace-starter__account">Already have an account? <a class="signup-workspace-starter__login" href="#">Sign in</a></p>
    </form>
  </div>
</section>
