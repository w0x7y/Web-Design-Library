<section class="login-centered-card">
  <div class="login-centered-card__container">
    <div class="login-centered-card__card">
      <div class="login-centered-card__logo">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="login-centered-card__logo-glyph">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        <span>Logo</span>
      </div>
      <h1 class="login-centered-card__title">Sign in</h1>
      <p class="login-centered-card__lede">Short introduction for returning members.</p>
      <form class="login-centered-card__form">
        <div>
          <label for="login-centered-card-email" class="login-centered-card__label">Email</label><input id="login-centered-card-email" type="email" autocomplete="username" required placeholder="name@example.com" name="email" class="login-centered-card__input">
        </div>
        <div>
          <div class="login-centered-card__password-label-row">
            <label for="login-centered-card-password" class="login-centered-card__label">Password</label>
            <span class="login-centered-card__recovery"><a href="#" class="login-centered-card__link">Forgot password?</a></span>
          </div>
          <input id="login-centered-card-password" type="password" autocomplete="current-password" required name="password" class="login-centered-card__input">
        </div>
        <label class="login-centered-card__remember"><input type="checkbox" name="remember" class="login-centered-card__checkbox">Remember me</label>
        <button type="submit" class="login-centered-card__submit">Sign in</button>
      </form>
    </div>
    <p class="login-centered-card__account">No account? <a href="#" class="login-centered-card__link">Sign up</a></p>
  </div>
</section>
