<section class="testimonials-editorial-dialogue testimonials-editorial-dialogue__part-1"><div class="testimonials-editorial-dialogue__part-2"><p class="testimonials-editorial-dialogue__part-3">After the class</p><h2 class="testimonials-editorial-dialogue__part-4">What stayed with them.</h2><p class="testimonials-editorial-dialogue__part-5">We asked two Small Hours students what changed in the way they work, six months after finishing the course.</p><figure class="testimonials-editorial-dialogue__part-6"><div><p class="testimonials-editorial-dialogue__part-7">QUESTION 01</p><p class="testimonials-editorial-dialogue__part-8">What do you notice now?</p></div><div><blockquote class="testimonials-editorial-dialogue__part-9">I notice the space between things. My work has fewer elements now, but each one has a clearer job. That was a small shift that changed everything.</blockquote><figcaption class="testimonials-editorial-dialogue__part-10"><span class="testimonials-editorial-dialogue__part-11">Elliot James</span><span class="testimonials-editorial-dialogue__part-12">Product designer, class of Spring 2026</span></figcaption></div></figure><figure class="testimonials-editorial-dialogue__part-13"><div><p class="testimonials-editorial-dialogue__part-7">QUESTION 02</p><p class="testimonials-editorial-dialogue__part-8">What became easier?</p></div><div><blockquote class="testimonials-editorial-dialogue__part-9">Explaining my choices. I used to say something felt right. Now I can talk about hierarchy, rhythm and what I want someone to notice first.</blockquote><figcaption class="testimonials-editorial-dialogue__part-10"><span class="testimonials-editorial-dialogue__part-11">Mina Rahman</span><span class="testimonials-editorial-dialogue__part-12">Independent illustrator, class of Winter 2026</span></figcaption></div></figure></div></section>
