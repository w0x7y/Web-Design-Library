<section class="testimonials-editorial-dialogue">
  <div class="testimonials-editorial-dialogue__inner">
    <p class="testimonials-editorial-dialogue__eyebrow">After the class</p>
    <h2 class="testimonials-editorial-dialogue__heading">What stayed with them.</h2>
    <p class="testimonials-editorial-dialogue__intro">
      We asked two Small Hours students what changed in the way they work, six months after
      finishing the course.
    </p>
    <article class="testimonials-editorial-dialogue__interview testimonials-editorial-dialogue__interview--first">
      <div>
        <p class="testimonials-editorial-dialogue__question-number">QUESTION 01</p>
        <p class="testimonials-editorial-dialogue__question">What do you notice now?</p>
      </div>
      <figure>
        <blockquote class="testimonials-editorial-dialogue__quote">
          I notice the space between things. My work has fewer elements now, but each one has a
          clearer job. That was a small shift that changed everything.
        </blockquote>
        <figcaption class="testimonials-editorial-dialogue__attribution"><span class="testimonials-editorial-dialogue__name">Elliot James</span><span class="testimonials-editorial-dialogue__role">Product designer, class of Spring 2026</span></figcaption>
      </figure>
    </article>
    <article class="testimonials-editorial-dialogue__interview testimonials-editorial-dialogue__interview--last">
      <div>
        <p class="testimonials-editorial-dialogue__question-number">QUESTION 02</p>
        <p class="testimonials-editorial-dialogue__question">What became easier?</p>
      </div>
      <figure>
        <blockquote class="testimonials-editorial-dialogue__quote">
          Explaining my choices. I used to say something felt right. Now I can talk about hierarchy,
          rhythm and what I want someone to notice first.
        </blockquote>
        <figcaption class="testimonials-editorial-dialogue__attribution"><span class="testimonials-editorial-dialogue__name">Mina Rahman</span><span class="testimonials-editorial-dialogue__role">Independent illustrator, class of Winter 2026</span></figcaption>
      </figure>
    </article>
  </div>
