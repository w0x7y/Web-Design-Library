<section class="login-reading-room">
  <div class="login-reading-room__page">
    <header class="login-reading-room__masthead">
      <p class="login-reading-room__publication">The Reading Room</p>
      <p class="login-reading-room__edition">MEMBERS / EST. 2019</p>
    </header>
    <div class="login-reading-room__columns">
      <div class="login-reading-room__intro">
        <h2 class="login-reading-room__heading">A little room for good ideas.</h2>
        <p class="login-reading-room__description">Your saved stories, Sunday editions and conversations are waiting.</p>
      </div>
      <form class="login-reading-room__form" action="#" method="post">
        <label class="login-reading-room__field" for="login-reading-room-email">
          Member email
          <input class="login-reading-room__input" id="login-reading-room-email" name="email" type="email" autocomplete="email" placeholder="" required>
        </label>
        <label class="login-reading-room__field" for="login-reading-room-password">
          Password
          <input class="login-reading-room__input" id="login-reading-room-password" name="password" type="password" autocomplete="current-password" placeholder="" required>
        </label>
        <button class="login-reading-room__submit" type="submit">Enter the reading room</button>
        <a class="login-reading-room__recovery" href="#">Having trouble signing in?</a>
      </form>
    </div>
  </div>
</section>
