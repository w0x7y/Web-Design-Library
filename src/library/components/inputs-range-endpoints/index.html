<fieldset class="inputs-range-endpoints">
  <legend class="inputs-range-endpoints__legend">Item limit</legend>
  <div class="inputs-range-endpoints__limit-controls">
    <div class="inputs-range-endpoints__range-group">
      <label for="inputs-range-endpoints-range" class="inputs-range-endpoints__control-label">Adjust limit</label><input id="inputs-range-endpoints-range" type="range" min="0" max="100" aria-describedby="inputs-range-endpoints-hint" name="limit-range" value="50" class="inputs-range-endpoints__range-input">
      <div class="inputs-range-endpoints__range-endpoints">
        <span>0</span>
        <span>100</span>
      </div>
    </div>
    <div class="inputs-range-endpoints__number-group"><label for="inputs-range-endpoints-number" class="inputs-range-endpoints__control-label">Exact limit</label><input id="inputs-range-endpoints-number" type="number" min="0" max="100" aria-describedby="inputs-range-endpoints-hint" name="limit-number" value="50" class="inputs-range-endpoints__number-input"></div>
  </div>
  <p id="inputs-range-endpoints-hint" class="inputs-range-endpoints__limit-hint">Choose a value from 0 to 100.</p>
</fieldset>
