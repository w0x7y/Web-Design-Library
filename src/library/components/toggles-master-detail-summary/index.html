<div class="toggles-master-detail-summary">
  <label class="toggles-master-detail-summary__mode-label"><input id="toggles-master-detail-summary-active" type="checkbox" aria-describedby="toggles-master-detail-summary-hint" name="mode" checked class="toggles-master-detail-summary__mode-checkbox">Enable shared mode</label>
  <p id="toggles-master-detail-summary-hint" class="toggles-master-detail-summary__mode-hint">Share this item with the selected group.</p>
  <div class="toggles-master-detail-summary__mode-preview">
    <div>
      <p class="toggles-master-detail-summary__preview-label">Access</p>
      <p class="toggles-master-detail-summary__preview-value">Read only</p>
    </div>
    <div class="toggles-master-detail-summary__members-preview">
      <p class="toggles-master-detail-summary__preview-label">Members</p>
      <p class="toggles-master-detail-summary__preview-value">12 people</p>
    </div>
  </div>
  <p class="toggles-master-detail-summary__off-note">Shared access is turned off.</p>
</div>
