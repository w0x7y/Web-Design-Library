<section class="inputs-aquarium-log" aria-label="Brinewell daily tank log">
  <div class="inputs-aquarium-log__header">
    <h2 class="inputs-aquarium-log__brand">Brinewell</h2>
    <span class="inputs-aquarium-log__badge">DAILY CHECK</span>
  </div>
  <label class="inputs-aquarium-log__label" for="inputs-aquarium-log-tank">Tank identifier</label>
  <input class="inputs-aquarium-log__tank" id="inputs-aquarium-log-tank" name="tank" type="text" value="Reef / Tank 04">
  <label class="inputs-aquarium-log__label" for="inputs-aquarium-log-temperature">Water temperature</label>
  <div class="inputs-aquarium-log__reading">
    <input
      class="inputs-aquarium-log__temperature"
      id="inputs-aquarium-log-temperature"
      name="temperature"
      type="number"
      min="0"
      max="40"
      step="0.1"
      value="24.8"
      aria-describedby="inputs-aquarium-log-unit inputs-aquarium-log-hint"
    >
    <span class="inputs-aquarium-log__unit" id="inputs-aquarium-log-unit">°C</span>
  </div>
  <p class="inputs-aquarium-log__hint" id="inputs-aquarium-log-hint">Log the reading before feeding.</p>
</section>
