<div class="buttons-toolbar">
  <div class="buttons-toolbar__strip">
    <div role="group" aria-label="History actions" class="buttons-toolbar__group">
      <button type="button" aria-label="Undo" class="buttons-toolbar__tool">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="buttons-toolbar__icon">
          <path d="m9 4-5 5 5 5M4 9h9a6 6 0 0 1 0 12"></path>
        </svg>
        <span aria-hidden="true" class="buttons-toolbar__tooltip buttons-toolbar__tooltip--start">Undo</span>
      </button>
      <button type="button" disabled aria-label="Redo" class="buttons-toolbar__tool buttons-toolbar__tool--disabled">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="buttons-toolbar__icon">
          <path d="m15 4 5 5-5 5m5-5h-9a6 6 0 0 0 0 12"></path>
        </svg>
        <span aria-hidden="true" class="buttons-toolbar__tooltip">Redo</span>
      </button>
    </div>
    <span aria-hidden="true" class="buttons-toolbar__divider"></span>
    <div role="group" aria-label="Formatting actions" class="buttons-toolbar__group">
      <button type="button" aria-label="Bold" class="buttons-toolbar__tool">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="buttons-toolbar__icon">
          <path d="M6 4h7a4 4 0 0 1 0 8H6Zm0 8h8a4 4 0 0 1 0 8H6Z"></path>
        </svg>
        <span aria-hidden="true" class="buttons-toolbar__tooltip">Bold</span>
      </button>
      <button type="button" aria-label="Italic" class="buttons-toolbar__tool">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="buttons-toolbar__icon">
          <path d="M10 4h9M5 20h9M15 4 9 20"></path>
        </svg>
        <span aria-hidden="true" class="buttons-toolbar__tooltip">Italic</span>
      </button>
      <button type="button" aria-label="Underline" class="buttons-toolbar__tool">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="buttons-toolbar__icon">
          <path d="M6 4v7a6 6 0 0 0 12 0V4M4 21h16"></path>
        </svg>
        <span aria-hidden="true" class="buttons-toolbar__tooltip buttons-toolbar__tooltip--end">Underline</span>
      </button>
    </div>
    <span aria-hidden="true" class="buttons-toolbar__divider"></span>
    <button type="button" class="buttons-toolbar__save">Save<span class="buttons-toolbar__expanded-label">&nbsp;changes</span></button>
  </div>
</div>
