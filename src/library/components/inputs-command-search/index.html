<section aria-label="Workspace search" class="inputs-command-search">
  <label for="inputs-command-search-query" class="inputs-command-search__label">Find anything in Orbit</label>
  <div class="inputs-command-search__search">
    <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" class="inputs-command-search__search-icon">
      <circle cx="8.5" cy="8.5" r="5" />
      <path d="m12 12 5 5" />
    </svg>
    <input
      id="inputs-command-search-query"
      type="search"
      placeholder="Search your workspace"
      class="inputs-command-search__query"
      name="query"
    />
  </div>
  <fieldset class="inputs-command-search__scope">
    <legend class="inputs-command-search__legend">Search in</legend>
    <div class="inputs-command-search__options">
      <label class="inputs-command-search__option">
        <input
          type="radio"
          class="inputs-command-search__radio"
          name="inputs-command-search-scope"
          checked
          value="all"
        />
        All
      </label>
      <label class="inputs-command-search__option">
        <input
          type="radio"
          class="inputs-command-search__radio"
          name="inputs-command-search-scope"
          value="files"
        />
        Files
      </label>
      <label class="inputs-command-search__option">
        <input
          type="radio"
          class="inputs-command-search__radio"
          name="inputs-command-search-scope"
          value="people"
        />
        People
      </label>
    </div>
  </fieldset>
  <p class="inputs-command-search__suggested">Suggested</p>
  <button type="button" class="inputs-command-search__command">
    <span aria-hidden="true" class="inputs-command-search__plus">+</span>
    Create a new document
    <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="inputs-command-search__enter">
      <path d="M13 3v6H3m4-4L3 9l4 4" />
    </svg>
  </button>
</section>
