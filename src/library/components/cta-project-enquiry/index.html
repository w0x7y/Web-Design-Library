<section class="cta-project-enquiry">
  <div class="cta-project-enquiry__inner">
    <div>
      <p class="cta-project-enquiry__availability"><span aria-hidden="true" class="cta-project-enquiry__dot"></span>Taking briefs for January 2027</p>
      <h2 class="cta-project-enquiry__heading">Tell us what<br>you have in mind.</h2>
      <p class="cta-project-enquiry__intro">
        A new chapter, a thorny problem or a good idea that needs a form. A few lines is plenty to
        start.
      </p>
      <p class="cta-project-enquiry__email-note">Prefer email? <a href="mailto:hello@formfield.studio" class="cta-project-enquiry__email-link">hello@formfield.studio</a></p>
    </div>
    <form class="cta-project-enquiry__form" action="#" method="get">
      <div>
        <label for="cta-project-enquiry-email" class="cta-project-enquiry__label">Your email (required)</label>
        <input
          id="cta-project-enquiry-email"
          type="email"
          autocomplete="email"
          aria-describedby="cta-project-enquiry-hint"
          placeholder="you@company.com"
          required=""
          class="cta-project-enquiry__email-field"
          name="email"
        >
      </div>
      <div>
        <label for="cta-project-enquiry-brief" class="cta-project-enquiry__label">A little about the project</label>
        <textarea id="cta-project-enquiry-brief" name="brief" rows="4" placeholder="What are you hoping to make?" aria-describedby="cta-project-enquiry-hint" class="cta-project-enquiry__brief-field"></textarea>
      </div>
      <div class="cta-project-enquiry__submit-row">
        <p id="cta-project-enquiry-hint" class="cta-project-enquiry__hint">
          We read every note and reply within two working days.
        </p>
        <button type="submit" class="cta-project-enquiry__submit">
          Send your note
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="cta-project-enquiry__arrow">
            <path d="M5 12h14m-6-6 6 6-6 6" />
          </svg>
        </button>
      </div>
    </form>
  </div>
</section>
