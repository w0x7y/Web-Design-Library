<section class="hero-centered-gradient">
  <!-- Mesh gradient: colour fields low in the frame, like the last light after sunset -->
  <div aria-hidden="true" class="hero-centered-gradient__backdrop">
    <div class="hero-centered-gradient__field hero-centered-gradient__field--teal"></div>
    <div class="hero-centered-gradient__field hero-centered-gradient__field--blue"></div>
    <div class="hero-centered-gradient__field hero-centered-gradient__field--rose"></div>
    <div class="hero-centered-gradient__field hero-centered-gradient__field--horizon"></div>
    <svg viewBox="0 0 1440 520" fill="currentColor" class="hero-centered-gradient__stars">
      <circle cx="112" cy="64" r="1.2" opacity="0.7" />
      <circle cx="236" cy="188" r="0.9" opacity="0.5" />
      <circle cx="318" cy="42" r="1.4" opacity="0.8" />
      <circle cx="402" cy="246" r="0.8" opacity="0.4" />
      <circle cx="470" cy="118" r="1" opacity="0.6" />
      <circle cx="548" cy="30" r="0.8" opacity="0.5" />
      <circle cx="604" cy="214" r="1.1" opacity="0.35" />
      <circle cx="688" cy="72" r="0.9" opacity="0.6" />
      <circle cx="772" cy="20" r="1.3" opacity="0.75" />
      <circle cx="836" cy="168" r="0.8" opacity="0.4" />
      <circle cx="918" cy="96" r="1.2" opacity="0.7" />
      <circle cx="986" cy="258" r="0.9" opacity="0.45" />
      <circle cx="1062" cy="38" r="1" opacity="0.6" />
      <circle cx="1148" cy="152" r="1.4" opacity="0.8" />
      <circle cx="1222" cy="276" r="0.8" opacity="0.4" />
      <circle cx="1296" cy="84" r="1.1" opacity="0.65" />
      <circle cx="1364" cy="206" r="0.9" opacity="0.5" />
      <circle cx="62" cy="232" r="0.9" opacity="0.45" />
      <circle cx="174" cy="322" r="1" opacity="0.35" />
      <circle cx="1388" cy="338" r="1" opacity="0.35" />
    </svg>
    <svg viewBox="0 0 1440 160" preserveAspectRatio="xMidYMax slice" class="hero-centered-gradient__ridges">
      <path
        class="hero-centered-gradient__ridge hero-centered-gradient__ridge--far"
        d="M0 160V78l82-26 70 20 104-38 92 34 70-10 128 40 96-30 84 14 136-58 82 36 74-12 112 40 94-26 98 24 74-10 64 18V160Z"
      />
      <path
        class="hero-centered-gradient__ridge hero-centered-gradient__ridge--near"
        d="M0 160V104l64-18 58 14 96-44 74 30 52-12 118 52 84-34 92 20 120-66 74 40 62-16 104 46 86-30 108 32 66-14 92 26 90-36V160Z"
      />
    </svg>
  </div>

  <div class="hero-centered-gradient__inner">
    <h1 class="hero-centered-gradient__title">Know which nights will be clear.</h1>
    <p class="hero-centered-gradient__lede">
      Umbra reads cloud cover, seeing and moonlight for the exact spot you shoot from, then emails you the
      afternoon before a clear night.
    </p>

    <form action="#" class="hero-centered-gradient__form">
      <label for="hero-centered-gradient-email" class="hero-centered-gradient__sr-only">Email address</label>
      <input
        id="hero-centered-gradient-email"
        type="email"
        name="email"
        required
        autocomplete="email"
        placeholder="you@darksky.org"
        class="hero-centered-gradient__input"
      />
      <button type="submit" class="hero-centered-gradient__button">Get the first alert</button>
    </form>
    <p class="hero-centered-gradient__note">Free during the beta. One email per clear night, never more.</p>
  </div>
</section>
