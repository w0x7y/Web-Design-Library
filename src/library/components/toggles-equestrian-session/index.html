<section aria-labelledby="toggles-equestrian-session-title" class="toggles-equestrian-session">
  <img
    src="https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=800&q=80"
    alt="White horse moving through a wooded paddock"
    width="800"
    height="533"
    class="toggles-equestrian-session__photo"
  >
  <div class="toggles-equestrian-session__body">
    <p class="toggles-equestrian-session__eyebrow">CANTRO / RIDING SCHOOL</p>
    <h2 id="toggles-equestrian-session-title" class="toggles-equestrian-session__title">Your hour in the arena.</h2>
    <p class="toggles-equestrian-session__session">Sunday, 11:00 · Indoor arena</p>
    <div class="toggles-equestrian-session__extras">
      <div class="toggles-equestrian-session__control-row">
        <div>
          <label for="toggles-equestrian-session-helmet" class="toggles-equestrian-session__label">Reserve a helmet</label>
          <p id="toggles-equestrian-session-helmet-hint" class="toggles-equestrian-session__hint">Included with your lesson.</p>
        </div>
        <input
          id="toggles-equestrian-session-helmet"
          name="toggles-equestrian-session-helmet"
          type="checkbox"
          role="switch"
          checked
          aria-describedby="toggles-equestrian-session-helmet-hint"
          class="toggles-equestrian-session__switch"
        >
      </div>
      <div class="toggles-equestrian-session__control-row">
        <div>
          <label for="toggles-equestrian-session-groom" class="toggles-equestrian-session__label">Grooming beforehand</label>
          <p id="toggles-equestrian-session-groom-hint" class="toggles-equestrian-session__hint">Arrive 15 minutes early.</p>
        </div>
        <input
          id="toggles-equestrian-session-groom"
          name="toggles-equestrian-session-groom"
          type="checkbox"
          role="switch"
          aria-describedby="toggles-equestrian-session-groom-hint"
          class="toggles-equestrian-session__switch"
        >
      </div>
    </div>
  </div>
</section>
