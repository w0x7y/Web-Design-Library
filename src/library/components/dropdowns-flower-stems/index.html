<div class="dropdowns-flower-stems">
  <div class="dropdowns-flower-stems__header">
    <img src="https://images.unsplash.com/photo-1563241527-3004b7be0ffd?w=800&q=80" alt="A hand-tied bouquet of pale roses, pink flowers and eucalyptus foliage" width="800" height="1200" class="dropdowns-flower-stems__photo" />
    <div>
      <p class="dropdowns-flower-stems__eyebrow">Wholesale flowers</p>
      <p class="dropdowns-flower-stems__brand">Stemfolio</p>
      <p class="dropdowns-flower-stems__date">Market cut / 10 Oct</p>
    </div>
  </div>
  <details open class="dropdowns-flower-stems__disclosure">
    <summary class="dropdowns-flower-stems__summary">
      <span>Choose stem length</span>
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="dropdowns-flower-stems__chevron">
        <path d="m4 6 4 4 4-4" />
      </svg>
    </summary>
    <fieldset aria-describedby="dropdowns-flower-stems-note" class="dropdowns-flower-stems__grades">
      <legend class="dropdowns-flower-stems__legend">Stem length</legend>
      <label class="dropdowns-flower-stems__grade">
        <input type="radio" name="dropdowns-flower-stems-length" value="40" aria-label="40 centimetre stems" class="dropdowns-flower-stems__radio" /><span class="dropdowns-flower-stems__length">40<span class="dropdowns-flower-stems__unit"> cm</span></span>
      </label>
      <label class="dropdowns-flower-stems__grade">
        <input type="radio" name="dropdowns-flower-stems-length" value="60" aria-label="60 centimetre stems" checked class="dropdowns-flower-stems__radio" /><span class="dropdowns-flower-stems__length">60<span class="dropdowns-flower-stems__unit"> cm</span></span>
      </label>
      <label class="dropdowns-flower-stems__grade">
        <input type="radio" name="dropdowns-flower-stems-length" value="80" aria-label="80 centimetre stems" class="dropdowns-flower-stems__radio" /><span class="dropdowns-flower-stems__length">80<span class="dropdowns-flower-stems__unit"> cm</span></span>
      </label>
    </fieldset>
    <p id="dropdowns-flower-stems-note" class="dropdowns-flower-stems__note">Sold in bunches of 10 stems. Length is measured below the flower head.</p>
  </details>
</div>
