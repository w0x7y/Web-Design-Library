<section class="cta-contact-form">
  <div class="cta-contact-form__container">
    <div>
      <p class="cta-contact-form__status"><span aria-hidden="true" class="cta-contact-form__status-dot"></span>Taking new projects</p>
      <h2 class="cta-contact-form__title">Heading that invites a short enquiry</h2>
      <p class="cta-contact-form__lede">Supporting copy that describes what to include and who will help with the next step.</p>
      <p class="cta-contact-form__alternate-label">Alternative contact for a short question</p>
      <a href="mailto:name@example.com" class="cta-contact-form__alternate-link">name@example.com</a>
    </div>
    <form action="#" method="get" class="cta-contact-form__form">
      <div><label for="cta-contact-form-email" class="cta-contact-form__label">Email</label><input id="cta-contact-form-email" type="email" autocomplete="email" required placeholder="name@example.com" name="email" class="cta-contact-form__control cta-contact-form__control--input"></div>
      <div class="cta-contact-form__message-field"><label for="cta-contact-form-message" class="cta-contact-form__label">Message</label><textarea id="cta-contact-form-message" name="message" required="" rows="4" placeholder="A short description of what you need" aria-describedby="cta-contact-form-hint" class="cta-contact-form__control cta-contact-form__control--message"></textarea></div>
      <div class="cta-contact-form__form-footer">
        <p id="cta-contact-form-hint" class="cta-contact-form__hint">Reply-time hint that sets expectations</p>
        <button type="submit" class="cta-contact-form__submit">Send enquiry</button>
      </div>
    </form>
  </div>
</section>
