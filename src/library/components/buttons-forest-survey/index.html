<section aria-label="Canopy Ledger forest survey actions" class="buttons-forest-survey">
  <img
    src="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=800&q=80"
    alt="Hands holding soil and a young plant above the forest floor"
    width="800"
    height="458"
    class="buttons-forest-survey__photo"
  />
  <div aria-hidden="true" class="buttons-forest-survey__scrim"></div>
  <div class="buttons-forest-survey__header">
    <p class="buttons-forest-survey__brand">Canopy Ledger</p>
    <h2 class="buttons-forest-survey__heading">Plot 12 / regeneration</h2>
  </div>
  <div class="buttons-forest-survey__pane">
    <button type="button" class="buttons-forest-survey__survey">
      <span>Create field survey</span>
      <svg
        aria-hidden="true"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="buttons-forest-survey__arrow"
      >
        <path d="M3 8h10M9 4l4 4-4 4" />
      </svg>
    </button>
    <div class="buttons-forest-survey__tools">
      <button type="button" class="buttons-forest-survey__map">Field map</button>
      <button type="button" class="buttons-forest-survey__export">Export plots</button>
    </div>
    <button type="button" class="buttons-forest-survey__log">
      <span>Restoration log</span>
      <span aria-hidden="true">↗</span>
    </button>
  </div>
</section>
