<section class="cta-solar-survey">
  <div class="cta-solar-survey__inner">
    <p class="cta-solar-survey__eyebrow">
      Daymark / Home solar, properly measured
    </p>
    <h2 class="cta-solar-survey__heading">Find out what your roof could do.</h2>
    <div class="cta-solar-survey__body">
      <figure>
        <svg
          viewBox="0 0 290 220"
          stroke="currentColor"
          aria-hidden="true"
          class="cta-solar-survey__roof"
        >
          <path d="M30 115 145 35l115 80v75H30Z" fill="none" stroke-width="2" />
          <path
            d="M15 120 145 25l130 95M145 25v-15m-15 0h30"
            fill="none"
            stroke-width="2"
          />
          <path
            d="m85 90 30-22 22 16-30 22Zm35-25 25-18 22 16-25 18Zm-8 46 30-22 22 16-30 22Zm35-25 25-18 22 16-25 18Z"
            class="cta-solar-survey__panels"
          />
          <path
            d="M50 190v-50h35v50m100-50h45v30h-45zM15 205h260"
            fill="none"
            stroke-width="2"
          />
        </svg>
        <figcaption class="cta-solar-survey__caption">
          We check roof area, shading and your household usage. You get a
          written estimate, with the assumptions explained.
        </figcaption>
      </figure>
      <form action="#" method="get" class="cta-solar-survey__form">
        <h3 class="cta-solar-survey__form-title">
          Start with a free roof survey
        </h3>
        <label for="cta-solar-survey-postcode" class="cta-solar-survey__label">
          Your postcode
        </label>
        <input
          id="cta-solar-survey-postcode"
          name="postcode"
          type="text"
          required=""
          autocomplete="postal-code"
          aria-describedby="cta-solar-survey-hint"
          class="cta-solar-survey__input"
        />
        <p id="cta-solar-survey-hint" class="cta-solar-survey__hint">
          We currently survey homes in Bristol and Bath. No sales call until you
          ask for one.
        </p>
        <div class="cta-solar-survey__actions">
          <button type="submit" class="cta-solar-survey__action">
            Check my area
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
