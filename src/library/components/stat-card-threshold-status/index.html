<article class="stat-card-threshold-status">
  <div aria-hidden="true" class="stat-card-threshold-status__status-rail">
    <span class="stat-card-threshold-status__status-band stat-card-threshold-status__status-band--inactive"></span>
    <span class="stat-card-threshold-status__status-band stat-card-threshold-status__status-band--active"></span>
    <span class="stat-card-threshold-status__status-band stat-card-threshold-status__status-band--inactive"></span>
  </div>
  <div>
    <h3 class="stat-card-threshold-status__metric-label">Current capacity</h3>
    <p class="stat-card-threshold-status__value">64%</p>
    <p class="stat-card-threshold-status__status-label">Within operating range</p>
    <dl class="stat-card-threshold-status__limits">
      <div class="stat-card-threshold-status__limit-row">
        <dt class="stat-card-threshold-status__limit-label">Lower limit</dt>
        <dd class="stat-card-threshold-status__limit-value">40%</dd>
      </div>
      <div class="stat-card-threshold-status__limit-row">
        <dt class="stat-card-threshold-status__limit-label">Upper limit</dt>
        <dd class="stat-card-threshold-status__limit-value">80%</dd>
      </div>
    </dl>
  </div>
  <p class="stat-card-threshold-status__operating-note">Keep the figure between the stated limits.</p>
</article>
