<section class="signup-team-invitation">
  <div class="signup-team-invitation__panel">
    <header class="signup-team-invitation__header">
      <span class="signup-team-invitation__mark" aria-hidden="true">M</span>
      <div class="signup-team-invitation__context">
        <h2 class="signup-team-invitation__heading">Join Meridian</h2>
        <p class="signup-team-invitation__inviter">Invited by Alex Rivera · Product team</p>
      </div>
    </header>
    <form class="signup-team-invitation__form" action="#" method="post">
      <label class="signup-team-invitation__field" for="signup-team-invitation-name">
        Your full name
        <input class="signup-team-invitation__input" id="signup-team-invitation-name" name="name" type="text" autocomplete="name" placeholder="" required>
      </label>
      <label class="signup-team-invitation__field" for="signup-team-invitation-email">
        Work email
        <input class="signup-team-invitation__input" id="signup-team-invitation-email" name="email" type="email" autocomplete="email" placeholder="" required>
      </label>
      <label class="signup-team-invitation__field" for="signup-team-invitation-password">
        Create a password
        <input class="signup-team-invitation__input" id="signup-team-invitation-password" aria-describedby="signup-team-invitation-password-hint" minlength="12" name="password" type="password" autocomplete="new-password" placeholder="" required>
        <span class="signup-team-invitation__password-hint" id="signup-team-invitation-password-hint">Use at least 12 characters.</span>
      </label>
      <label class="signup-team-invitation__terms" for="signup-team-invitation-terms">
        <input class="signup-team-invitation__checkbox" type="checkbox" name="terms" id="signup-team-invitation-terms" aria-labelledby="signup-team-invitation-terms-label" aria-describedby="signup-team-invitation-terms-hint" required>
        <span class="signup-team-invitation__terms-copy">
          <span class="signup-team-invitation__terms-label" id="signup-team-invitation-terms-label">I agree to the workspace terms</span>
          <span class="signup-team-invitation__terms-hint" id="signup-team-invitation-terms-hint">Your account will belong to Meridian.</span>
        </span>
      </label>
      <button class="signup-team-invitation__submit" type="submit">Accept invitation</button>
    </form>
  </div>
</section>
