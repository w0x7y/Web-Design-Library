<article class="product-card-linen-roll">
  <div class="product-card-linen-roll__swatch" aria-hidden="true">
    <svg
      class="product-card-linen-roll__weave"
      viewBox="0 0 56 350"
      preserveAspectRatio="none"
    >
      <defs>
        <pattern
          id="product-card-linen-roll-weave"
          width="8"
          height="8"
          patternUnits="userSpaceOnUse"
        >
          <path
            d="M0 0h8M0 0v8"
            stroke="#fed7aa"
            stroke-width=".5"
            opacity=".5"
          />
        </pattern>
      </defs>
      <rect
        width="56"
        height="350"
        fill="url(#product-card-linen-roll-weave)"
      />
    </svg>
  </div>
  <div class="product-card-linen-roll__body">
    <p class="product-card-linen-roll__brand">Selvage No. 8</p>
    <h2 class="product-card-linen-roll__title">
      Rust linen,<br />cut for you.
    </h2>
    <p class="product-card-linen-roll__description">
      185gsm washed flax.<br />140cm wide, soft handle.
    </p>
    <fieldset class="product-card-linen-roll__options">
      <legend class="product-card-linen-roll__legend">Choose your cut</legend>
      <div class="product-card-linen-roll__choices">
        <label class="product-card-linen-roll__choice">
          <input
            class="product-card-linen-roll__radio"
            type="radio"
            name="product-card-linen-roll-length"
            value="one"
            checked
          />
          <span>1 metre</span>
        </label>
        <label class="product-card-linen-roll__choice">
          <input
            class="product-card-linen-roll__radio"
            type="radio"
            name="product-card-linen-roll-length"
            value="two"
          />
          <span>2 metres</span>
        </label>
      </div>
    </fieldset>
    <p class="product-card-linen-roll__price">£22 / metre</p>
    <a
      class="product-card-linen-roll__cta"
      href="#selvage-rust-linen"
      aria-label="Order cut-length Rust linen from Selvage No. 8"
      >Order a cut ↗</a
    >
  </div>
</article>
