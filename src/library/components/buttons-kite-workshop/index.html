<section aria-label="Updraft Works kite-making actions" class="buttons-kite-workshop">
  <div class="buttons-kite-workshop__header">
    <div>
      <p class="buttons-kite-workshop__brand">Updraft Works</p>
      <h2 class="buttons-kite-workshop__heading">Make it fly.</h2>
    </div>
    <svg
      aria-hidden="true"
      viewBox="0 0 48 80"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linejoin="round"
      class="buttons-kite-workshop__kite"
    >
      <path d="M24 3 43 25 24 49 5 25Z" fill="currentColor" fill-opacity=".12" />
      <path d="M24 3v46M5 25h38M24 49c-13 9 14 13 0 26M15 59l8 3-4 6" />
    </svg>
  </div>
  <button type="button" class="buttons-kite-workshop__build">
    <span>Build a diamond kite</span>
    <svg
      aria-hidden="true"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="buttons-kite-workshop__arrow"
    >
      <path d="M3 8h10M9 4l4 4-4 4" />
    </svg>
  </button>
  <div class="buttons-kite-workshop__tools">
    <button type="button" class="buttons-kite-workshop__template">Cutting template ↓</button>
    <button type="button" class="buttons-kite-workshop__colours">Pick colours</button>
  </div>
  <p class="buttons-kite-workshop__note">One sheet. Two spars. A windy afternoon.</p>
</section>
