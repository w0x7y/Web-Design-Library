<article class="profile-card-availability-slots">
  <div class="profile-card-availability-slots__identity">
    <span aria-hidden="true" class="profile-card-availability-slots__avatar">AR</span>
    <div class="profile-card-availability-slots__identity-copy">
      <h3 class="profile-card-availability-slots__person-name">Alex Rivera</h3>
      <p class="profile-card-availability-slots__person-role">Role or specialty</p>
    </div>
  </div>
  <p class="profile-card-availability-slots__description">Short context for a conversation.</p>
  <fieldset class="profile-card-availability-slots__availability">
    <legend class="profile-card-availability-slots__availability-label">Mar 14, UTC+1</legend>
    <div class="profile-card-availability-slots__time-options">
      <label class="profile-card-availability-slots__time-option"><input type="radio" name="profile-card-availability-slots-time" checked value="09:00" class="profile-card-availability-slots__time-radio">09:00</label>
      <label class="profile-card-availability-slots__time-option"><input type="radio" name="profile-card-availability-slots-time" value="11:30" class="profile-card-availability-slots__time-radio">11:30</label>
      <label class="profile-card-availability-slots__time-option"><input type="radio" name="profile-card-availability-slots-time" value="14:00" class="profile-card-availability-slots__time-radio">14:00</label>
    </div>
  </fieldset><a href="#" class="profile-card-availability-slots__action-primary">Review booking</a>
  <p class="profile-card-availability-slots__booking-hint">Confirm the time on the booking page.</p>
</article>
