<section aria-labelledby="toggles-balloon-telemetry-title" class="toggles-balloon-telemetry">
  <p class="toggles-balloon-telemetry__eyebrow">STRATOLET / FLIGHT S-17</p>
  <h2 id="toggles-balloon-telemetry-title" class="toggles-balloon-telemetry__title">Above the cloud.</h2>
  <div class="toggles-balloon-telemetry__altitude">
    <p class="toggles-balloon-telemetry__height">12,480</p>
    <p class="toggles-balloon-telemetry__unit">meters / ascending</p>
  </div>
  <div class="toggles-balloon-telemetry__capture">
    <div>
      <label for="toggles-balloon-telemetry-capture" class="toggles-balloon-telemetry__label">Capture packets</label>
      <p id="toggles-balloon-telemetry-capture-hint" class="toggles-balloon-telemetry__hint">Archive every 5 seconds.</p>
    </div>
    <input
      id="toggles-balloon-telemetry-capture"
      name="toggles-balloon-telemetry-capture"
      type="checkbox"
      role="switch"
      checked
      aria-describedby="toggles-balloon-telemetry-capture-hint"
      class="toggles-balloon-telemetry__switch"
    >
  </div>
  <dl class="toggles-balloon-telemetry__sensors">
    <div>
      <dt class="toggles-balloon-telemetry__sensor-label">Pressure</dt>
      <dd>184 hPa</dd>
    </div>
    <div>
      <dt class="toggles-balloon-telemetry__sensor-label">Battery</dt>
      <dd>92%</dd>
    </div>
  </dl>
</section>
