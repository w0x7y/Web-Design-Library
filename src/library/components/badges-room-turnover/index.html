<section aria-label="Keyfold room turnover badges" class="badges-room-turnover">
  <h2 class="badges-room-turnover__brand">Keyfold / Housekeeping</h2>
  <div class="badges-room-turnover__identity">
    <p class="badges-room-turnover__room"><span class="badges-room-turnover__caption">Room</span><span class="badges-room-turnover__number">407</span></p>
    <p class="badges-room-turnover__wing">South wing<br />Floor 04</p>
  </div>
  <p class="badges-room-turnover__status">Vacant</p>
  <fieldset aria-describedby="keyfold-check-hint" class="badges-room-turnover__checks">
    <legend class="badges-room-turnover__legend">Inspection badges</legend>
    <label class="badges-room-turnover__check"><input type="checkbox" aria-label="Room 407: linen checked" aria-describedby="keyfold-check-hint" class="badges-room-turnover__checkbox" />Linen checked</label>
    <label class="badges-room-turnover__check"><input type="checkbox" aria-label="Room 407: minibar sealed" aria-describedby="keyfold-check-hint" class="badges-room-turnover__checkbox" />Minibar sealed</label>
  </fieldset>
  <p id="keyfold-check-hint" class="badges-room-turnover__hint">Tick each check after inspection.</p>
</section>
