<div class="dropdowns-pharmacy-pickup">
  <p class="dropdowns-pharmacy-pickup__brand"><span>MORROW DOSE</span><span class="dropdowns-pharmacy-pickup__branch">Westgate pharmacy</span></p>
  <details open class="dropdowns-pharmacy-pickup__disclosure">
    <summary class="dropdowns-pharmacy-pickup__summary">
      <span><span class="dropdowns-pharmacy-pickup__title">Collect your prescription</span><span class="dropdowns-pharmacy-pickup__hint">Today, 10 October</span></span>
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="dropdowns-pharmacy-pickup__chevron">
        <path d="m4 6 4 4 4-4" />
      </svg>
    </summary>
    <fieldset aria-describedby="dropdowns-pharmacy-pickup-note" class="dropdowns-pharmacy-pickup__body">
      <legend class="dropdowns-pharmacy-pickup__legend">Collection time</legend>
      <p class="dropdowns-pharmacy-pickup__label">Choose a collection time</p>
      <div class="dropdowns-pharmacy-pickup__slots">
        <label class="dropdowns-pharmacy-pickup__slot">
          <input type="radio" name="dropdowns-pharmacy-pickup-time" value="12:30" aria-label="Collect at 12:30" class="dropdowns-pharmacy-pickup__radio" />
          <span>12:30</span>
        </label>
        <label class="dropdowns-pharmacy-pickup__slot">
          <input type="radio" name="dropdowns-pharmacy-pickup-time" value="13:00" aria-label="Collect at 13:00" checked class="dropdowns-pharmacy-pickup__radio" />
          <span>13:00</span>
        </label>
        <label class="dropdowns-pharmacy-pickup__slot">
          <input type="radio" name="dropdowns-pharmacy-pickup-time" value="13:30" aria-label="Collect at 13:30" class="dropdowns-pharmacy-pickup__radio" />
          <span>13:30</span>
        </label>
      </div>
    </fieldset>
    <p id="dropdowns-pharmacy-pickup-note" class="dropdowns-pharmacy-pickup__note">Bring your collection code. We will hold your order for 7 days.</p>
  </details>
</div>
