<section class="inputs-grooming-profile" aria-label="Fluffday coat profile">
  <header class="inputs-grooming-profile__header">
    <img
      class="inputs-grooming-profile__photo"
      src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=800&q=80"
      alt="Golden retriever holding a flower"
      width="800"
      height="1283"
    >
    <div>
      <p class="inputs-grooming-profile__brand">Fluffday grooming</p>
      <h2 class="inputs-grooming-profile__heading">Meet the fluff.</h2>
    </div>
  </header>
  <label class="inputs-grooming-profile__label" for="inputs-grooming-profile-name">Dog's name</label>
  <input class="inputs-grooming-profile__name" id="inputs-grooming-profile-name" name="pet-name" type="text" value="Biscuit">
  <fieldset class="inputs-grooming-profile__fieldset">
    <legend class="inputs-grooming-profile__legend">Coat length</legend>
    <div class="inputs-grooming-profile__choices">
      <label class="inputs-grooming-profile__choice">
        <input class="inputs-grooming-profile__radio" name="inputs-grooming-profile-coat" type="radio" value="short" checked>
        <span>Short</span>
      </label>
      <label class="inputs-grooming-profile__choice">
        <input class="inputs-grooming-profile__radio" name="inputs-grooming-profile-coat" type="radio" value="long">
        <span>Long</span>
      </label>
    </div>
  </fieldset>
</section>
