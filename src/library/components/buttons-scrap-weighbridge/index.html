<section aria-label="Ferric Yard weighbridge actions" class="buttons-scrap-weighbridge">
  <div class="buttons-scrap-weighbridge__header">
    <span>Ferric Yard</span>
    <span>WB / 02</span>
  </div>
  <div class="buttons-scrap-weighbridge__body">
    <h2 class="buttons-scrap-weighbridge__heading">WEIGH. SORT. PAY.</h2>
    <p class="buttons-scrap-weighbridge__hint">Mixed copper · Load FY-184</p>
    <div class="buttons-scrap-weighbridge__actions">
      <button type="button" class="buttons-scrap-weighbridge__weigh">
        <span>Record weight</span>
        <svg
          aria-hidden="true"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="buttons-scrap-weighbridge__arrow"
        >
          <path d="M3 8h10M9 4l4 4-4 4" />
        </svg>
      </button>
      <button type="button" class="buttons-scrap-weighbridge__tare">Set tare</button>
    </div>
  </div>
  <div class="buttons-scrap-weighbridge__footer">
    <button type="button" class="buttons-scrap-weighbridge__receipt">Print receipt</button>
    <button type="button" class="buttons-scrap-weighbridge__rates">Metal rates ↗</button>
  </div>
</section>
