<section aria-labelledby="toggles-waterjet-cutting-title" class="toggles-waterjet-cutting">
  <div class="toggles-waterjet-cutting__header">
    <p class="toggles-waterjet-cutting__eyebrow">KERFLINE / JOB K-218</p>
    <h2 id="toggles-waterjet-cutting-title" class="toggles-waterjet-cutting__title">After the cut.</h2>
    <p class="toggles-waterjet-cutting__material">3mm aluminum / 24 brackets</p>
  </div>
  <div class="toggles-waterjet-cutting__options">
    <div class="toggles-waterjet-cutting__option">
      <div class="toggles-waterjet-cutting__control-row">
        <span class="toggles-waterjet-cutting__option-number">01</span>
        <input
          id="toggles-waterjet-cutting-deburr"
          name="toggles-waterjet-cutting-deburr"
          type="checkbox"
          checked
          aria-describedby="toggles-waterjet-cutting-deburr-hint"
          class="toggles-waterjet-cutting__checkbox"
        >
      </div>
      <label for="toggles-waterjet-cutting-deburr" class="toggles-waterjet-cutting__label">Deburr edges</label>
      <p id="toggles-waterjet-cutting-deburr-hint" class="toggles-waterjet-cutting__option-hint">Remove the sharp cut edge.</p>
    </div>
    <div class="toggles-waterjet-cutting__option">
      <div class="toggles-waterjet-cutting__control-row">
        <span class="toggles-waterjet-cutting__option-number">02</span>
        <input
          id="toggles-waterjet-cutting-mark"
          name="toggles-waterjet-cutting-mark"
          type="checkbox"
          aria-describedby="toggles-waterjet-cutting-mark-hint"
          class="toggles-waterjet-cutting__checkbox"
        >
      </div>
      <label for="toggles-waterjet-cutting-mark" class="toggles-waterjet-cutting__label">Part marking</label>
      <p id="toggles-waterjet-cutting-mark-hint" class="toggles-waterjet-cutting__option-hint">Etch the drawing reference.</p>
    </div>
  </div>
  <p class="toggles-waterjet-cutting__note">Finishing is applied to every part.</p>
</section>
