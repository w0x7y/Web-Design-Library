<details open class="dropdowns-report-export">
  <summary class="dropdowns-report-export__summary">
    <span class="dropdowns-report-export__title">Export report</span>
    <span aria-hidden="true" class="dropdowns-report-export__arrow">↓</span>
  </summary>
  <p class="dropdowns-report-export__report">Q3 performance / 2026</p>

  <div class="dropdowns-report-export__formats">
    <button type="button" class="dropdowns-report-export__format">
      <span class="dropdowns-report-export__extension">.PDF</span>
      <span class="dropdowns-report-export__purpose">
        Print-ready document
        <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="dropdowns-report-export__icon">
          <path d="M4 12 12 4M4 4h8v8" />
        </svg>
      </span>
    </button>
    <button type="button" class="dropdowns-report-export__format">
      <span class="dropdowns-report-export__extension">.CSV</span>
      <span class="dropdowns-report-export__purpose">
        Spreadsheet data
        <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="dropdowns-report-export__icon">
          <path d="M4 12 12 4M4 4h8v8" />
        </svg>
      </span>
    </button>
    <button type="button" class="dropdowns-report-export__format dropdowns-report-export__format--last">
      <span class="dropdowns-report-export__extension">.PNG</span>
      <span class="dropdowns-report-export__purpose">
        Presentation image
        <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="dropdowns-report-export__icon">
          <path d="M4 12 12 4M4 4h8v8" />
        </svg>
      </span>
    </button>
  </div>

  <label class="dropdowns-report-export__source-option">
    <input type="checkbox" name="dropdowns-report-export-source" class="dropdowns-report-export__checkbox" />
    Include source data in download
  </label>
  <p class="dropdowns-report-export__generated">Last generated: 10 OCT 2026</p>
</details>
