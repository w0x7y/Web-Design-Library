<details open class="dropdowns-shipping-selector">
  <summary class="dropdowns-shipping-selector__summary">
    <span>
      <span class="dropdowns-shipping-selector__eyebrow">A good thing is on its way</span>
      <span class="dropdowns-shipping-selector__title">Choose delivery</span>
    </span>
    <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="dropdowns-shipping-selector__chevron">
      <path d="m4 6 4 4 4-4" />
    </svg>
  </summary>

  <fieldset aria-describedby="dropdowns-shipping-selector-note" class="dropdowns-shipping-selector__methods">
    <legend class="dropdowns-shipping-selector__sr-only">Shipping method</legend>
    <label class="dropdowns-shipping-selector__method">
      <input type="radio" name="dropdowns-shipping-selector-method" value="standard" aria-labelledby="dropdowns-shipping-selector-standard-name dropdowns-shipping-selector-standard-price" aria-describedby="dropdowns-shipping-selector-standard-hint" checked class="dropdowns-shipping-selector__radio" />
      <span class="dropdowns-shipping-selector__method-body">
        <span id="dropdowns-shipping-selector-standard-name" class="dropdowns-shipping-selector__method-name">Standard</span>
        <span id="dropdowns-shipping-selector-standard-hint" class="dropdowns-shipping-selector__estimate">3–5 working days</span>
      </span>
      <span id="dropdowns-shipping-selector-standard-price" class="dropdowns-shipping-selector__price">Free</span>
    </label>
    <label class="dropdowns-shipping-selector__method">
      <input type="radio" name="dropdowns-shipping-selector-method" value="express" aria-labelledby="dropdowns-shipping-selector-express-name dropdowns-shipping-selector-express-price" aria-describedby="dropdowns-shipping-selector-express-hint" class="dropdowns-shipping-selector__radio" />
      <span class="dropdowns-shipping-selector__method-body">
        <span id="dropdowns-shipping-selector-express-name" class="dropdowns-shipping-selector__method-name">Express</span>
        <span id="dropdowns-shipping-selector-express-hint" class="dropdowns-shipping-selector__estimate">1–2 working days</span>
      </span>
      <span id="dropdowns-shipping-selector-express-price" class="dropdowns-shipping-selector__price">$8</span>
    </label>
    <label class="dropdowns-shipping-selector__method">
      <input type="radio" name="dropdowns-shipping-selector-method" value="pickup" aria-labelledby="dropdowns-shipping-selector-pickup-name dropdowns-shipping-selector-pickup-price" aria-describedby="dropdowns-shipping-selector-pickup-hint" class="dropdowns-shipping-selector__radio" />
      <span class="dropdowns-shipping-selector__method-body">
        <span id="dropdowns-shipping-selector-pickup-name" class="dropdowns-shipping-selector__method-name">Store collection</span>
        <span id="dropdowns-shipping-selector-pickup-hint" class="dropdowns-shipping-selector__estimate">Ready tomorrow, 10am</span>
      </span>
      <span id="dropdowns-shipping-selector-pickup-price" class="dropdowns-shipping-selector__price">Free</span>
    </label>
  </fieldset>
  <p id="dropdowns-shipping-selector-note" class="dropdowns-shipping-selector__note">Orders are packed with care, Monday to Friday.</p>
</details>
