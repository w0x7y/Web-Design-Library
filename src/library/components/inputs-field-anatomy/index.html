<div class="inputs-field-anatomy">
  <div>
    <div class="inputs-field-anatomy__label-row">
      <label for="anatomy-name" class="inputs-field-anatomy__label">Display name</label>
      <span class="inputs-field-anatomy__optional">Optional</span>
    </div>
    <input id="anatomy-name" type="text" autocomplete="nickname" aria-describedby="anatomy-name-hint" placeholder="Enter display name" name="display-name" class="inputs-field-anatomy__input">
    <p id="anatomy-name-hint" class="inputs-field-anatomy__hint">Shown beside your contributions.</p>
  </div>
  <div>
    <label for="anatomy-email" class="inputs-field-anatomy__label">Email</label>
    <input id="anatomy-email" type="email" autocomplete="email" aria-invalid="true" aria-describedby="anatomy-email-error" placeholder="name@example.com" name="email" value="name@" class="inputs-field-anatomy__input">
    <p id="anatomy-email-error" class="inputs-field-anatomy__error"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="inputs-field-anatomy__icon">
      <path d="m12 3 10 18H2L12 3Z"></path>
      <path d="M12 9v5M12 17h.01"></path>
    </svg>Error: enter a valid email.</p>
  </div>
  <div>
    <label for="anatomy-account" class="inputs-field-anatomy__label">Account ID</label>
    <input id="anatomy-account" type="text" disabled aria-describedby="anatomy-account-hint" placeholder="Account ID" name="account-id" value="AC-1042" class="inputs-field-anatomy__input">
    <p id="anatomy-account-hint" class="inputs-field-anatomy__hint">This value cannot change.</p>
  </div>
</div>
