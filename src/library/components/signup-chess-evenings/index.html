<section class="signup-chess-evenings">
  <div class="signup-chess-evenings__inner">
    <div class="signup-chess-evenings__clubhouse">
      <p class="signup-chess-evenings__eyebrow">Rookery Nine / Since 2018</p>
      <h2 class="signup-chess-evenings__heading">Good moves. Better company.</h2>
      <div aria-hidden="true" class="signup-chess-evenings__board">
        <div class="signup-chess-evenings__square--light"></div>
        <div class="signup-chess-evenings__square--dark"></div>
        <div class="signup-chess-evenings__square--light"></div>
        <div class="signup-chess-evenings__square--dark"></div>
        <div class="signup-chess-evenings__square--dark"></div>
        <div class="signup-chess-evenings__square--light"></div>
        <div class="signup-chess-evenings__square--dark"></div>
        <div class="signup-chess-evenings__square--light"></div>
        <div class="signup-chess-evenings__square--light"></div>
        <div class="signup-chess-evenings__square--dark">
          <svg aria-hidden="true" viewBox="0 0 80 80" fill="currentColor" class="signup-chess-evenings__piece">
            <path d="M20 12h8v8h8v-8h8v8h8v-8h8v18l-8 7 4 23H24l4-23-8-7Z M20 64h40v8H20Z" />
          </svg>
        </div>
        <div class="signup-chess-evenings__square--light"></div>
        <div class="signup-chess-evenings__square--dark"></div>
        <div class="signup-chess-evenings__square--dark"></div>
        <div class="signup-chess-evenings__square--light"></div>
        <div class="signup-chess-evenings__square--dark"></div>
        <div class="signup-chess-evenings__square--light"></div>
      </div>
      <p
        class="signup-chess-evenings__copy"
      >
        Wednesday, 7 pm. Bring your curiosity; we have the boards. New players always get a friendly first game.
      </p>
    </div>
    <form action="#" method="post" class="signup-chess-evenings__form">
      <p class="signup-chess-evenings__form-title">Take a seat at the board</p>
      <label for="signup-chess-evenings-name" class="signup-chess-evenings__label">
        <span class="signup-chess-evenings__label-text">Your name</span>
        <input id="signup-chess-evenings-name" name="name" type="text" autocomplete="name" required class="signup-chess-evenings__field" />
      </label>
      <label for="signup-chess-evenings-email" class="signup-chess-evenings__label">
        <span class="signup-chess-evenings__label-text">Your email</span>
        <input id="signup-chess-evenings-email" name="email" type="email" autocomplete="email" required class="signup-chess-evenings__field" />
      </label>
      <fieldset class="signup-chess-evenings__choices">
        <legend class="signup-chess-evenings__legend">How do you play?</legend>
        <div class="signup-chess-evenings__choice-grid">
          <label class="signup-chess-evenings__choice">
            <input type="radio" name="experience" value="new" checked class="signup-chess-evenings__radio" />
            <span class="signup-chess-evenings__choice-text">
              <span class="signup-chess-evenings__choice-title">I am new to chess</span>
              <span class="signup-chess-evenings__choice-detail">Learn the rules with a club host.</span>
            </span>
          </label>
          <label class="signup-chess-evenings__choice">
            <input type="radio" name="experience" value="regular" class="signup-chess-evenings__radio" />
            <span class="signup-chess-evenings__choice-text">
              <span class="signup-chess-evenings__choice-title">I already play</span>
              <span class="signup-chess-evenings__choice-detail">Casual games and our monthly ladder.</span>
            </span>
          </label>
        </div>
      </fieldset>
      <button type="submit" class="signup-chess-evenings__cta">Join the Wednesday club</button>
      <p class="signup-chess-evenings__hint">£6 per evening. Your first visit is on us.</p>
    </form>
  </div>
</section>
