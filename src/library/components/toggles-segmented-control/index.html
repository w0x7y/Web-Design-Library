<div class="toggles-segmented-control">
  <fieldset>
    <legend class="toggles-segmented-control__caption">Time range</legend>
    <div class="toggles-segmented-control__track toggles-segmented-control__track--text">
      <label class="toggles-segmented-control__segment toggles-segmented-control__segment--text"><input type="radio" name="toggles-segmented-control-range" value="day" class="toggles-segmented-control__input">Day</label>
      <label class="toggles-segmented-control__segment toggles-segmented-control__segment--text"><input type="radio" name="toggles-segmented-control-range" checked value="week" class="toggles-segmented-control__input">Week</label>
      <label class="toggles-segmented-control__segment toggles-segmented-control__segment--text"><input type="radio" name="toggles-segmented-control-range" value="month" class="toggles-segmented-control__input">Month</label>
      <label class="toggles-segmented-control__segment toggles-segmented-control__segment--text"><input type="radio" disabled name="toggles-segmented-control-range" value="year" class="toggles-segmented-control__input">Year</label>
    </div>
  </fieldset>
  <fieldset>
    <legend class="toggles-segmented-control__caption">View</legend>
    <div class="toggles-segmented-control__track toggles-segmented-control__track--icons">
      <label class="toggles-segmented-control__segment toggles-segmented-control__segment--icon">
        <input type="radio" name="toggles-segmented-control-view" checked value="list" class="toggles-segmented-control__input">
        <span class="toggles-segmented-control__accessible-name">List view</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="toggles-segmented-control__icon">
          <path d="M9 5h12M9 12h12M9 19h12M3 5h.01M3 12h.01M3 19h.01"></path>
        </svg>
        <span aria-hidden="true" class="toggles-segmented-control__selection-dot"></span>
      </label>
      <label class="toggles-segmented-control__segment toggles-segmented-control__segment--icon">
        <input type="radio" name="toggles-segmented-control-view" value="grid" class="toggles-segmented-control__input">
        <span class="toggles-segmented-control__accessible-name">Grid view</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="toggles-segmented-control__icon">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        <span aria-hidden="true" class="toggles-segmented-control__selection-dot"></span>
      </label>
    </div>
  </fieldset>
  <fieldset>
    <legend class="toggles-segmented-control__caption">Formatting</legend>
    <div class="toggles-segmented-control__formatting">
      <label class="toggles-segmented-control__toggle toggles-segmented-control__toggle--first">
        <input type="checkbox" name="toggles-segmented-control-format" checked value="bold" class="toggles-segmented-control__input">
        <span class="toggles-segmented-control__accessible-name">Bold</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="toggles-segmented-control__icon">
          <path d="M6 4h7a4 4 0 0 1 0 8H6Zm0 8h8a4 4 0 0 1 0 8H6Z"></path>
        </svg>
        <span aria-hidden="true" class="toggles-segmented-control__selection-dot"></span>
      </label>
      <label class="toggles-segmented-control__toggle toggles-segmented-control__toggle--joined">
        <input type="checkbox" name="toggles-segmented-control-format" value="italic" class="toggles-segmented-control__input">
        <span class="toggles-segmented-control__accessible-name">Italic</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="toggles-segmented-control__icon">
          <path d="M10 4h9M5 20h9M15 4 9 20"></path>
        </svg>
        <span aria-hidden="true" class="toggles-segmented-control__selection-dot"></span>
      </label>
      <label class="toggles-segmented-control__toggle toggles-segmented-control__toggle--joined toggles-segmented-control__toggle--last">
        <input type="checkbox" name="toggles-segmented-control-format" checked value="underline" class="toggles-segmented-control__input">
        <span class="toggles-segmented-control__accessible-name">Underline</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="toggles-segmented-control__icon">
          <path d="M6 4v7a6 6 0 0 0 12 0V4M4 21h16"></path>
        </svg>
        <span aria-hidden="true" class="toggles-segmented-control__selection-dot"></span>
      </label>
    </div>
  </fieldset>
</div>
