<div class="buttons-minimal">
  <!-- Small -->
  <div class="buttons-minimal__row">
    <button type="button" class="buttons-minimal__button buttons-minimal__button--sm buttons-minimal__button--primary">Publish</button>
    <button type="button" class="buttons-minimal__button buttons-minimal__button--sm buttons-minimal__button--secondary">Save draft</button>
    <button type="button" class="buttons-minimal__button buttons-minimal__button--sm buttons-minimal__button--ghost">Discard</button>
    <button type="button" aria-label="More options" class="buttons-minimal__button buttons-minimal__button--sm buttons-minimal__button--icon">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="currentColor" class="buttons-minimal__icon">
        <circle cx="3.5" cy="8" r="1.25" />
        <circle cx="8" cy="8" r="1.25" />
        <circle cx="12.5" cy="8" r="1.25" />
      </svg>
    </button>
    <button type="button" disabled class="buttons-minimal__button buttons-minimal__button--sm buttons-minimal__button--loading">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" class="buttons-minimal__spinner">
        <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-opacity="0.3" stroke-width="2" />
        <path d="M14 8a6 6 0 0 0-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      Publishing…
    </button>
  </div>

  <!-- Medium -->
