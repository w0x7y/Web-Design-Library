<div class="tabs-centered-metric">
  <h2 class="tabs-centered-metric__heading">Collection summary</h2>
  <div role="radiogroup" aria-label="Metric period" class="tabs-centered-metric__period-selector">
    <label id="tabs-centered-metric-week-label" class="tabs-centered-metric__period-option"><input id="tabs-centered-metric-week" type="radio" aria-controls="tabs-centered-metric-week-panel" name="tabs-centered-metric" checked value="week" class="tabs-centered-metric__view-input">Week</label>
    <label id="tabs-centered-metric-month-label" class="tabs-centered-metric__period-option"><input id="tabs-centered-metric-month" type="radio" aria-controls="tabs-centered-metric-month-panel" name="tabs-centered-metric" value="month" class="tabs-centered-metric__view-input">Month</label>
    <label id="tabs-centered-metric-year-label" class="tabs-centered-metric__period-option"><input id="tabs-centered-metric-year" type="radio" aria-controls="tabs-centered-metric-year-panel" name="tabs-centered-metric" value="year" class="tabs-centered-metric__view-input">Year</label>
  </div>
  <section id="tabs-centered-metric-week-panel" aria-labelledby="tabs-centered-metric-week-label" class="tabs-centered-metric__view-panel tabs-centered-metric__view-panel--week">
    <p class="tabs-centered-metric__metric-total">48</p>
    <p class="tabs-centered-metric__metric-label">Items in this period</p>
    <p class="tabs-centered-metric__metric-note">Explain the weekly total.</p>
  </section>
  <section id="tabs-centered-metric-month-panel" aria-labelledby="tabs-centered-metric-month-label" class="tabs-centered-metric__view-panel tabs-centered-metric__view-panel--month">
    <p class="tabs-centered-metric__metric-total">192</p>
    <p class="tabs-centered-metric__metric-label">Items in this period</p>
    <p class="tabs-centered-metric__metric-note">Explain the monthly total.</p>
  </section>
  <section id="tabs-centered-metric-year-panel" aria-labelledby="tabs-centered-metric-year-label" class="tabs-centered-metric__view-panel tabs-centered-metric__view-panel--year">
    <p class="tabs-centered-metric__metric-total">2,304</p>
    <p class="tabs-centered-metric__metric-label">Items in this period</p>
    <p class="tabs-centered-metric__metric-note">Explain the yearly total.</p>
  </section>
</div>
