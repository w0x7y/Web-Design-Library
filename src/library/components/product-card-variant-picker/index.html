<article class="product-card-variant-picker">
  <div role="img" aria-label="Image placeholder: product photograph showing available variants" class="product-card-variant-picker__media">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="product-card-variant-picker__icon">
      <rect x="3" y="3" width="18" height="18" rx="2"></rect>
      <circle cx="9" cy="9" r="2"></circle>
      <path d="m21 15-5-5L5 21"></path>
    </svg>
  </div>
  <div class="product-card-variant-picker__details">
    <h3 class="product-card-variant-picker__name">Product name</h3>
    <p class="product-card-variant-picker__price">$48</p>
  </div>
  <fieldset class="product-card-variant-picker__fieldset">
    <legend class="product-card-variant-picker__legend">Colour</legend>
    <div class="product-card-variant-picker__colours">
      <label class="product-card-variant-picker__option"><input type="radio" aria-label="White" name="product-card-variant-picker-colour" value="white" class="product-card-variant-picker__radio"><span class="product-card-variant-picker__swatch product-card-variant-picker__swatch--white">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="product-card-variant-picker__check">
          <path d="m5 12 4 4L19 6"></path>
        </svg>
      </span></label>
      <label class="product-card-variant-picker__option"><input type="radio" aria-label="Light grey" name="product-card-variant-picker-colour" checked value="light" class="product-card-variant-picker__radio"><span class="product-card-variant-picker__swatch product-card-variant-picker__swatch--light">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="product-card-variant-picker__check">
          <path d="m5 12 4 4L19 6"></path>
        </svg>
      </span></label>
      <label class="product-card-variant-picker__option"><input type="radio" aria-label="Mid grey" name="product-card-variant-picker-colour" value="mid" class="product-card-variant-picker__radio"><span class="product-card-variant-picker__swatch product-card-variant-picker__swatch--mid">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="product-card-variant-picker__check">
          <path d="m5 12 4 4L19 6"></path>
        </svg>
      </span></label>
      <label class="product-card-variant-picker__option"><input type="radio" aria-label="Dark grey" name="product-card-variant-picker-colour" value="dark" class="product-card-variant-picker__radio"><span class="product-card-variant-picker__swatch product-card-variant-picker__swatch--dark">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="product-card-variant-picker__check">
          <path d="m5 12 4 4L19 6"></path>
        </svg>
      </span></label>
    </div>
  </fieldset>
  <fieldset aria-describedby="product-card-variant-picker-size-hint" class="product-card-variant-picker__fieldset">
    <legend class="product-card-variant-picker__legend product-card-variant-picker__legend--size">Size<span id="product-card-variant-picker-size-hint" class="product-card-variant-picker__size-hint">XL unavailable</span></legend>
    <div class="product-card-variant-picker__sizes">
      <label class="product-card-variant-picker__option"><input type="radio" aria-label="Size S" name="product-card-variant-picker-size" value="S" class="product-card-variant-picker__radio"><span class="product-card-variant-picker__size">S</span></label>
      <label class="product-card-variant-picker__option"><input type="radio" aria-label="Size M" name="product-card-variant-picker-size" checked value="M" class="product-card-variant-picker__radio"><span class="product-card-variant-picker__size">M</span></label>
      <label class="product-card-variant-picker__option"><input type="radio" aria-label="Size L" name="product-card-variant-picker-size" value="L" class="product-card-variant-picker__radio"><span class="product-card-variant-picker__size">L</span></label>
      <label class="product-card-variant-picker__option product-card-variant-picker__option--disabled"><input type="radio" aria-label="Size XL" disabled aria-describedby="product-card-variant-picker-size-hint" name="product-card-variant-picker-size" value="XL" class="product-card-variant-picker__radio"><span class="product-card-variant-picker__size product-card-variant-picker__size--disabled">XL</span></label>
    </div>
  </fieldset>
  <button type="button" aria-label="Add Product name to cart" class="product-card-variant-picker__cart-action">Add to cart</button>
</article>
