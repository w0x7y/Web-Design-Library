<div class="toggles-permission-matrix">
  <table class="toggles-permission-matrix__permission-table">
    <caption class="toggles-permission-matrix__table-caption">Permissions</caption>
    <thead>
      <tr>
        <th scope="col" class="toggles-permission-matrix__column-label toggles-permission-matrix__column-label--group">Group</th>
        <th scope="col" class="toggles-permission-matrix__column-label toggles-permission-matrix__column-label--capability">View</th>
        <th scope="col" class="toggles-permission-matrix__column-label toggles-permission-matrix__column-label--capability">Edit</th>
        <th scope="col" class="toggles-permission-matrix__column-label toggles-permission-matrix__column-label--capability">Share</th>
      </tr>
    </thead>
    <tbody>
      <tr class="toggles-permission-matrix__permission-row">
        <th scope="row" class="toggles-permission-matrix__group-label">Group name</th>
        <td class="toggles-permission-matrix__permission-cell"><input id="toggles-permission-matrix-0-0" type="checkbox" aria-label="View for group name" aria-describedby="toggles-permission-matrix-hint" name="toggles-permission-matrix-0-0" checked class="toggles-permission-matrix__permission-input"></td>
        <td class="toggles-permission-matrix__permission-cell"><input id="toggles-permission-matrix-0-1" type="checkbox" aria-label="Edit for group name" aria-describedby="toggles-permission-matrix-hint" name="toggles-permission-matrix-0-1" checked class="toggles-permission-matrix__permission-input"></td>
        <td class="toggles-permission-matrix__permission-cell"><input id="toggles-permission-matrix-0-2" type="checkbox" aria-label="Share for group name" aria-describedby="toggles-permission-matrix-hint" name="toggles-permission-matrix-0-2" checked class="toggles-permission-matrix__permission-input"></td>
      </tr>
      <tr class="toggles-permission-matrix__permission-row">
        <th scope="row" class="toggles-permission-matrix__group-label">Another group</th>
        <td class="toggles-permission-matrix__permission-cell"><input id="toggles-permission-matrix-1-0" type="checkbox" aria-label="View for another group" aria-describedby="toggles-permission-matrix-hint" name="toggles-permission-matrix-1-0" checked class="toggles-permission-matrix__permission-input"></td>
        <td class="toggles-permission-matrix__permission-cell"><input id="toggles-permission-matrix-1-1" type="checkbox" aria-label="Edit for another group" aria-describedby="toggles-permission-matrix-hint" name="toggles-permission-matrix-1-1" class="toggles-permission-matrix__permission-input"></td>
        <td class="toggles-permission-matrix__permission-cell"><input id="toggles-permission-matrix-1-2" type="checkbox" aria-label="Share for another group" aria-describedby="toggles-permission-matrix-hint" name="toggles-permission-matrix-1-2" class="toggles-permission-matrix__permission-input"></td>
      </tr>
      <tr class="toggles-permission-matrix__permission-row">
        <th scope="row" class="toggles-permission-matrix__group-label">Final group</th>
        <td class="toggles-permission-matrix__permission-cell"><input id="toggles-permission-matrix-2-0" type="checkbox" aria-label="View for final group" aria-describedby="toggles-permission-matrix-hint" name="toggles-permission-matrix-2-0" checked class="toggles-permission-matrix__permission-input"></td>
        <td class="toggles-permission-matrix__permission-cell"><input id="toggles-permission-matrix-2-1" type="checkbox" aria-label="Edit for final group" aria-describedby="toggles-permission-matrix-hint" name="toggles-permission-matrix-2-1" class="toggles-permission-matrix__permission-input"></td>
        <td class="toggles-permission-matrix__permission-cell"><input id="toggles-permission-matrix-2-2" type="checkbox" aria-label="Share for final group" aria-describedby="toggles-permission-matrix-hint" name="toggles-permission-matrix-2-2" class="toggles-permission-matrix__permission-input"></td>
      </tr>
    </tbody>
  </table>
  <p id="toggles-permission-matrix-hint" class="toggles-permission-matrix__permission-hint">Choose permissions for each group.</p>
</div>
