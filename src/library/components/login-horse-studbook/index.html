<section class="login-horse-studbook">
  <div class="login-horse-studbook__inner">
    <header class="login-horse-studbook__header">
      <p class="login-horse-studbook__brand">Bridlefolio</p>
      <p class="login-horse-studbook__scope">The breeder’s record</p>
    </header>
    <figure class="login-horse-studbook__plate">
      <img
        src="https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=1600&q=80"
        alt="A grey horse trotting beside a dark woodland edge"
        width="1600"
        height="1066"
        class="login-horse-studbook__photo"
      >
      <figcaption class="login-horse-studbook__caption">
        <span>Pedigrees, foal records &amp; breeding notes</span>
        <span>Member access / 2026</span>
      </figcaption>
    </figure>
    <div class="login-horse-studbook__body">
      <div class="login-horse-studbook__intro">
        <h1 class="login-horse-studbook__heading">Records that run in the family.</h1>
        <p
          id="login-horse-studbook-hint"
          class="login-horse-studbook__hint"
        >
          Sign in to keep your breeding programme, mare histories and next season’s plans in order.
        </p>
      </div>
      <form action="#" method="post" class="login-horse-studbook__form">
        <label for="login-horse-studbook-email" class="login-horse-studbook__label">
          Breeder email
          <input
            id="login-horse-studbook-email"
            name="email"
            type="email"
            autocomplete="username"
            required
            aria-describedby="login-horse-studbook-hint"
            class="login-horse-studbook__input"
          >
        </label>
        <label for="login-horse-studbook-password" class="login-horse-studbook__label">
          Password
          <input
            id="login-horse-studbook-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            class="login-horse-studbook__input"
          >
        </label>
        <button type="submit" class="login-horse-studbook__submit">Open the studbook</button>
        <a href="#" class="login-horse-studbook__help">Trouble signing in?</a>
      </form>
    </div>
  </div>
</section>
