<section class="login-email-link">
  <div class="login-email-link__inner">
    <div class="login-email-link__mark">
      <svg class="login-email-link__envelope" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="5" y="12" width="38" height="26" rx="3" stroke="currentColor" stroke-width="2"></rect>
        <path d="m6 14 18 14 18-14" stroke="currentColor" stroke-width="2"></path>
      </svg>
    </div>
    <h2 class="login-email-link__heading">A link. And you’re in.</h2>
    <p class="login-email-link__description">Enter your email and we’ll send a sign-in link. No password to remember.</p>
    <form class="login-email-link__form" action="#" method="post">
      <label class="login-email-link__field" for="login-email-link-email">
        Email address
        <input class="login-email-link__input" id="login-email-link-email" aria-describedby="login-email-link-expiry" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </label>
      <button class="login-email-link__submit" type="submit">Send sign-in link</button>
    </form>
    <p class="login-email-link__expiry" id="login-email-link-expiry">The link expires after 15 minutes.</p>
    <div class="login-email-link__footer">
      <a class="login-email-link__back" href="#">Back to the website</a>
    </div>
  </div>
</section>
