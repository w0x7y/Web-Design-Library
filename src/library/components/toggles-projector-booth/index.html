<section aria-labelledby="toggles-projector-booth-title" class="toggles-projector-booth">
  <p class="toggles-projector-booth__eyebrow">FRAMEWELL / BOOTH 02</p>
  <h2 id="toggles-projector-booth-title" class="toggles-projector-booth__title">Run the evening.</h2>
  <div class="toggles-projector-booth__cue">
    <span class="toggles-projector-booth__cue-number">19:30</span>
    <span>Feature cue / screen 2</span>
  </div>
  <div class="toggles-projector-booth__master">
    <div>
      <label for="toggles-projector-booth-automation" class="toggles-projector-booth__label">Auto-run cues</label>
      <p id="toggles-projector-booth-automation-hint" class="toggles-projector-booth__hint">Lights, masking and credits.</p>
    </div>
    <input
      id="toggles-projector-booth-automation"
      name="toggles-projector-booth-automation"
      type="checkbox"
      role="switch"
      checked
      aria-describedby="toggles-projector-booth-automation-hint"
      class="toggles-projector-booth__master-switch"
    >
  </div>
  <div class="toggles-projector-booth__backup">
    <input
      id="toggles-projector-booth-backup"
      name="toggles-projector-booth-backup"
      type="checkbox"
      checked
      aria-describedby="toggles-projector-booth-backup-hint"
      class="toggles-projector-booth__checkbox"
    >
    <div>
      <label for="toggles-projector-booth-backup" class="toggles-projector-booth__label">Keep a local cue copy</label>
      <p id="toggles-projector-booth-backup-hint" class="toggles-projector-booth__hint">Stored on the booth console.</p>
    </div>
  </div>
</section>
