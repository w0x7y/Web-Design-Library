<section class="login-qr-code">
  <div class="login-qr-code__container">
    <div class="login-qr-code__card">
      <div class="login-qr-code__body">
        <div>
          <h1 class="login-qr-code__title">Sign in with your phone</h1>
          <p class="login-qr-code__lede">Scan the code with the mobile app on a phone where you are already signed in.</p>
          <ol role="list" class="login-qr-code__steps">
            <li class="login-qr-code__step">
              <span aria-hidden="true" class="login-qr-code__step-number">1</span>
              <span class="login-qr-code__step-text">Open the app on your phone.</span>
            </li>
            <li class="login-qr-code__step">
              <span aria-hidden="true" class="login-qr-code__step-number">2</span>
              <span class="login-qr-code__step-text">Tap Menu, then Scan sign-in code.</span>
            </li>
            <li class="login-qr-code__step">
              <span aria-hidden="true" class="login-qr-code__step-number">3</span>
              <span class="login-qr-code__step-text">Point the camera at the code on this screen.</span>
            </li>
          </ol>
          <label class="login-qr-code__remember"><input type="checkbox" name="remember" class="login-qr-code__checkbox">Keep me signed in on this browser</label>
        </div>
        <figure class="login-qr-code__code">
          <div role="img" aria-label="QR code placeholder: sign-in code to scan with your phone" class="login-qr-code__qr">
            <span aria-hidden="true" class="login-qr-code__finder login-qr-code__finder--top-left"><span class="login-qr-code__finder-dot"></span></span>
            <span aria-hidden="true" class="login-qr-code__finder login-qr-code__finder--top-right"><span class="login-qr-code__finder-dot"></span></span>
            <span aria-hidden="true" class="login-qr-code__finder login-qr-code__finder--bottom-left"><span class="login-qr-code__finder-dot"></span></span>
            <span aria-hidden="true" class="login-qr-code__alignment"><span class="login-qr-code__alignment-dot"></span></span>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="login-qr-code__phone-glyph">
              <rect x="6" y="2" width="12" height="20" rx="2"></rect>
              <path d="M11 18h2"></path>
            </svg>
          </div>
          <figcaption class="login-qr-code__caption">The code refreshes every 60 seconds.</figcaption>
        </figure>
      </div>
      <div class="login-qr-code__footer">
        <p class="login-qr-code__fallback-note">No phone nearby or camera unavailable?</p>
        <a href="#" class="login-qr-code__fallback-action">Sign in with email instead</a>
      </div>
    </div>
  </div>
</section>
