<section aria-labelledby="toggles-braille-embosser-title" class="toggles-braille-embosser">
  <p class="toggles-braille-embosser__eyebrow">DOTSTEAD / EMBOSS QUEUE</p>
  <div class="toggles-braille-embosser__proof">
    <svg aria-hidden="true" viewBox="0 0 40 56" fill="currentColor" class="toggles-braille-embosser__dots">
      <circle cx="9" cy="9" r="4"></circle>
      <circle cx="29" cy="9" r="4"></circle>
      <circle cx="9" cy="27" r="4"></circle>
      <circle cx="29" cy="27" r="4"></circle>
      <circle cx="9" cy="45" r="4"></circle>
      <circle cx="29" cy="45" r="4"></circle>
    </svg>
    <div>
      <h2 id="toggles-braille-embosser-title" class="toggles-braille-embosser__title">Prepare the proof.</h2>
      <p class="toggles-braille-embosser__job">D-041 / 12 pages</p>
    </div>
  </div>
  <div class="toggles-braille-embosser__settings">
    <div class="toggles-braille-embosser__setting">
      <div>
        <label for="toggles-braille-embosser-duplex" class="toggles-braille-embosser__label">Interpoint</label>
        <p id="toggles-braille-embosser-duplex-hint" class="toggles-braille-embosser__hint">Emboss both sides.</p>
      </div>
      <input
        id="toggles-braille-embosser-duplex"
        name="toggles-braille-embosser-duplex"
        type="checkbox"
        role="switch"
        checked
        aria-describedby="toggles-braille-embosser-duplex-hint"
        class="toggles-braille-embosser__switch"
      >
    </div>
    <div class="toggles-braille-embosser__setting">
      <div>
        <label for="toggles-braille-embosser-proof" class="toggles-braille-embosser__label">One-page proof</label>
        <p id="toggles-braille-embosser-proof-hint" class="toggles-braille-embosser__hint">Pause after page one.</p>
      </div>
      <input
        id="toggles-braille-embosser-proof"
        name="toggles-braille-embosser-proof"
        type="checkbox"
        role="switch"
        aria-describedby="toggles-braille-embosser-proof-hint"
        class="toggles-braille-embosser__switch"
      >
    </div>
  </div>
  <p class="toggles-braille-embosser__footnote">English UEB / contracted braille</p>
</section>
