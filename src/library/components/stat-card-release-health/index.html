<article class="stat-card-release-health">
  <div class="stat-card-release-health__header">
    <h2 class="stat-card-release-health__title">Release health</h2>
    <span class="stat-card-release-health__status">On track</span>
  </div>
  <!-- Visible percentage labels the decorative ring -->
  <div class="stat-card-release-health__summary">
    <div class="stat-card-release-health__gauge">
      <svg aria-hidden="true" viewBox="0 0 100 100" class="stat-card-release-health__ring" fill="none" stroke-width="8">
        <circle cx="50" cy="50" r="42" stroke="#e2e8f0" />
        <circle cx="50" cy="50" r="42" stroke="#059669" stroke-dasharray="260 264" stroke-linecap="round" />
      </svg>
      <p class="stat-card-release-health__rate">98.6<span class="stat-card-release-health__percent">%</span></p>
    </div>
    <div>
      <p class="stat-card-release-health__metric-label">Successful builds</p>
      <p class="stat-card-release-health__change">↑ 1.2 percentage points</p>
      <p class="stat-card-release-health__period">vs. previous 30 days</p>
    </div>
  </div>
  <dl class="stat-card-release-health__totals">
    <div>
      <dt class="stat-card-release-health__term">Passed</dt>
      <dd class="stat-card-release-health__value">706</dd>
    </div>
    <div>
      <dt class="stat-card-release-health__term">Failed</dt>
      <dd class="stat-card-release-health__value">10</dd>
    </div>
  </dl>
  <a aria-label="View build report: Release health" href="#release-health-report" class="stat-card-release-health__report">
    View build report
    <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" class="stat-card-release-health__arrow">
      <path d="M5 15 15 5M5 5h10v10" />
    </svg>
  </a>
</article>
