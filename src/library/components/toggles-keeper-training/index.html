<section aria-labelledby="toggles-keeper-training-title" class="toggles-keeper-training">
  <div class="toggles-keeper-training__header">
    <p class="toggles-keeper-training__eyebrow">KEEPERSCHOOL / COHORT 09</p>
    <h2 id="toggles-keeper-training-title" class="toggles-keeper-training__title">Your training plan</h2>
    <p class="toggles-keeper-training__cohort">4 supervised practical modules</p>
  </div>
  <div class="toggles-keeper-training__module-grid">
    <div class="toggles-keeper-training__module">
      <div class="toggles-keeper-training__module-status">
        <p id="toggles-keeper-training-feeding-hint" class="toggles-keeper-training__module-id">Unit K-01</p>
        <input
          id="toggles-keeper-training-feeding"
          name="toggles-keeper-training-feeding"
          type="checkbox"
          checked
          aria-describedby="toggles-keeper-training-feeding-hint"
          class="toggles-keeper-training__checkbox"
        >
      </div>
      <label for="toggles-keeper-training-feeding" class="toggles-keeper-training__label">Feeding</label>
    </div>
    <div class="toggles-keeper-training__module">
      <div class="toggles-keeper-training__module-status">
        <p id="toggles-keeper-training-enrichment-hint" class="toggles-keeper-training__module-id">Unit K-02</p>
        <input
          id="toggles-keeper-training-enrichment"
          name="toggles-keeper-training-enrichment"
          type="checkbox"
          checked
          aria-describedby="toggles-keeper-training-enrichment-hint"
          class="toggles-keeper-training__checkbox"
        >
      </div>
      <label for="toggles-keeper-training-enrichment" class="toggles-keeper-training__label">Enrichment</label>
    </div>
    <div class="toggles-keeper-training__module">
      <div class="toggles-keeper-training__module-status">
        <p id="toggles-keeper-training-records-hint" class="toggles-keeper-training__module-id">Unit K-03</p>
        <input
          id="toggles-keeper-training-records"
          name="toggles-keeper-training-records"
          type="checkbox"
          aria-describedby="toggles-keeper-training-records-hint"
          class="toggles-keeper-training__checkbox"
        >
      </div>
      <label for="toggles-keeper-training-records" class="toggles-keeper-training__label">Care records</label>
    </div>
    <div class="toggles-keeper-training__module">
      <div class="toggles-keeper-training__module-status">
        <p id="toggles-keeper-training-entry-hint" class="toggles-keeper-training__module-id">Unit K-04</p>
        <input
          id="toggles-keeper-training-entry"
          name="toggles-keeper-training-entry"
          type="checkbox"
          checked
          aria-describedby="toggles-keeper-training-entry-hint"
          class="toggles-keeper-training__checkbox"
        >
      </div>
      <label for="toggles-keeper-training-entry" class="toggles-keeper-training__label">Safe entry</label>
    </div>
  </div>
  <p class="toggles-keeper-training__policy">Include selected modules in your training plan.</p>
</section>
