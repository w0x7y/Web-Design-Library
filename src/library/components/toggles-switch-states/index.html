<div class="toggles-switch-states">
  <fieldset>
    <legend class="toggles-switch-states__caption">Default · 44×24</legend>
    <div class="toggles-switch-states__states">
      <label class="toggles-switch-states__option">
        <input type="checkbox" role="switch" aria-label="Default switch: off" class="toggles-switch-states__input">
        <span aria-hidden="true" class="toggles-switch-states__track">
          <span class="toggles-switch-states__knob"></span>
        </span>
        <span>Off</span>
      </label>
      <label class="toggles-switch-states__option">
        <input type="checkbox" role="switch" aria-label="Default switch: on" checked class="toggles-switch-states__input">
        <span aria-hidden="true" class="toggles-switch-states__track">
          <span class="toggles-switch-states__knob"></span>
        </span>
        <span>On</span>
      </label>
      <label class="toggles-switch-states__option">
        <input type="checkbox" role="switch" aria-label="Default switch: disabled off" disabled class="toggles-switch-states__input">
        <span aria-hidden="true" class="toggles-switch-states__track">
          <span class="toggles-switch-states__knob"></span>
        </span>
        <span class="toggles-switch-states__disabled-label">Disabled off</span>
      </label>
      <label class="toggles-switch-states__option">
        <input type="checkbox" role="switch" aria-label="Default switch: disabled on" disabled checked class="toggles-switch-states__input">
        <span aria-hidden="true" class="toggles-switch-states__track">
          <span class="toggles-switch-states__knob"></span>
        </span>
        <span class="toggles-switch-states__disabled-label">Disabled on</span>
      </label>
    </div>
  </fieldset>
  <fieldset>
    <legend class="toggles-switch-states__caption">Small · 36×20</legend>
    <div class="toggles-switch-states__states">
      <label class="toggles-switch-states__option">
        <input type="checkbox" role="switch" aria-label="Small switch: off" class="toggles-switch-states__input">
        <span aria-hidden="true" class="toggles-switch-states__track toggles-switch-states__track--small">
          <span class="toggles-switch-states__knob toggles-switch-states__knob--small"></span>
        </span>
        <span>Off</span>
      </label>
      <label class="toggles-switch-states__option">
        <input type="checkbox" role="switch" aria-label="Small switch: on" checked class="toggles-switch-states__input">
        <span aria-hidden="true" class="toggles-switch-states__track toggles-switch-states__track--small">
          <span class="toggles-switch-states__knob toggles-switch-states__knob--small"></span>
        </span>
        <span>On</span>
      </label>
      <label class="toggles-switch-states__option">
        <input type="checkbox" role="switch" aria-label="Small switch: disabled off" disabled class="toggles-switch-states__input">
        <span aria-hidden="true" class="toggles-switch-states__track toggles-switch-states__track--small">
          <span class="toggles-switch-states__knob toggles-switch-states__knob--small"></span>
        </span>
        <span class="toggles-switch-states__disabled-label">Disabled off</span>
      </label>
      <label class="toggles-switch-states__option">
        <input type="checkbox" role="switch" aria-label="Small switch: disabled on" disabled checked class="toggles-switch-states__input">
        <span aria-hidden="true" class="toggles-switch-states__track toggles-switch-states__track--small">
          <span class="toggles-switch-states__knob toggles-switch-states__knob--small"></span>
        </span>
        <span class="toggles-switch-states__disabled-label">Disabled on</span>
      </label>
    </div>
  </fieldset>
</div>
