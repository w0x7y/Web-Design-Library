<section aria-label="Sporeline harvest actions" class="buttons-mushroom-harvest">
  <div class="buttons-mushroom-harvest__header">
    <img
      src="https://images.unsplash.com/photo-1504545102780-26774c1bb073?w=800&q=80"
      alt="Brown chestnut mushrooms on a grey work surface"
      width="800"
      height="1098"
      class="buttons-mushroom-harvest__photo"
    />
    <div>
      <p class="buttons-mushroom-harvest__brand">Sporeline</p>
      <h2 class="buttons-mushroom-harvest__heading">Chestnut crop, bay 4</h2>
    </div>
  </div>
  <div class="buttons-mushroom-harvest__actions">
    <button type="button" class="buttons-mushroom-harvest__harvest">
      <span>Log this harvest</span>
      <svg
        aria-hidden="true"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="buttons-mushroom-harvest__arrow"
      >
        <path d="M3 8h10M9 4l4 4-4 4" />
      </svg>
    </button>
    <button type="button" class="buttons-mushroom-harvest__packing">
      <span>Print crate labels</span>
      <span aria-label="24 crates" class="buttons-mushroom-harvest__count">24</span>
    </button>
  </div>
  <p class="buttons-mushroom-harvest__note">Picked today · Packed by 14:00</p>
</section>
