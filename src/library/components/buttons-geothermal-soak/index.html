<section aria-label="Fumarole geothermal spa booking actions" class="buttons-geothermal-soak">

  <h2 class="buttons-geothermal-soak__heading">Evening springs</h2>
  <p class="buttons-geothermal-soak__hint">Mineral pools · Thursday, 15 October</p>
  <div class="buttons-geothermal-soak__bookings">
    <button type="button" class="buttons-geothermal-soak__soak">
      <span class="buttons-geothermal-soak__action-label">Book soak</span>
      <span class="buttons-geothermal-soak__action-note">18:30 · 60 min</span>
    </button>
    <button type="button" aria-label="Add a towel set to the evening soak" class="buttons-geothermal-soak__towels">
      <span class="buttons-geothermal-soak__action-label">Add</span>
      <span class="buttons-geothermal-soak__action-note">Towel set</span>

  </div>
  <button type="button" class="buttons-geothermal-soak__guide">
    <span>View bathing guide</span>
    <span aria-hidden="true">↗</span>
