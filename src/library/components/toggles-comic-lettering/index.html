<section aria-labelledby="toggles-comic-lettering-title" class="toggles-comic-lettering">
  <p class="toggles-comic-lettering__eyebrow">PANELKIND / LETTERING DESK</p>
  <h2 id="toggles-comic-lettering-title" class="toggles-comic-lettering__title">Give it a little drama.</h2>
  <div aria-label="Lettering preview: Zap!" class="toggles-comic-lettering__specimen">Zap!</div>
  <div class="toggles-comic-lettering__options">
    <div>
      <div class="toggles-comic-lettering__control-row">
        <label for="toggles-comic-lettering-slant" class="toggles-comic-lettering__label">Slant</label>
        <input
          id="toggles-comic-lettering-slant"
          name="toggles-comic-lettering-slant"
          type="checkbox"
          checked
          aria-describedby="toggles-comic-lettering-slant-hint"
          class="toggles-comic-lettering__checkbox"
        >
      </div>
      <p id="toggles-comic-lettering-slant-hint" class="toggles-comic-lettering__hint">An italic lean.</p>
    </div>
    <div>
      <div class="toggles-comic-lettering__control-row">
        <label for="toggles-comic-lettering-caps" class="toggles-comic-lettering__label">Caps</label>
        <input
          id="toggles-comic-lettering-caps"
          name="toggles-comic-lettering-caps"
          type="checkbox"
          checked
          aria-describedby="toggles-comic-lettering-caps-hint"
          class="toggles-comic-lettering__checkbox"
        >
      </div>
      <p id="toggles-comic-lettering-caps-hint" class="toggles-comic-lettering__hint">Make it loud.</p>
    </div>
  </div>
  <p class="toggles-comic-lettering__footnote">Preview updates as you toggle.</p>
</section>
