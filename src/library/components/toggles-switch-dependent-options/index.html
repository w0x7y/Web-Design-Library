<div class="toggles-switch-dependent-options">
  <div class="toggles-switch-dependent-options__enable-row">
    <div>
      <label for="toggles-switch-dependent-options-enabled" class="toggles-switch-dependent-options__switch-label">Enable summaries</label>
      <p id="toggles-switch-dependent-options-hint" class="toggles-switch-dependent-options__switch-hint">Control summary delivery.</p>
    </div>
    <label class="toggles-switch-dependent-options__switch-control">
      <input id="toggles-switch-dependent-options-enabled" type="checkbox" role="switch" aria-label="Enable summaries" aria-describedby="toggles-switch-dependent-options-hint" name="toggles-switch-dependent-options-enabled" checked class="toggles-switch-dependent-options__switch-input">
      <span aria-hidden="true" class="toggles-switch-dependent-options__switch-track">
        <span class="toggles-switch-dependent-options__switch-thumb"></span>
      </span>
    </label>
  </div>
  <fieldset class="toggles-switch-dependent-options__dependent-panel">
    <legend class="toggles-switch-dependent-options__delivery-legend">Delivery choices</legend>
    <div class="toggles-switch-dependent-options__delivery-options">
      <label class="toggles-switch-dependent-options__delivery-label"><input type="checkbox" aria-describedby="toggles-switch-dependent-options-hint" name="daily" checked class="toggles-switch-dependent-options__delivery-checkbox">Daily summary</label>
      <label class="toggles-switch-dependent-options__delivery-label"><input type="checkbox" aria-describedby="toggles-switch-dependent-options-hint" name="weekly" class="toggles-switch-dependent-options__delivery-checkbox">Weekly summary</label>
    </div>
    <p class="toggles-switch-dependent-options__delivery-note">Choose one or both delivery intervals.</p>
  </fieldset>
</div>
