<section aria-label="Gift note fields" class="inputs-postal-note">
  <div class="inputs-postal-note__header">
    <h2 class="inputs-postal-note__heading">A little note</h2>
    <span aria-hidden="true" class="inputs-postal-note__stamp">✦</span>
  </div>
  <label for="inputs-postal-note-from" class="inputs-postal-note__label inputs-postal-note__label--sender">From</label>
  <input
    id="inputs-postal-note-from"
    type="text"
    autocomplete="name"
    class="inputs-postal-note__sender"
    name="sender"
    value="Jules"
  />
  <label for="inputs-postal-note-message" class="inputs-postal-note__label inputs-postal-note__label--message">Your message</label>
  <textarea id="inputs-postal-note-message" name="message" aria-describedby="inputs-postal-note-hint" maxlength="180" class="inputs-postal-note__message">For the slow mornings and the good conversations. Happy birthday, Bea.</textarea>
  <p id="inputs-postal-note-hint" class="inputs-postal-note__hint">Up to 180 characters. Printed on a gift card.</p>
</section>
