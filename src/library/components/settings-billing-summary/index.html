<section class="settings-billing-summary">
  <div class="settings-billing-summary__inner">
    <header class="settings-billing-summary__header">
      <div class="settings-billing-summary__intro">
        <h2 class="settings-billing-summary__heading">Plan &amp; billing</h2>
        <p class="settings-billing-summary__description">Everything about your subscription.</p>
      </div>
      <span class="settings-billing-summary__renewal">Renews November 10</span>
    </header>
    <div class="settings-billing-summary__cards">
      <article class="settings-billing-summary__plan">
        <p class="settings-billing-summary__eyebrow">CURRENT PLAN</p>
        <div class="settings-billing-summary__price-row">
          <h3 class="settings-billing-summary__plan-name">Team</h3>
          <p class="settings-billing-summary__price">$49 / month</p>
        </div>
        <p class="settings-billing-summary__usage">12 of 15 seats in use</p>
        <meter class="settings-billing-summary__meter" min="0" max="15" value="12" aria-label="Team seats used">12 of 15 seats</meter>
        <a class="settings-billing-summary__compare" href="#">Compare plans</a>
      </article>
      <article class="settings-billing-summary__payment">
        <p class="settings-billing-summary__eyebrow">PAYMENT METHOD</p>
        <p class="settings-billing-summary__card-number">Visa ···· 4242</p>
        <p class="settings-billing-summary__expiry">Expires 08/2028</p>
        <button class="settings-billing-summary__update" type="button">Update payment method</button>
      </article>
    </div>
    <div class="settings-billing-summary__footer">
      <div class="settings-billing-summary__invoice-copy">
        <p class="settings-billing-summary__invoice-label">Next invoice</p>
        <p class="settings-billing-summary__invoice-date">November 10 · Estimated $49.00</p>
      </div>
      <a class="settings-billing-summary__invoice-link" href="#">View all invoices</a>
    </div>
  </div>
</section>
