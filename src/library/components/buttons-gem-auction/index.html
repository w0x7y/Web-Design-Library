<section aria-label="Prismere gemstone auction actions" class="buttons-gem-auction">
  <svg
    aria-hidden="true"
    viewBox="0 0 96 96"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linejoin="round"
    class="buttons-gem-auction__gem"
  >
    <path d="M16 20h64l12 24-44 48L4 44Z" fill="white" fill-opacity=".4" />
    <path d="M4 44h88M16 20l16 24 16 48 16-48 16-24M32 44l16-24 16 24" />
  </svg>
  <div class="buttons-gem-auction__header">
    <p class="buttons-gem-auction__brand">Prismere</p>
    <p class="buttons-gem-auction__lot">Lot 026 · 2.4 ct</p>
    <h2 class="buttons-gem-auction__heading">Peach morganite</h2>
  </div>
  <div class="buttons-gem-auction__bid-pane">
    <div class="buttons-gem-auction__price-row">
      <p class="buttons-gem-auction__price">$420</p>
      <p class="buttons-gem-auction__label">Current bid / USD</p>
    </div>
    <button type="button" class="buttons-gem-auction__bid">Place bid · $450</button>
    <button type="button" class="buttons-gem-auction__watch">
      <svg
        aria-hidden="true"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        class="buttons-gem-auction__watch-icon"
      >
        <path d="M4 2h8v12l-4-3-4 3Z" />
      </svg>
      <span>Watch lot 026</span>
    </button>
  </div>
  <button type="button" class="buttons-gem-auction__report">
    <span>View stone report</span>
    <span aria-hidden="true">↗</span>
  </button>
</section>
