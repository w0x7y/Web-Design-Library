<div class="dropdowns-microchip-bins">
  <span aria-hidden="true" class="dropdowns-microchip-bins__beam"></span>
  <p class="dropdowns-microchip-bins__header"><span>DIELEDGER</span><span class="dropdowns-microchip-bins__tag">TRAY / 07</span></p>
  <details open class="dropdowns-microchip-bins__disclosure">
    <summary class="dropdowns-microchip-bins__summary">
      <span>Select a packing bin</span>
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="dropdowns-microchip-bins__chevron">
        <path d="m4 6 4 4 4-4" />
      </svg>
    </summary>
    <p class="dropdowns-microchip-bins__lot">LOT C7-104 · 4 × 4 mm · Tested dies</p>
    <fieldset aria-describedby="dropdowns-microchip-bins-note" class="dropdowns-microchip-bins__bins">
      <legend class="dropdowns-microchip-bins__legend">Packing bin</legend>
      <label class="dropdowns-microchip-bins__bin">
        <input type="radio" name="dropdowns-microchip-bins-bin" value="A1" aria-label="Bin A1, 640 dies" class="dropdowns-microchip-bins__radio" /><span><span class="dropdowns-microchip-bins__bin-name">A1</span><span class="dropdowns-microchip-bins__quantity">640 dies</span></span>
      </label>
      <label class="dropdowns-microchip-bins__bin">
        <input type="radio" name="dropdowns-microchip-bins-bin" value="A2" aria-label="Bin A2, 620 dies" checked class="dropdowns-microchip-bins__radio" /><span><span class="dropdowns-microchip-bins__bin-name">A2</span><span class="dropdowns-microchip-bins__quantity">620 dies</span></span>
      </label>
      <label class="dropdowns-microchip-bins__bin">
        <input type="radio" name="dropdowns-microchip-bins-bin" value="B1" aria-label="Bin B1, 640 dies" class="dropdowns-microchip-bins__radio" /><span><span class="dropdowns-microchip-bins__bin-name">B1</span><span class="dropdowns-microchip-bins__quantity">640 dies</span></span>
      </label>
      <label class="dropdowns-microchip-bins__bin">
        <input type="radio" name="dropdowns-microchip-bins-bin" value="B2" aria-label="Bin B2, 600 dies" class="dropdowns-microchip-bins__radio" /><span><span class="dropdowns-microchip-bins__bin-name">B2</span><span class="dropdowns-microchip-bins__quantity">600 dies</span></span>
      </label>
      <label class="dropdowns-microchip-bins__bin">
        <input type="radio" name="dropdowns-microchip-bins-bin" value="C1" aria-label="Bin C1, 580 dies" class="dropdowns-microchip-bins__radio" /><span><span class="dropdowns-microchip-bins__bin-name">C1</span><span class="dropdowns-microchip-bins__quantity">580 dies</span></span>
      </label>
      <label class="dropdowns-microchip-bins__bin">
        <input type="radio" name="dropdowns-microchip-bins-bin" value="C2" aria-label="Bin C2, 640 dies" class="dropdowns-microchip-bins__radio" /><span><span class="dropdowns-microchip-bins__bin-name">C2</span><span class="dropdowns-microchip-bins__quantity">640 dies</span></span>
      </label>
    </fieldset>
    <p id="dropdowns-microchip-bins-note" class="dropdowns-microchip-bins__note">ESD-safe tray. Keep lot labels attached until final packing.</p>
  </details>
</div>
