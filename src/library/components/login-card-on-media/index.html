<section class="login-card-on-media">
  <div role="img" aria-label="Image placeholder: full-width account access visual" class="login-card-on-media__media">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="login-card-on-media__image-glyph">
      <rect x="3" y="3" width="18" height="18" rx="2"></rect>
      <circle cx="9" cy="9" r="2"></circle>
      <path d="m21 15-5-5L5 21"></path>
    </svg>
  </div>
  <div class="login-card-on-media__container">
    <div class="login-card-on-media__card">
      <div class="login-card-on-media__logo">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="login-card-on-media__logo-glyph">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        <span>Logo</span>
      </div>
      <h1 class="login-card-on-media__title">Sign in</h1>
      <form class="login-card-on-media__form">
        <div>
          <label for="login-card-on-media-email" class="login-card-on-media__label">Email</label><input id="login-card-on-media-email" type="email" autocomplete="username" required placeholder="name@example.com" name="email" class="login-card-on-media__input">
        </div>
        <div>
          <label for="login-card-on-media-password" class="login-card-on-media__label">Password</label><input id="login-card-on-media-password" type="password" autocomplete="current-password" required name="password" class="login-card-on-media__input">
        </div>
        <button type="submit" class="login-card-on-media__submit">Sign in</button>
      </form>
      <p class="login-card-on-media__account">No account? <a href="#" class="login-card-on-media__link">Sign up</a></p>
    </div>
  </div>
</section>
