<section class="inputs-costume-measures" aria-label="Velvet Ledger fitting measurements">
  <p class="inputs-costume-measures__brand">Velvet Ledger / Wardrobe hire</p>
  <h2 class="inputs-costume-measures__heading">Made to fit.</h2>
  <div class="inputs-costume-measures__grid">
    <div>
      <label class="inputs-costume-measures__label" for="inputs-costume-measures-chest">Chest</label>
      <div class="inputs-costume-measures__measurement">
        <input
          class="inputs-costume-measures__number"
          id="inputs-costume-measures-chest"
          name="chest"
          type="number"
          min="20"
          max="200"
          step="0.5"
          value="94"
          aria-describedby="inputs-costume-measures-chest-unit"
        >
        <span class="inputs-costume-measures__unit" id="inputs-costume-measures-chest-unit">cm</span>
      </div>
    </div>
    <div>
      <label class="inputs-costume-measures__label" for="inputs-costume-measures-waist">Waist</label>
      <div class="inputs-costume-measures__measurement">
        <input
          class="inputs-costume-measures__number"
          id="inputs-costume-measures-waist"
          name="waist"
          type="number"
          min="20"
          max="200"
          step="0.5"
          value="76"
          aria-describedby="inputs-costume-measures-waist-unit"
        >
        <span class="inputs-costume-measures__unit" id="inputs-costume-measures-waist-unit">cm</span>
      </div>
    </div>
  </div>
  <div class="inputs-costume-measures__note-header">
    <label class="inputs-costume-measures__label" for="inputs-costume-measures-notes">Fitting notes</label>
    <span class="inputs-costume-measures__hint" id="inputs-costume-measures-hint">Optional</span>
  </div>
  <textarea
    class="inputs-costume-measures__notes"
    id="inputs-costume-measures-notes"
    name="notes"
    aria-describedby="inputs-costume-measures-hint"
  >Allow room for a shirt under the jacket.</textarea>
</section>
