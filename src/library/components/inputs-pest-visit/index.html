<section class="inputs-pest-visit" aria-label="Sillguard inspection request">
  <p class="inputs-pest-visit__brand">Sillguard / Home visits</p>
  <h2 class="inputs-pest-visit__heading">Before we arrive</h2>
  <div class="inputs-pest-visit__row">
    <span class="inputs-pest-visit__number" aria-hidden="true">01</span>
    <div>
      <label class="inputs-pest-visit__label" for="inputs-pest-visit-postcode">Property postcode</label>
      <input
        class="inputs-pest-visit__postcode"
        id="inputs-pest-visit-postcode"
        name="postcode"
        type="text"
        autocomplete="postal-code"
        value="BS3 1EW"
      >
    </div>
  </div>
  <div class="inputs-pest-visit__row">
    <span class="inputs-pest-visit__number" aria-hidden="true">02</span>
    <div>
      <label class="inputs-pest-visit__label" for="inputs-pest-visit-access">Access instructions</label>
      <textarea
        class="inputs-pest-visit__note"
        id="inputs-pest-visit-access"
        name="access"
        aria-describedby="inputs-pest-visit-hint"
        maxlength="240"
      >Side gate is open. Please close it behind you.</textarea>
      <p class="inputs-pest-visit__hint" id="inputs-pest-visit-hint">Gate codes, parking or pets. Up to 240 characters.</p>
    </div>
  </div>
</section>
