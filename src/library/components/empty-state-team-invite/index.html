<section class="empty-state-team-invite">
  <div class="empty-state-team-invite__container">
    <div class="empty-state-team-invite__intro">
      <div aria-hidden="true" class="empty-state-team-invite__slots">
        <span class="empty-state-team-invite__slot">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-state-team-invite__slot-icon">
            <path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.1a7.5 7.5 0 0 1 15 0"></path>
          </svg>
        </span>
        <span class="empty-state-team-invite__slot">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-state-team-invite__slot-icon">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </span>
        <span class="empty-state-team-invite__slot">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-state-team-invite__slot-icon">
            <path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.1a7.5 7.5 0 0 1 15 0"></path>
          </svg>
        </span>
      </div>
      <h1 class="empty-state-team-invite__title">No teammates yet</h1>
      <p class="empty-state-team-invite__lede">Invite people to work in this workspace with you. They get access as soon as they accept.</p>
    </div>
    <div class="empty-state-team-invite__card">
      <form class="empty-state-team-invite__form">
        <div class="empty-state-team-invite__fields">
          <div class="empty-state-team-invite__email"><label for="empty-state-team-invite-email" class="empty-state-team-invite__label">Email addresses</label><input id="empty-state-team-invite-email" name="emails" type="email" multiple required aria-describedby="empty-state-team-invite-hint" placeholder="name@example.com" class="empty-state-team-invite__control"></div>
          <div class="empty-state-team-invite__role"><label for="empty-state-team-invite-role" class="empty-state-team-invite__label">Role</label><select id="empty-state-team-invite-role" name="role" class="empty-state-team-invite__control"><option>Member</option><option>Admin</option><option>Viewer</option></select></div>
          <button type="submit" class="empty-state-team-invite__action empty-state-team-invite__action--primary">Send invite</button>
        </div>
        <p id="empty-state-team-invite-hint" class="empty-state-team-invite__hint">Separate several addresses with commas. Each person gets an email invitation.</p>
      </form>
      <div class="empty-state-team-invite__link-share">
        <p class="empty-state-team-invite__link-note">Or share a link that adds people as members. It expires in 7 days.</p>
        <button type="button" class="empty-state-team-invite__action empty-state-team-invite__action--secondary"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-state-team-invite__action-icon">
          <path d="M13.19 8.69a4.5 4.5 0 0 1 1.24 7.24l-4.5 4.5a4.5 4.5 0 0 1-6.36-6.36l1.76-1.76m13.35-.62 1.76-1.76a4.5 4.5 0 0 0-6.36-6.36l-4.5 4.5a4.5 4.5 0 0 0 1.24 7.24"></path>
        </svg>Copy invite link</button>
      </div>
    </div>
  </div>
</section>
