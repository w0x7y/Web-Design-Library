<section class="testimonials-rating-distribution">
  <div class="testimonials-rating-distribution__container">
    <header class="testimonials-rating-distribution__header">
      <p class="testimonials-rating-distribution__label">Eyebrow for the section</p>
      <h2 class="testimonials-rating-distribution__heading">Heading for the review evidence</h2>
    </header>
    <div class="testimonials-rating-distribution__evidence-layout">
      <aside class="testimonials-rating-distribution__rating-panel">
        <p class="testimonials-rating-distribution__label">Overall rating</p>
        <p class="testimonials-rating-distribution__rating">4.8<span class="testimonials-rating-distribution__rating-scale">/ 5</span></p>
        <p class="testimonials-rating-distribution__review-count">Based on 1,284 reviews</p>
        <dl class="testimonials-rating-distribution__distribution">
          <div class="testimonials-rating-distribution__rating-row">
            <dt>5<span class="testimonials-rating-distribution__accessible-label"> stars</span></dt>
            <dd class="testimonials-rating-distribution__rating-share"><span aria-hidden="true" class="testimonials-rating-distribution__share-track"><span class="testimonials-rating-distribution__share-fill testimonials-rating-distribution__share-fill--five"></span></span><span class="testimonials-rating-distribution__share-value">78%</span></dd>
          </div>
          <div class="testimonials-rating-distribution__rating-row">
            <dt>4<span class="testimonials-rating-distribution__accessible-label"> stars</span></dt>
            <dd class="testimonials-rating-distribution__rating-share"><span aria-hidden="true" class="testimonials-rating-distribution__share-track"><span class="testimonials-rating-distribution__share-fill testimonials-rating-distribution__share-fill--four"></span></span><span class="testimonials-rating-distribution__share-value">16%</span></dd>
          </div>
          <div class="testimonials-rating-distribution__rating-row">
            <dt>3<span class="testimonials-rating-distribution__accessible-label"> stars</span></dt>
            <dd class="testimonials-rating-distribution__rating-share"><span aria-hidden="true" class="testimonials-rating-distribution__share-track"><span class="testimonials-rating-distribution__share-fill testimonials-rating-distribution__share-fill--three"></span></span><span class="testimonials-rating-distribution__share-value">4%</span></dd>
          </div>
          <div class="testimonials-rating-distribution__rating-row">
            <dt>2<span class="testimonials-rating-distribution__accessible-label"> stars</span></dt>
            <dd class="testimonials-rating-distribution__rating-share"><span aria-hidden="true" class="testimonials-rating-distribution__share-track"><span class="testimonials-rating-distribution__share-fill testimonials-rating-distribution__share-fill--remaining"></span></span><span class="testimonials-rating-distribution__share-value">1%</span></dd>
          </div>
          <div class="testimonials-rating-distribution__rating-row">
            <dt>1<span class="testimonials-rating-distribution__accessible-label"> stars</span></dt>
            <dd class="testimonials-rating-distribution__rating-share"><span aria-hidden="true" class="testimonials-rating-distribution__share-track"><span class="testimonials-rating-distribution__share-fill testimonials-rating-distribution__share-fill--remaining"></span></span><span class="testimonials-rating-distribution__share-value">1%</span></dd>
          </div>
        </dl>
      </aside>
      <div class="testimonials-rating-distribution__quote-stack">
        <figure class="testimonials-rating-distribution__quote-panel">
          <blockquote class="testimonials-rating-distribution__quote">Quote that gives one specific reason for the positive rating.</blockquote>
          <figcaption class="testimonials-rating-distribution__byline">
            <span aria-hidden="true" class="testimonials-rating-distribution__avatar">AR</span>
            <div>
              <p class="testimonials-rating-distribution__author-name">Alex Rivera</p>
              <p class="testimonials-rating-distribution__author-role">Role, organization</p>
            </div>
          </figcaption>
        </figure>
        <figure class="testimonials-rating-distribution__quote-panel">
          <blockquote class="testimonials-rating-distribution__quote">Quote that gives one specific reason for the positive rating.</blockquote>
          <figcaption class="testimonials-rating-distribution__byline">
            <span aria-hidden="true" class="testimonials-rating-distribution__avatar">JL</span>
            <div>
              <p class="testimonials-rating-distribution__author-name">Jordan Lee</p>
              <p class="testimonials-rating-distribution__author-role">Role, organization</p>
            </div>
          </figcaption>
        </figure>
      </div>
    </div>
  </div>
</section>
