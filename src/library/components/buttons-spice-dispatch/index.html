<section aria-label="Saffron Lane spice dispatch actions" class="buttons-spice-dispatch">
  <div class="buttons-spice-dispatch__header">
    <img
      src="https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=800&q=80"
      alt="Whole and ground spices arranged on a pale wooden table"
      width="800"
      height="533"
      class="buttons-spice-dispatch__photo"
    />
    <div>
      <p class="buttons-spice-dispatch__brand">Saffron Lane</p>
      <h2 class="buttons-spice-dispatch__heading">Cumin seed, lot 62</h2>
    </div>
  </div>
  <div class="buttons-spice-dispatch__actions">
    <button type="button" class="buttons-spice-dispatch__dispatch">
      <span>Pack this order</span>
      <svg
        aria-hidden="true"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="buttons-spice-dispatch__arrow"
      >
        <path d="M3 8h10M9 4l4 4-4 4" />
      </svg>
    </button>
    <button type="button" class="buttons-spice-dispatch__packing">
      <span>Print sack labels</span>
      <span aria-label="18 sacks" class="buttons-spice-dispatch__count">18</span>
    </button>
  </div>
  <p class="buttons-spice-dispatch__note">Ground today · Dispatch at 16:00</p>
</section>
