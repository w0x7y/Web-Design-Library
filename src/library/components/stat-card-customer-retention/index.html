<article class="stat-card-customer-retention">
  <p class="stat-card-customer-retention__category">Customer success</p>
  <h2 class="stat-card-customer-retention__title">90-day retention</h2>
  <div class="stat-card-customer-retention__metric">
    <p class="stat-card-customer-retention__rate">91.4<span class="stat-card-customer-retention__percent">%</span></p>
    <span class="stat-card-customer-retention__change">↑ 3.1 points</span>
  </div>
  <!-- Exact values accompany the decorative bars -->
  <dl class="stat-card-customer-retention__segments">
    <div class="stat-card-customer-retention__segment">
      <dt>Teams</dt>
      <dd class="stat-card-customer-retention__value">96%</dd>
      <dd aria-hidden="true" class="stat-card-customer-retention__track">
        <div class="stat-card-customer-retention__bar stat-card-customer-retention__bar--teams"></div>
      </dd>
    </div>
    <div class="stat-card-customer-retention__segment">
      <dt>Individuals</dt>
      <dd class="stat-card-customer-retention__value">87%</dd>
      <dd aria-hidden="true" class="stat-card-customer-retention__track">
        <div class="stat-card-customer-retention__bar stat-card-customer-retention__bar--individuals"></div>
      </dd>
    </div>
  </dl>
  <p class="stat-card-customer-retention__methodology">
    Based on 2,840 customers who joined in July. Up from 88.3% in the previous cohort.
  </p>
</article>
