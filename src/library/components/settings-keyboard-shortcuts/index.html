<section class="settings-keyboard-shortcuts">
  <div class="settings-keyboard-shortcuts__container">
    <div>
      <h1 class="settings-keyboard-shortcuts__title">Keyboard shortcuts</h1>
      <p class="settings-keyboard-shortcuts__lede">Explain how shortcuts can speed up common account tasks.</p>
    </div>
    <div class="settings-keyboard-shortcuts__preference-band">
      <div class="settings-keyboard-shortcuts__shortcut-option">
        <input id="settings-keyboard-shortcuts-enabled" type="checkbox" aria-describedby="settings-keyboard-shortcuts-enabled-hint" name="enabled" checked value="enabled" class="settings-keyboard-shortcuts__shortcut-checkbox">
        <div class="settings-keyboard-shortcuts__preference-copy">
          <label for="settings-keyboard-shortcuts-enabled" class="settings-keyboard-shortcuts__preference-label">Enable keyboard shortcuts</label>
          <p id="settings-keyboard-shortcuts-enabled-hint" class="settings-keyboard-shortcuts__preference-hint">Shortcuts are inactive while typing in form fields.</p>
        </div>
      </div>
    </div>
    <div class="settings-keyboard-shortcuts__command-groups">
      <section class="settings-keyboard-shortcuts__command-group">
        <h2 class="settings-keyboard-shortcuts__group-title">Navigation</h2>
        <dl class="settings-keyboard-shortcuts__command-list">
          <div class="settings-keyboard-shortcuts__command-row">
            <dt class="settings-keyboard-shortcuts__command-name">Open search</dt>
            <dd><kbd class="settings-keyboard-shortcuts__key-token">/</kbd></dd>
          </div>
          <div class="settings-keyboard-shortcuts__command-row">
            <dt class="settings-keyboard-shortcuts__command-name">Go to overview</dt>
            <dd><kbd class="settings-keyboard-shortcuts__key-token">G O</kbd></dd>
          </div>
          <div class="settings-keyboard-shortcuts__command-row">
            <dt class="settings-keyboard-shortcuts__command-name">Go to settings</dt>
            <dd><kbd class="settings-keyboard-shortcuts__key-token">G S</kbd></dd>
          </div>
        </dl>
      </section>
      <section class="settings-keyboard-shortcuts__command-group">
        <h2 class="settings-keyboard-shortcuts__group-title">Editing</h2>
        <dl class="settings-keyboard-shortcuts__command-list">
          <div class="settings-keyboard-shortcuts__command-row">
            <dt class="settings-keyboard-shortcuts__command-name">Save changes</dt>
            <dd><kbd class="settings-keyboard-shortcuts__key-token">Ctrl S</kbd></dd>
          </div>
          <div class="settings-keyboard-shortcuts__command-row">
            <dt class="settings-keyboard-shortcuts__command-name">Undo change</dt>
            <dd><kbd class="settings-keyboard-shortcuts__key-token">Ctrl Z</kbd></dd>
          </div>
          <div class="settings-keyboard-shortcuts__command-row">
            <dt class="settings-keyboard-shortcuts__command-name">Add item</dt>
            <dd><kbd class="settings-keyboard-shortcuts__key-token">N</kbd></dd>
          </div>
        </dl>
      </section>
    </div>
    <p class="settings-keyboard-shortcuts__reset-link"><a href="#" class="settings-keyboard-shortcuts__link">Restore default shortcuts</a></p>
  </div>
</section>
