<details open class="dropdowns-project-switcher">
  <summary class="dropdowns-project-switcher__summary">
    <span aria-hidden="true" class="dropdowns-project-switcher__workspace-icon">TS</span>
    <span>
      <span class="dropdowns-project-switcher__name">Tessera Studio</span>
      <span class="dropdowns-project-switcher__membership">Pro workspace · 6 members</span>
    </span>
    <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="dropdowns-project-switcher__chevron">
      <path d="m4 6 4 4 4-4" />
    </svg>
  </summary>

  <nav aria-label="Switch workspace" class="dropdowns-project-switcher__navigation">
    <p class="dropdowns-project-switcher__eyebrow">Your workspaces</p>
    <ul role="list" class="dropdowns-project-switcher__workspaces">
      <li>
        <a href="#tessera-workspace" aria-current="true" class="dropdowns-project-switcher__workspace dropdowns-project-switcher__workspace--current">

          <span class="dropdowns-project-switcher__workspace-name dropdowns-project-switcher__workspace-name--current">Tessera Studio</span>
          <span class="dropdowns-project-switcher__current-label">Current</span>
        </a>

      <li>
        <a href="#personal-workspace" class="dropdowns-project-switcher__workspace">
          <span aria-hidden="true" class="dropdowns-project-switcher__monogram dropdowns-project-switcher__monogram--personal">MR</span>
          <span>
            <span class="dropdowns-project-switcher__workspace-name">Morgan's space</span>
            <span class="dropdowns-project-switcher__workspace-plan">Personal · Free plan</span>
          </span>
        </a>
      </li>
    </ul>
  </nav>
  <button type="button" class="dropdowns-project-switcher__create">
    <span aria-hidden="true" class="dropdowns-project-switcher__plus">+</span>
    Create workspace
  </button>
