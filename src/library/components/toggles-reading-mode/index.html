<section aria-label="Reading preferences" class="toggles-reading-mode">
  <p class="toggles-reading-mode__eyebrow">Make room to read</p>
  <blockquote class="toggles-reading-mode__sample">“The afternoon belonged to the garden, and the garden asked for nothing.”</blockquote>
  <div class="toggles-reading-mode__settings">
    <div class="toggles-reading-mode__setting">
      <div>
        <label for="toggles-reading-mode-spacing" class="toggles-reading-mode__label">Generous spacing</label>
        <p id="toggles-reading-mode-spacing-hint" class="toggles-reading-mode__hint">A little more breathing room.</p>
      </div>
      <input
        id="toggles-reading-mode-spacing"
        type="checkbox"
        role="switch"
        name="toggles-reading-mode-spacing"
        checked
        aria-describedby="toggles-reading-mode-spacing-hint"
        class="toggles-reading-mode__switch"
      />
    </div>
    <div class="toggles-reading-mode__setting">
      <div>
        <label for="toggles-reading-mode-notes" class="toggles-reading-mode__label">Margin notes</label>
        <p id="toggles-reading-mode-notes-hint" class="toggles-reading-mode__hint">Show the author's annotations.</p>
      </div>
      <input
        id="toggles-reading-mode-notes"
        type="checkbox"
        role="switch"
        name="toggles-reading-mode-notes"
        aria-describedby="toggles-reading-mode-notes-hint"
        class="toggles-reading-mode__switch"
      />
    </div>
  </div>
  <p class="toggles-reading-mode__footnote">Choose the layout that helps you focus.</p>
</section>
