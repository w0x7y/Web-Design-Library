<div class="toggles-inline-consent">
  <div class="toggles-inline-consent__consent-summary">
    <h2 class="toggles-inline-consent__heading">Consent heading</h2>
    <p class="toggles-inline-consent__description">Explain the permission requested and how it is used.</p>
    <p class="toggles-inline-consent__policy-link"><a href="#" class="toggles-inline-consent__text-link">Read the policy</a></p>
  </div>
  <div class="toggles-inline-consent__consent-footer">
    <label class="toggles-inline-consent__consent-label"><input id="toggles-inline-consent-accepted" type="checkbox" aria-describedby="toggles-inline-consent-hint" name="consent" class="toggles-inline-consent__consent-checkbox">I agree</label>
    <span class="toggles-inline-consent__pending-status">Not agreed</span>
    <span class="toggles-inline-consent__accepted-status">Agreed</span>
  </div>
  <p id="toggles-inline-consent-hint" class="toggles-inline-consent__consent-hint">Check the box to record your agreement.</p>
</div>
