<section class="inputs-rooftop-harvest" aria-label="Skyplot rooftop harvest record">
  <img
    class="inputs-rooftop-harvest__photo"
    src="https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=800&q=80"
    alt="Three ripe red tomatoes on the vine against a pale background"
    width="800"
    height="532"
  >
  <div class="inputs-rooftop-harvest__body">
    <p class="inputs-rooftop-harvest__brand">Skyplot / Rooftop farm</p>
    <h2 class="inputs-rooftop-harvest__heading">Tomato harvest</h2>
    <div class="inputs-rooftop-harvest__grid">
      <div>
        <label class="inputs-rooftop-harvest__label" for="inputs-rooftop-harvest-bed">Bed code</label>
        <input
          class="inputs-rooftop-harvest__field"
          id="inputs-rooftop-harvest-bed"
          name="bed"
          type="text"
          value="SP-T08"
          aria-describedby="inputs-rooftop-harvest-note"
        >
      </div>
      <div>
        <label class="inputs-rooftop-harvest__label" for="inputs-rooftop-harvest-yield">Yield</label>
        <div class="inputs-rooftop-harvest__weight-row">
          <input
            class="inputs-rooftop-harvest__weight"
            id="inputs-rooftop-harvest-yield"
            name="yield"
            type="number"
            min="0"
            step="0.01"
            value="4.60"
            aria-describedby="inputs-rooftop-harvest-unit"
          >
          <span class="inputs-rooftop-harvest__unit" id="inputs-rooftop-harvest-unit">kg</span>
        </div>
      </div>
    </div>
    <p class="inputs-rooftop-harvest__note" id="inputs-rooftop-harvest-note">Log the bed before packing the tomatoes.</p>
  </div>
</section>
