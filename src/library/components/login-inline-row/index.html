<section class="login-inline-row">
  <div class="login-inline-row__container">
    <div class="login-inline-row__heading-row">
      <div>
        <h1 class="login-inline-row__title">Headline for account access</h1>
        <p class="login-inline-row__lede">A brief explanation of what members can access after sign-in.</p>
      </div>
      <p class="login-inline-row__status">Short account-status or access note.</p>
    </div>
    <form class="login-inline-row__form">
      <div>
        <label for="login-inline-row-email" class="login-inline-row__label">Email</label><input id="login-inline-row-email" type="email" autocomplete="username" required placeholder="name@example.com" name="email" class="login-inline-row__input">
      </div>
      <div>
        <label for="login-inline-row-password" class="login-inline-row__label">Password</label><input id="login-inline-row-password" type="password" autocomplete="current-password" required name="password" class="login-inline-row__input">
      </div>
      <button type="submit" class="login-inline-row__submit">Sign in</button>
    </form>
    <div class="login-inline-row__account-links">
      <a href="#" class="login-inline-row__link">Forgot password?</a>
      <a href="#" class="login-inline-row__link">Create account</a>
    </div>
  </div>
</section>
