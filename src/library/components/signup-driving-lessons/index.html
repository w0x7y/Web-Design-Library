<section class="signup-driving-lessons">
  <div class="signup-driving-lessons__inner">
    <header class="signup-driving-lessons__intro">
      <p class="signup-driving-lessons__eyebrow">Laneahead / Driving school</p>
      <h2 class="signup-driving-lessons__heading">Your first mile starts here.</h2>
      <p class="signup-driving-lessons__copy">Patient instructors. Familiar streets. Book a first lesson and we will build a plan around you.</p>
      <dl class="signup-driving-lessons__facts">
        <div class="signup-driving-lessons__fact">
          <dt>First lesson</dt>
          <dd class="signup-driving-lessons__fact-value">90 minutes / £48</dd>
        </div>
        <div class="signup-driving-lessons__fact">
          <dt>Pickup area</dt>
          <dd class="signup-driving-lessons__fact-value">East Bristol</dd>
        </div>
      </dl>
    </header>
    <form action="#" method="post" class="signup-driving-lessons__form">
      <p class="signup-driving-lessons__form-title">01 / Tell us about yourself</p>
      <label for="signup-driving-lessons-name" class="signup-driving-lessons__label">
        <span class="signup-driving-lessons__label-text">Full name</span>
        <input id="signup-driving-lessons-name" name="name" type="text" autocomplete="name" required class="signup-driving-lessons__field" />
      </label>
      <label for="signup-driving-lessons-email" class="signup-driving-lessons__label">
        <span class="signup-driving-lessons__label-text">Email address</span>
        <input id="signup-driving-lessons-email" name="email" type="email" autocomplete="email" required class="signup-driving-lessons__field" />
      </label>
      <div class="signup-driving-lessons__field-row">
        <label for="signup-driving-lessons-postcode" class="signup-driving-lessons__label">
          <span class="signup-driving-lessons__label-text">Pickup postcode</span>
          <input
            id="signup-driving-lessons-postcode"
            name="postcode"
            type="text"
            autocomplete="postal-code"
            required
            class="signup-driving-lessons__field"
          />
        </label>
        <label for="signup-driving-lessons-gearbox" class="signup-driving-lessons__label">
          <span class="signup-driving-lessons__label-text">Gearbox</span>
          <select id="signup-driving-lessons-gearbox" name="gearbox" class="signup-driving-lessons__field">
            <option value="auto">Automatic</option>
            <option value="manual">Manual</option>
          </select>
        </label>
      </div>
      <label for="signup-driving-lessons-permit" class="signup-driving-lessons__check">
        <input id="signup-driving-lessons-permit" type="checkbox" name="permit" required class="signup-driving-lessons__checkbox" />
        <span>I have a valid provisional driving licence.</span>
      </label>
      <button type="submit" class="signup-driving-lessons__cta">Request my first lesson</button>
      <p class="signup-driving-lessons__hint">We will email available times within one working day.</p>
    </form>
  </div>
</section>
