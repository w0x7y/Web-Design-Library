<section aria-label="Canterdesk equestrian arena assignments" class="tabs-equestrian-roster">
  <header class="tabs-equestrian-roster__header">
    <p class="tabs-equestrian-roster__brand">Canterdesk / yard roster</p>
    <h2 class="tabs-equestrian-roster__title">Saturday schooling</h2>
  </header>
  <fieldset class="tabs-equestrian-roster__selector">
    <legend class="tabs-equestrian-roster__legend">Choose riding arena</legend>
    <label id="tabs-equestrian-roster-indoor-label" class="tabs-equestrian-roster__tab">
      <input id="tabs-equestrian-roster-indoor" type="radio" name="tabs-equestrian-roster-view" value="indoor" checked aria-controls="tabs-equestrian-roster-indoor-panel" class="tabs-equestrian-roster__radio">
      Indoor school
    </label>
    <label id="tabs-equestrian-roster-outdoor-label" class="tabs-equestrian-roster__tab">
      <input id="tabs-equestrian-roster-outdoor" type="radio" name="tabs-equestrian-roster-view" value="outdoor" aria-controls="tabs-equestrian-roster-outdoor-panel" class="tabs-equestrian-roster__radio">
      Outdoor arena
    </label>
  </fieldset>
  <section id="tabs-equestrian-roster-indoor-panel" aria-labelledby="tabs-equestrian-roster-indoor-label" class="tabs-equestrian-roster__panel tabs-equestrian-roster__panel--indoor">
    <p class="tabs-equestrian-roster__session">09:00 · Flatwork</p>
    <ul role="list" class="tabs-equestrian-roster__roster">
      <li class="tabs-equestrian-roster__assignment">
        <div>
          <p class="tabs-equestrian-roster__horse">Juniper</p>
          <p class="tabs-equestrian-roster__rider">Mara Ellis</p>
        </div>
        <span class="tabs-equestrian-roster__stall">Stall 04</span>
      </li>
      <li class="tabs-equestrian-roster__assignment">
        <div>
          <p class="tabs-equestrian-roster__horse">Oslo</p>
          <p class="tabs-equestrian-roster__rider">Toby Finch</p>
        </div>
        <span class="tabs-equestrian-roster__stall">Stall 07</span>
      </li>
    </ul>
  </section>
  <section id="tabs-equestrian-roster-outdoor-panel" aria-labelledby="tabs-equestrian-roster-outdoor-label" class="tabs-equestrian-roster__panel tabs-equestrian-roster__panel--outdoor">
    <p class="tabs-equestrian-roster__session">10:30 · Pole work</p>
    <ul role="list" class="tabs-equestrian-roster__roster">
      <li class="tabs-equestrian-roster__assignment">
        <div>
          <p class="tabs-equestrian-roster__horse">Clover</p>
          <p class="tabs-equestrian-roster__rider">Nina West</p>
        </div>
        <span class="tabs-equestrian-roster__stall">Stall 02</span>
      </li>
      <li class="tabs-equestrian-roster__assignment">
        <div>
          <p class="tabs-equestrian-roster__horse">Bramble</p>
          <p class="tabs-equestrian-roster__rider">Alex Shah</p>
        </div>
        <span class="tabs-equestrian-roster__stall">Stall 09</span>
      </li>
    </ul>
  </section>
</section>
