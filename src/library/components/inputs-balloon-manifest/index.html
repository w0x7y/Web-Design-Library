<section class="inputs-balloon-manifest" aria-label="Aerohush passenger manifest">
  <p class="inputs-balloon-manifest__brand">Aerohush / Balloon flights</p>
  <h2 class="inputs-balloon-manifest__heading">Passenger manifest</h2>
  <div class="inputs-balloon-manifest__glass">
    <label class="inputs-balloon-manifest__label" for="inputs-balloon-manifest-name">Passenger name</label>
    <input
      class="inputs-balloon-manifest__name"
      id="inputs-balloon-manifest-name"
      name="passenger"
      type="text"
      autocomplete="name"
      value="Robin Ellis"
    >
    <label class="inputs-balloon-manifest__weight-label" for="inputs-balloon-manifest-weight">Passenger weight</label>
    <div class="inputs-balloon-manifest__weight-row">
      <input
        class="inputs-balloon-manifest__weight"
        id="inputs-balloon-manifest-weight"
        name="weight"
        type="number"
        min="1"
        max="300"
        step="0.5"
        value="72.5"
        aria-describedby="inputs-balloon-manifest-unit inputs-balloon-manifest-hint"
      >
      <span class="inputs-balloon-manifest__unit" id="inputs-balloon-manifest-unit">kg</span>
    </div>
    <p class="inputs-balloon-manifest__hint" id="inputs-balloon-manifest-hint">Include the clothes you'll wear on board.</p>
  </div>
  <div class="inputs-balloon-manifest__flight">
    <span>Flight AH-06</span>
    <span>06:15 / Meadow launch</span>
  </div>
</section>
