<section class="login-split-media">
  <div class="login-split-media__media-inset">
    <div role="img" aria-label="Image placeholder: account access visual" class="login-split-media__media">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="login-split-media__image-glyph">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <circle cx="9" cy="9" r="2"></circle>
        <path d="m21 15-5-5L5 21"></path>
      </svg>
    </div>
  </div>
  <div class="login-split-media__content">
    <div class="login-split-media__logo">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="login-split-media__logo-glyph">
        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
      </svg>
      <span>Logo</span>
    </div>
    <div class="login-split-media__form-centre">
      <div class="login-split-media__form-block">
        <h1 class="login-split-media__title">Sign in</h1>
        <p class="login-split-media__lede">A brief welcome and account-access explanation.</p>
        <form class="login-split-media__form">
          <div>
            <label for="login-split-media-email" class="login-split-media__label">Email</label><input id="login-split-media-email" type="email" autocomplete="username" required placeholder="name@example.com" name="email" class="login-split-media__input">
          </div>
          <div>
            <label for="login-split-media-password" class="login-split-media__label">Password</label><input id="login-split-media-password" type="password" autocomplete="current-password" required name="password" class="login-split-media__input">
          </div>
          <div class="login-split-media__credential-options">
            <label class="login-split-media__remember"><input type="checkbox" name="remember" class="login-split-media__checkbox">Remember me</label>
            <span class="login-split-media__recovery"><a href="#" class="login-split-media__link">Forgot password?</a></span>
          </div>
          <button type="submit" class="login-split-media__submit">Sign in</button>
        </form>
        <p class="login-split-media__account">No account? <a href="#" class="login-split-media__link">Sign up</a></p>
      </div>
    </div>
    <footer class="login-split-media__footer">
      <p>© 2026</p>
      <div class="login-split-media__legal-links">
        <a href="#" class="login-split-media__link">Privacy</a>
        <a href="#" class="login-split-media__link">Terms</a>
      </div>
    </footer>
  </div>
</section>
