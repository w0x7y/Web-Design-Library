<article class="product-card-horizontal-media">
  <div role="img" aria-label="Image placeholder: product photograph in a list row" class="product-card-horizontal-media__media">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="product-card-horizontal-media__icon">
      <rect x="3" y="3" width="18" height="18" rx="2"></rect>
      <circle cx="9" cy="9" r="2"></circle>
      <path d="m21 15-5-5L5 21"></path>
    </svg>
  </div>
  <div class="product-card-horizontal-media__body">
    <h3 class="product-card-horizontal-media__name">Product name</h3>
    <p class="product-card-horizontal-media__variant">Variant summary</p>
    <p aria-label="Rated 4.8 out of 5 from 128 reviews" class="product-card-horizontal-media__rating">Rating 4.8 (128)</p>
    <div class="product-card-horizontal-media__purchase">
      <p class="product-card-horizontal-media__price">$48</p>
      <button type="button" aria-label="Add Product name to cart" class="product-card-horizontal-media__add-action">Add</button>
    </div>
  </div>
</article>
