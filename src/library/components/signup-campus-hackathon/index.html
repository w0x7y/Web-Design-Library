<section class="signup-campus-hackathon">
  <div class="signup-campus-hackathon__inner">
    <header class="signup-campus-hackathon__poster">
      <div class="signup-campus-hackathon__poster-copy">
        <p class="signup-campus-hackathon__eyebrow">Patchweek / Student hackathon 2027</p>
        <h2 class="signup-campus-hackathon__heading">MAKE SOMETHING THAT WORKS.</h2>
        <p
          class="signup-campus-hackathon__lede"
        >
          A weekend for unfinished ideas, unlikely teams and a demo by Sunday. All subjects welcome. All experience levels too.
        </p>
      </div>
      <div class="signup-campus-hackathon__duration">
        <p class="signup-campus-hackathon__hours">48</p>
        <p class="signup-campus-hackathon__duration-caption">HOURS / 19–21 FEB / LEEDS</p>
      </div>
    </header>
    <form action="#" method="post" class="signup-campus-hackathon__form">
      <div class="signup-campus-hackathon__fields">
        <label for="signup-campus-hackathon-name" class="signup-campus-hackathon__label">
          <span class="signup-campus-hackathon__label-text">01 / Your full name</span>
          <input id="signup-campus-hackathon-name" name="name" type="text" autocomplete="name" required class="signup-campus-hackathon__field" />
        </label>
        <label for="signup-campus-hackathon-email" class="signup-campus-hackathon__label">
          <span class="signup-campus-hackathon__label-text">02 / University email</span>
          <input id="signup-campus-hackathon-email" name="email" type="email" autocomplete="email" required class="signup-campus-hackathon__field" />
        </label>
        <label for="signup-campus-hackathon-university" class="signup-campus-hackathon__label">
          <span class="signup-campus-hackathon__label-text">03 / University or college</span>
          <input
            id="signup-campus-hackathon-university"
            name="university"
            type="text"
            autocomplete="off"
            required
            class="signup-campus-hackathon__field"
          />
        </label>
      </div>
      <div class="signup-campus-hackathon__application">
        <fieldset class="signup-campus-hackathon__choices">
          <legend class="signup-campus-hackathon__legend">Your team situation</legend>
          <div class="signup-campus-hackathon__choice-grid">
            <label class="signup-campus-hackathon__choice">
              <input type="radio" name="team" value="solo" checked class="signup-campus-hackathon__radio" />
              <span class="signup-campus-hackathon__choice-text">
                <span class="signup-campus-hackathon__choice-title">Find me a team</span>
                <span class="signup-campus-hackathon__choice-detail">Meet other solo entrants on Friday.</span>
              </span>
            </label>
            <label class="signup-campus-hackathon__choice">
              <input type="radio" name="team" value="together" class="signup-campus-hackathon__radio" />
              <span class="signup-campus-hackathon__choice-text">
                <span class="signup-campus-hackathon__choice-title">I am coming with a team</span>
                <span class="signup-campus-hackathon__choice-detail">We will ask for team details by email.</span>
              </span>
            </label>
          </div>
        </fieldset>
        <div class="signup-campus-hackathon__finish">
          <label for="signup-campus-hackathon-student" class="signup-campus-hackathon__check">
            <input id="signup-campus-hackathon-student" type="checkbox" name="student" required class="signup-campus-hackathon__checkbox" />
            <span>I will be a student at the time of the event.</span>
          </label>
          <button type="submit" class="signup-campus-hackathon__cta">Submit my entry / 2027</button>
          <p class="signup-campus-hackathon__hint">Free entry. Meals included. Applications close 29 January.</p>
        </div>
      </div>
    </form>
  </div>
</section>
