<fieldset class="toggles-workspace-access">
  <legend class="toggles-workspace-access__legend">Makerspace workspace permissions</legend>
  <div class="toggles-workspace-access__header">
    <h2 class="toggles-workspace-access__title">Access board</h2>
    <span class="toggles-workspace-access__bay">BAY 03</span>
  </div>
  <div class="toggles-workspace-access__permissions">
    <div class="toggles-workspace-access__permission">
      <div>
        <label for="toggles-workspace-access-guests" class="toggles-workspace-access__label">Guest entry</label>
        <p id="toggles-workspace-access-guests-hint" class="toggles-workspace-access__hint">Visitors with a host</p>
      </div>
      <input
        id="toggles-workspace-access-guests"
        type="checkbox"
        role="switch"
        name="toggles-workspace-access-guests"
        checked
        aria-describedby="toggles-workspace-access-guests-hint"
        class="toggles-workspace-access__switch"
      />
    </div>
    <div class="toggles-workspace-access__permission">
      <div>
        <label for="toggles-workspace-access-tools" class="toggles-workspace-access__label">Tool lending</label>
        <p id="toggles-workspace-access-tools-hint" class="toggles-workspace-access__hint">Take tools off site</p>
      </div>
      <input
        id="toggles-workspace-access-tools"
        type="checkbox"
        role="switch"
        name="toggles-workspace-access-tools"
        aria-describedby="toggles-workspace-access-tools-hint"
        class="toggles-workspace-access__switch"
      />
    </div>
    <div class="toggles-workspace-access__permission">
      <div>
        <label for="toggles-workspace-access-hours" class="toggles-workspace-access__label">After hours</label>
        <p id="toggles-workspace-access-hours-hint" class="toggles-workspace-access__hint">Entry after 18:00</p>
      </div>
      <input
        id="toggles-workspace-access-hours"
        type="checkbox"
        role="switch"
        name="toggles-workspace-access-hours"
        checked
        aria-describedby="toggles-workspace-access-hours-hint"
        class="toggles-workspace-access__switch"
      />
    </div>
  </div>
  <p class="toggles-workspace-access__footnote">Member settings / effective immediately</p>
</fieldset>
