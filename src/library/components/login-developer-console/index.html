<section class="login-developer-console">
  <div class="login-developer-console__inner">
    <div class="login-developer-console__intro">
      <p class="login-developer-console__brand">FORGE / CONSOLE</p>
      <h2 class="login-developer-console__heading">Ship from here.</h2>
      <p class="login-developer-console__description">Builds, logs and environments. One authenticated session.</p>
      <div class="login-developer-console__status">
        <p class="login-developer-console__status-label">All systems operational</p>
        <p class="login-developer-console__incident">Last incident: 38 days ago</p>
      </div>
    </div>
    <form class="login-developer-console__form" action="#" method="post">
      <p class="login-developer-console__form-title">AUTHENTICATE</p>
      <label class="login-developer-console__field" for="login-developer-console-email">
        Work email
        <input class="login-developer-console__input" id="login-developer-console-email" name="email" type="email" autocomplete="email" placeholder="developer@team.dev" required>
      </label>
      <label class="login-developer-console__field" for="login-developer-console-password">
        Password
        <input class="login-developer-console__input" id="login-developer-console-password" name="password" type="password" autocomplete="current-password" placeholder="" required>
      </label>
      <button class="login-developer-console__submit" type="submit">
        Continue
        <svg class="login-developer-console__arrow" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8h10M9 4l4 4-4 4"></path>
        </svg>
      </button>
      <a class="login-developer-console__recovery" href="#">Recover access</a>
    </form>
  </div>
</section>
