<section class="login-satellite-tasking">
  <div class="login-satellite-tasking__inner">
    <header class="login-satellite-tasking__header">
      <p>ORBITALIST / TASKING</p>
      <p>GROUND SEGMENT 04</p>
    </header>
    <div class="login-satellite-tasking__instrument">
      <div class="login-satellite-tasking__intro">
        <h1 class="login-satellite-tasking__heading">THE WINDOW IS OPEN.</h1>
        <p class="login-satellite-tasking__description">Schedule image acquisitions. Review coverage. Hand over the next orbital pass.</p>
      </div>
      <svg viewBox="0 0 320 190" fill="none" stroke="currentColor" aria-hidden="true" class="login-satellite-tasking__orbit">
        <ellipse cx="160" cy="95" rx="130" ry="38" transform="rotate(-25 160 95)" stroke-width="2" />
        <circle cx="160" cy="95" r="45" stroke-width="1" />
        <path d="M160 30v130M95 95h130M160 50c-36 14-36 76 0 90 36-14 36-76 0-90" stroke-width="1" />
        <rect x="263" y="32" width="16" height="16" fill="currentColor" stroke="none" />
      </svg>
    </div>
    <div class="login-satellite-tasking__access">
      <h2 class="login-satellite-tasking__access-label">SESSION AUTHENTICATION</h2>
      <form action="#" method="post" class="login-satellite-tasking__form">
        <label for="login-satellite-tasking-email" class="login-satellite-tasking__label">
          Mission email
          <input
            id="login-satellite-tasking-email"
            name="email"
            type="email"
            autocomplete="username"
            required
            aria-describedby="login-satellite-tasking-hint"
            class="login-satellite-tasking__input"
          >
        </label>
        <label for="login-satellite-tasking-code" class="login-satellite-tasking__label">
          Access code
          <input
            id="login-satellite-tasking-code"
            name="code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            pattern="[0-9]{6}"
            required
            aria-describedby="login-satellite-tasking-hint"
            class="login-satellite-tasking__input"
          >
        </label>
        <button type="submit" class="login-satellite-tasking__submit">Authenticate session</button>
        <a href="#" class="login-satellite-tasking__help">Trouble signing in?</a>
      </form>
      <p
        id="login-satellite-tasking-hint"
        class="login-satellite-tasking__hint"
      >
        Enter the six-digit code from your authenticator. Codes change every 30 seconds.
      </p>
    </div>
  </div>
</section>
