<section aria-labelledby="empty-state-playful-title" class="empty-state-playful">
  <!-- An empty games shelf: two dice, a meeple and a dashed slot where the first box will go -->
  <svg aria-hidden="true" viewBox="0 0 200 150" class="empty-state-playful__art">
    <rect x="6" y="128" width="188" height="8" rx="4" class="empty-state-playful__shelf" />
    <rect x="138" y="52" width="46" height="72" rx="6" fill="none" stroke-width="2" stroke-dasharray="6 5" class="empty-state-playful__slot" />

    <g class="empty-state-playful__big-die">
      <g transform="rotate(-5 48 100)">
        <rect x="20" y="72" width="56" height="56" rx="12" class="empty-state-playful__yellow" />
        <g class="empty-state-playful__ink">
          <circle cx="32" cy="84" r="5.5" />
          <circle cx="64" cy="84" r="5.5" />
          <circle cx="48" cy="100" r="5.5" />
          <circle cx="32" cy="116" r="5.5" />
          <circle cx="64" cy="116" r="5.5" />
        </g>
      </g>
    </g>
    <g class="empty-state-playful__small-die">
      <g transform="rotate(14 51 53)">
        <rect x="34" y="36" width="34" height="34" rx="8" class="empty-state-playful__red" />
        <g class="empty-state-playful__white">
          <circle cx="42" cy="44" r="3.5" />
          <circle cx="51" cy="53" r="3.5" />
          <circle cx="60" cy="62" r="3.5" />
        </g>
      </g>
    </g>
    <g transform="translate(88 74)" stroke-width="3" stroke-linejoin="round" class="empty-state-playful__meeple">
      <circle cx="18" cy="8" r="8" />
      <path d="M12 15h12l11 6v6h-9l5 25H21l-3-12-3 12H5l5-25H1v-6Z" />

    <circle cx="14" cy="56" r="3" class="empty-state-playful__pink" />
  </svg>

  <div>
    <h2 id="empty-state-playful-title" class="empty-state-playful__title">Your shelf is empty</h2>
    <p class="empty-state-playful__text">Add the games you own and we&rsquo;ll pick one for game night.</p>
    <div class="empty-state-playful__actions">
      <a href="#" class="empty-state-playful__button">
        <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round">
          <path d="M8 3v10M3 8h10" />
        </svg>
        Add a game
      </a>
      <a href="#" class="empty-state-playful__link">Scan a barcode</a>
    </div>
  </div>
</section>
