<fieldset aria-describedby="toggles-delivery-days-intro toggles-delivery-days-window" class="toggles-delivery-days">
  <legend class="toggles-delivery-days__legend">Bakery delivery days</legend>
  <p class="toggles-delivery-days__eyebrow">The morning loaf</p>
  <h2 class="toggles-delivery-days__title">Your bread days</h2>
  <p id="toggles-delivery-days-intro" class="toggles-delivery-days__intro">Pick the mornings you'd like something fresh at your door.</p>
  <div class="toggles-delivery-days__days">
    <label class="toggles-delivery-days__day">
      <input
        type="checkbox"
        name="toggles-delivery-days-mon"
        aria-label="Monday delivery"
        checked
        class="toggles-delivery-days__checkbox"
      />
      Mon
      <span aria-hidden="true" class="toggles-delivery-days__check">✓</span>
    </label>
    <label class="toggles-delivery-days__day">
      <input
        type="checkbox"
        name="toggles-delivery-days-tue"
        aria-label="Tuesday delivery"
        class="toggles-delivery-days__checkbox"
      />
      Tue
      <span aria-hidden="true" class="toggles-delivery-days__check">✓</span>
    </label>
    <label class="toggles-delivery-days__day">
      <input
        type="checkbox"
        name="toggles-delivery-days-wed"
        aria-label="Wednesday delivery"
        checked
        class="toggles-delivery-days__checkbox"
      />
      Wed
      <span aria-hidden="true" class="toggles-delivery-days__check">✓</span>
    </label>
    <label class="toggles-delivery-days__day">
      <input
        type="checkbox"
        name="toggles-delivery-days-thu"
        aria-label="Thursday delivery"
        class="toggles-delivery-days__checkbox"
      />
      Thu
      <span aria-hidden="true" class="toggles-delivery-days__check">✓</span>
    </label>
    <label class="toggles-delivery-days__day">
      <input
        type="checkbox"
        name="toggles-delivery-days-fri"
        aria-label="Friday delivery"
        checked
        class="toggles-delivery-days__checkbox"
      />
      Fri
      <span aria-hidden="true" class="toggles-delivery-days__check">✓</span>
    </label>
    <label class="toggles-delivery-days__day">
      <input
        type="checkbox"
        name="toggles-delivery-days-sat"
        aria-label="Saturday delivery"
        class="toggles-delivery-days__checkbox"
      />
      Sat
      <span aria-hidden="true" class="toggles-delivery-days__check">✓</span>
    </label>
    <label class="toggles-delivery-days__day">
      <input
        type="checkbox"
        name="toggles-delivery-days-sun"
        aria-label="Sunday delivery"
        class="toggles-delivery-days__checkbox"
      />
      Sun
      <span aria-hidden="true" class="toggles-delivery-days__check">✓</span>
    </label>
  </div>
  <p id="toggles-delivery-days-window" class="toggles-delivery-days__window">Delivered between 07:00 and 09:00.</p>
</fieldset>
