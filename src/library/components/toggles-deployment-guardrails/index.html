<fieldset class="toggles-deployment-guardrails">
  <legend class="toggles-deployment-guardrails__legend">Deployment protections</legend>
  <p class="toggles-deployment-guardrails__eyebrow">Production environment</p>
  <h2 class="toggles-deployment-guardrails__title">Deploy with care</h2>
  <div class="toggles-deployment-guardrails__options">
    <label class="toggles-deployment-guardrails__option">
      <input
        type="checkbox"
        name="toggles-deployment-guardrails-approval"
        checked
        aria-labelledby="toggles-deployment-guardrails-approval-label"
        aria-describedby="toggles-deployment-guardrails-approval-hint"
        class="toggles-deployment-guardrails__checkbox"
      />
      <span>
        <span id="toggles-deployment-guardrails-approval-label" class="toggles-deployment-guardrails__label">Require approval</span>
        <span id="toggles-deployment-guardrails-approval-hint" class="toggles-deployment-guardrails__hint">One teammate reviews each release.</span>
      </span>
    </label>
    <label class="toggles-deployment-guardrails__option">
      <input
        type="checkbox"
        name="toggles-deployment-guardrails-rollback"
        checked
        aria-labelledby="toggles-deployment-guardrails-rollback-label"
        aria-describedby="toggles-deployment-guardrails-rollback-hint"
        class="toggles-deployment-guardrails__checkbox"
      />
      <span>
        <span id="toggles-deployment-guardrails-rollback-label" class="toggles-deployment-guardrails__label">Automatic rollback</span>
        <span id="toggles-deployment-guardrails-rollback-hint" class="toggles-deployment-guardrails__hint">Restore if health checks fail.</span>
      </span>
    </label>
    <label class="toggles-deployment-guardrails__option">
      <input
        type="checkbox"
        name="toggles-deployment-guardrails-window"
        aria-labelledby="toggles-deployment-guardrails-window-label"
        aria-describedby="toggles-deployment-guardrails-window-hint"
        class="toggles-deployment-guardrails__checkbox"
      />
      <span>
        <span id="toggles-deployment-guardrails-window-label" class="toggles-deployment-guardrails__label">Business hours only</span>
        <span id="toggles-deployment-guardrails-window-hint" class="toggles-deployment-guardrails__hint">Weekdays, 09:00–17:00 UTC.</span>
      </span>
    </label>
  </div>
  <p class="toggles-deployment-guardrails__footnote">Build and security checks always run.</p>
</fieldset>
