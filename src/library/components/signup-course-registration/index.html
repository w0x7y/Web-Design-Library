<section class="signup-course-registration">
  <div class="signup-course-registration__inner">
    <header class="signup-course-registration__masthead">
      <p class="signup-course-registration__school">Field School</p>
      <span class="signup-course-registration__cohort">Cohort 06 · Begins November 2</span>
    </header>
    <div class="signup-course-registration__columns">
      <div class="signup-course-registration__intro">
        <h2 class="signup-course-registration__heading">Learn by making.</h2>
        <p class="signup-course-registration__description">A four-week introduction to drawing the world around you. No experience needed.</p>
        <ul class="signup-course-registration__syllabus" role="list">
          <li>01 / Line and shape</li>
          <li>02 / Light and texture</li>
          <li>03 / A sketchbook habit</li>
          <li>04 / Your first field study</li>
        </ul>
      </div>
      <form class="signup-course-registration__form" action="#" method="post">
        <label class="signup-course-registration__field" for="signup-course-registration-name">
          Your name
          <input class="signup-course-registration__input" id="signup-course-registration-name" name="name" type="text" autocomplete="name" placeholder="" required>
        </label>
        <label class="signup-course-registration__field" for="signup-course-registration-email">
          Email address
          <input class="signup-course-registration__input" id="signup-course-registration-email" name="email" type="email" autocomplete="email" placeholder="" required>
        </label>
        <label class="signup-course-registration__field" for="signup-course-registration-experience">
          Drawing experience
          <select class="signup-course-registration__select" name="experience" id="signup-course-registration-experience">
            <option value="beginner">I’m starting from scratch</option>
            <option value="some">I draw occasionally</option>
            <option value="regular">I draw often</option>
          </select>
        </label>
        <button class="signup-course-registration__submit" type="submit">Reserve my place</button>
      </form>
    </div>
  </div>
</section>
