<section aria-label="Checkout actions" class="buttons-commerce-checkout">
  <div class="buttons-commerce-checkout__header">
    <p class="buttons-commerce-checkout__eyebrow">Your bag</p>
    <span class="buttons-commerce-checkout__count">2 items</span>
  </div>
  <div class="buttons-commerce-checkout__summary">
    <p class="buttons-commerce-checkout__prompt">Ready to check out?</p>
    <span class="buttons-commerce-checkout__total">$84.00</span>
  </div>
  <button type="button" class="buttons-commerce-checkout__button buttons-commerce-checkout__button--checkout">
    Secure checkout
    <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" class="buttons-commerce-checkout__checkout-icon">
      <path d="M4 10h12m-5-5 5 5-5 5" />
    </svg>
  </button>
  <button type="button" class="buttons-commerce-checkout__button buttons-commerce-checkout__button--save">
    <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="buttons-commerce-checkout__bookmark-icon">
      <path d="M3 2.5h10v11l-5-3-5 3z" />
    </svg>
    Save bag for later
  </button>
  <p class="buttons-commerce-checkout__shipping">Free shipping on orders over $100.</p>
</section>
