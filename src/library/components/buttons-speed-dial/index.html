<div class="buttons-speed-dial">
  <p class="buttons-speed-dial__content-title">Page content</p>
  <p class="buttons-speed-dial__content-note">Scrolls beneath the floating button.</p>
  <details open class="buttons-speed-dial__dial">
    <summary aria-label="Quick actions" class="buttons-speed-dial__trigger">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="buttons-speed-dial__plus">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
    </summary>
    <ul role="list" class="buttons-speed-dial__actions">
      <li><button type="button" class="buttons-speed-dial__action">
        <span class="buttons-speed-dial__action-label">Create item</span>
        <span aria-hidden="true" class="buttons-speed-dial__action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="buttons-speed-dial__glyph">
            <path d="M14 3H6v18h12V7Zm0 0v4h4m-6 4v6m-3-3h6"></path>
          </svg>
        </span>
      </button></li>
      <li><button type="button" class="buttons-speed-dial__action">
        <span class="buttons-speed-dial__action-label">Upload file</span>
        <span aria-hidden="true" class="buttons-speed-dial__action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="buttons-speed-dial__glyph">
            <path d="M12 15V3M8 7l4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path>
          </svg>
        </span>
      </button></li>
      <li><button type="button" class="buttons-speed-dial__action">
        <span class="buttons-speed-dial__action-label">Invite member</span>
        <span aria-hidden="true" class="buttons-speed-dial__action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="buttons-speed-dial__glyph">
            <circle cx="9" cy="8" r="4"></circle>
            <path d="M2 21a7 7 0 0 1 14 0m3-13v6m-3-3h6"></path>
          </svg>
        </span>
      </button></li>
    </ul>
  </details>
</div>
