<section class="login-studio-portal">
  <div class="login-studio-portal__panel">
    <p class="login-studio-portal__brand">STUDIO / NORTH</p>
    <h2 class="login-studio-portal__heading">Your project, in one place.</h2>
    <p class="login-studio-portal__description">Review the latest work and keep the conversation moving.</p>
    <form class="login-studio-portal__form" action="#" method="post">
      <label class="login-studio-portal__field" for="login-studio-portal-email">
        Email address
        <input class="login-studio-portal__input" id="login-studio-portal-email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
      </label>
      <label class="login-studio-portal__field" for="login-studio-portal-password">
        Password
        <input class="login-studio-portal__input" id="login-studio-portal-password" name="password" type="password" autocomplete="current-password" placeholder="" required>
      </label>
      <div class="login-studio-portal__options">
        <label class="login-studio-portal__remember" for="login-studio-portal-remember">
          <input class="login-studio-portal__checkbox" type="checkbox" name="remember" id="login-studio-portal-remember" aria-labelledby="login-studio-portal-remember-label" aria-describedby="login-studio-portal-remember-hint">
          <span class="login-studio-portal__remember-copy">
            <span class="login-studio-portal__remember-label" id="login-studio-portal-remember-label">Remember this device</span>
            <span class="login-studio-portal__hint" id="login-studio-portal-remember-hint">For your next visit.</span>
          </span>
        </label>
        <a class="login-studio-portal__link" href="#">Reset password</a>
      </div>
      <button class="login-studio-portal__submit" type="submit">Open my workspace</button>
    </form>
    <p class="login-studio-portal__invitation">New here? <a class="login-studio-portal__link" href="#">Ask for an invitation</a></p>
  </div>
</section>
