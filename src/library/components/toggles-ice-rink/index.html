<section aria-labelledby="toggles-ice-rink-title" class="toggles-ice-rink">
  <svg aria-hidden="true" viewBox="0 0 192 192" fill="none" stroke="currentColor" stroke-width="1" class="toggles-ice-rink__rink-lines">
    <rect x="22" y="20" width="148" height="152" rx="66"></rect>
    <rect x="40" y="38" width="112" height="116" rx="48"></rect>
    <path d="M22 96h148M96 20v152"></path>
  </svg>
  <div class="toggles-ice-rink__content">
    <p class="toggles-ice-rink__eyebrow">FROSTLANE / LATE SKATE</p>
    <h2 id="toggles-ice-rink-title" class="toggles-ice-rink__title">Friday, on ice.</h2>
    <div class="toggles-ice-rink__slot">
      <p class="toggles-ice-rink__time">20:30</p>
      <p class="toggles-ice-rink__duration">
        60 minutes
        <br>
        Rink 1
      </p>
    </div>
    <div class="toggles-ice-rink__glass">
      <div class="toggles-ice-rink__control-row">
        <div>
          <label for="toggles-ice-rink-warm" class="toggles-ice-rink__label">Boot warmers</label>
          <p id="toggles-ice-rink-warm-hint" class="toggles-ice-rink__hint">Ready at the rental desk.</p>
        </div>
        <input
          id="toggles-ice-rink-warm"
          name="toggles-ice-rink-warm"
          type="checkbox"
          role="switch"
          aria-describedby="toggles-ice-rink-warm-hint"
          class="toggles-ice-rink__switch"
        >
      </div>
      <div class="toggles-ice-rink__control-row">
        <div>
          <label for="toggles-ice-rink-locker" class="toggles-ice-rink__label">Locker hold</label>
          <p id="toggles-ice-rink-locker-hint" class="toggles-ice-rink__hint">Keep a locker until 22:00.</p>
        </div>
        <input
          id="toggles-ice-rink-locker"
          name="toggles-ice-rink-locker"
          type="checkbox"
          role="switch"
          checked
          aria-describedby="toggles-ice-rink-locker-hint"
          class="toggles-ice-rink__switch"
        >
      </div>
    </div>
  </div>
</section>
