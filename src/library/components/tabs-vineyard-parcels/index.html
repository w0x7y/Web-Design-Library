<section aria-label="Planche Nine vineyard parcels" class="tabs-vineyard-parcels">
  <header class="tabs-vineyard-parcels__masthead">
    <p>Planche Nine</p>
    <span>Estate notes / 2026</span>
  </header>
  <img src="https://images.unsplash.com/photo-1504279577054-acfeccf8fc52?w=800&q=80" alt="Rows of vines on a hillside in warm morning sunlight" width="800" height="600" class="tabs-vineyard-parcels__photo">
  <fieldset class="tabs-vineyard-parcels__selector">
    <legend class="tabs-vineyard-parcels__legend">Choose vineyard parcel</legend>
    <label id="tabs-vineyard-parcels-east-label" class="tabs-vineyard-parcels__tab">
      <input id="tabs-vineyard-parcels-east" type="radio" name="tabs-vineyard-parcels-view" value="east" checked aria-controls="tabs-vineyard-parcels-east-panel" class="tabs-vineyard-parcels__radio">
      East slope
    </label>
    <label id="tabs-vineyard-parcels-west-label" class="tabs-vineyard-parcels__tab">
      <input id="tabs-vineyard-parcels-west" type="radio" name="tabs-vineyard-parcels-view" value="west" aria-controls="tabs-vineyard-parcels-west-panel" class="tabs-vineyard-parcels__radio">
      West terrace
    </label>
  </fieldset>
  <section id="tabs-vineyard-parcels-east-panel" aria-labelledby="tabs-vineyard-parcels-east-label" class="tabs-vineyard-parcels__panel tabs-vineyard-parcels__panel--east">
    <div class="tabs-vineyard-parcels__parcel-heading">
      <h3 class="tabs-vineyard-parcels__parcel-title">East slope</h3>
      <span class="tabs-vineyard-parcels__area">2.4 hectares</span>
    </div>
    <dl class="tabs-vineyard-parcels__facts">
      <div>
        <dt class="tabs-vineyard-parcels__fact-label">Soil</dt>
        <dd>Limestone</dd>
      </div>
      <div>
        <dt class="tabs-vineyard-parcels__fact-label">Aspect</dt>
        <dd>Morning sun</dd>
      </div>
    </dl>
  </section>
  <section id="tabs-vineyard-parcels-west-panel" aria-labelledby="tabs-vineyard-parcels-west-label" class="tabs-vineyard-parcels__panel tabs-vineyard-parcels__panel--west">
    <div class="tabs-vineyard-parcels__parcel-heading">
      <h3 class="tabs-vineyard-parcels__parcel-title">West terrace</h3>
      <span class="tabs-vineyard-parcels__area">1.8 hectares</span>
    </div>
    <dl class="tabs-vineyard-parcels__facts">
      <div>
        <dt class="tabs-vineyard-parcels__fact-label">Soil</dt>
        <dd>Clay loam</dd>
      </div>
      <div>
        <dt class="tabs-vineyard-parcels__fact-label">Aspect</dt>
        <dd>Evening sun</dd>
      </div>
    </dl>
  </section>
</section>
