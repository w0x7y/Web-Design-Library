<div class="dropdowns-laundry-cycle">
  <p class="dropdowns-laundry-cycle__brand"><span class="dropdowns-laundry-cycle__wordmark">foldjoy</span><span class="dropdowns-laundry-cycle__ticket">BAG / 0284</span></p>
  <details open class="dropdowns-laundry-cycle__disclosure">
    <summary class="dropdowns-laundry-cycle__summary">
      <span>Pick your wash cycle</span>
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="dropdowns-laundry-cycle__chevron">
        <path d="m4 6 4 4 4-4" />
      </svg>
    </summary>
    <fieldset class="dropdowns-laundry-cycle__cycles">
      <legend class="dropdowns-laundry-cycle__legend">Wash cycle</legend>
      <label class="dropdowns-laundry-cycle__cycle">
        <span class="dropdowns-laundry-cycle__tile-top">
          <input type="radio" name="dropdowns-laundry-cycle-mode" value="everyday" aria-labelledby="dropdowns-laundry-cycle-0-name" aria-describedby="dropdowns-laundry-cycle-0-hint" checked class="dropdowns-laundry-cycle__radio" /><span class="dropdowns-laundry-cycle__temperature">30°</span></span>
        <span id="dropdowns-laundry-cycle-0-name" class="dropdowns-laundry-cycle__name">Everyday</span>
        <span id="dropdowns-laundry-cycle-0-hint" class="dropdowns-laundry-cycle__hint">Cotton & mixed loads</span>
      </label>
      <label class="dropdowns-laundry-cycle__cycle">
        <span class="dropdowns-laundry-cycle__tile-top">
          <input type="radio" name="dropdowns-laundry-cycle-mode" value="delicates" aria-labelledby="dropdowns-laundry-cycle-1-name" aria-describedby="dropdowns-laundry-cycle-1-hint" class="dropdowns-laundry-cycle__radio" /><span class="dropdowns-laundry-cycle__temperature">20°</span></span>
        <span id="dropdowns-laundry-cycle-1-name" class="dropdowns-laundry-cycle__name">Delicates</span>
        <span id="dropdowns-laundry-cycle-1-hint" class="dropdowns-laundry-cycle__hint">Gentle spin</span>
      </label>
      <label class="dropdowns-laundry-cycle__cycle">
        <span class="dropdowns-laundry-cycle__tile-top">
          <input type="radio" name="dropdowns-laundry-cycle-mode" value="linen" aria-labelledby="dropdowns-laundry-cycle-2-name" aria-describedby="dropdowns-laundry-cycle-2-hint" class="dropdowns-laundry-cycle__radio" /><span class="dropdowns-laundry-cycle__temperature">40°</span></span>
        <span id="dropdowns-laundry-cycle-2-name" class="dropdowns-laundry-cycle__name">Linen</span>
        <span id="dropdowns-laundry-cycle-2-hint" class="dropdowns-laundry-cycle__hint">Sheets & towels</span>
      </label>
      <label class="dropdowns-laundry-cycle__cycle">
        <span class="dropdowns-laundry-cycle__tile-top">
          <input type="radio" name="dropdowns-laundry-cycle-mode" value="wool" aria-labelledby="dropdowns-laundry-cycle-3-name" aria-describedby="dropdowns-laundry-cycle-3-hint" class="dropdowns-laundry-cycle__radio" /><span class="dropdowns-laundry-cycle__temperature">20°</span></span>
        <span id="dropdowns-laundry-cycle-3-name" class="dropdowns-laundry-cycle__name">Wool</span>
        <span id="dropdowns-laundry-cycle-3-hint" class="dropdowns-laundry-cycle__hint">Low agitation</span>
      </label>
    </fieldset>
    <p class="dropdowns-laundry-cycle__note">One cycle per bag. We sort the rest.</p>
  </details>
</div>
