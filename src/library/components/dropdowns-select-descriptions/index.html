<div class="dropdowns-select-descriptions">
  <p id="dropdowns-select-descriptions-label" class="dropdowns-select-descriptions__label">Plan</p>
  <details open class="dropdowns-select-descriptions__disclosure">
    <summary aria-labelledby="dropdowns-select-descriptions-label dropdowns-select-descriptions-value" class="dropdowns-select-descriptions__trigger">
      <span id="dropdowns-select-descriptions-value"><span class="dropdowns-select-descriptions__value dropdowns-select-descriptions__value--individual">Individual</span><span class="dropdowns-select-descriptions__value dropdowns-select-descriptions__value--team">Team</span><span class="dropdowns-select-descriptions__value dropdowns-select-descriptions__value--enterprise">Enterprise</span></span>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dropdowns-select-descriptions__chevron">
        <path d="m6 9 6 6 6-6"></path>
      </svg>
    </summary>
    <div class="dropdowns-select-descriptions__panel">
      <fieldset>
        <legend class="dropdowns-select-descriptions__legend">Choose a plan</legend>
        <label class="dropdowns-select-descriptions__option dropdowns-select-descriptions__option--enabled">
      <input id="dropdowns-select-descriptions-individual" type="radio" aria-labelledby="dropdowns-select-descriptions-individual-title" aria-describedby="dropdowns-select-descriptions-individual-description" name="dropdowns-select-descriptions" checked class="dropdowns-select-descriptions__input">
      <span><span id="dropdowns-select-descriptions-individual-title" class="dropdowns-select-descriptions__option-title">Individual</span><span id="dropdowns-select-descriptions-individual-description" class="dropdowns-select-descriptions__description">For one person</span></span>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dropdowns-select-descriptions__check">
        <path d="m5 12 4 4L19 6"></path>
      </svg>
    </label>
        <label class="dropdowns-select-descriptions__option dropdowns-select-descriptions__option--enabled">
      <input id="dropdowns-select-descriptions-team" type="radio" aria-labelledby="dropdowns-select-descriptions-team-title" aria-describedby="dropdowns-select-descriptions-team-description" name="dropdowns-select-descriptions" class="dropdowns-select-descriptions__input">
      <span><span id="dropdowns-select-descriptions-team-title" class="dropdowns-select-descriptions__option-title">Team</span><span id="dropdowns-select-descriptions-team-description" class="dropdowns-select-descriptions__description">For shared access</span></span>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dropdowns-select-descriptions__check">
        <path d="m5 12 4 4L19 6"></path>
      </svg>
    </label>
        <label class="dropdowns-select-descriptions__option dropdowns-select-descriptions__option--disabled">
      <input id="dropdowns-select-descriptions-enterprise" type="radio" aria-labelledby="dropdowns-select-descriptions-enterprise-title" aria-describedby="dropdowns-select-descriptions-enterprise-description" disabled name="dropdowns-select-descriptions" class="dropdowns-select-descriptions__input">
      <span><span id="dropdowns-select-descriptions-enterprise-title" class="dropdowns-select-descriptions__option-title">Enterprise</span><span id="dropdowns-select-descriptions-enterprise-description" class="dropdowns-select-descriptions__description">For advanced support</span></span>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dropdowns-select-descriptions__check">
        <path d="m5 12 4 4L19 6"></path>
      </svg>
    </label>
      </fieldset>
    </div>
  </details>
</div>
