<article class="product-card-minimal">
  <div class="product-card-minimal__media">
    <img
      src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800&q=80"
      alt="Lull Watch 2 in Chalk: a white case and strap around a black face"
      width="800"
      height="581"
      class="product-card-minimal__photo"
    />
    <label class="product-card-minimal__save">
      <input type="checkbox" class="product-card-minimal__sr-only" />
      <span class="product-card-minimal__sr-only">Save to wishlist</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
        <path d="M21 8.25c0-2.49-2.1-4.5-4.69-4.5-1.93 0-3.6 1.13-4.31 2.73-.72-1.6-2.38-2.73-4.31-2.73C5.1 3.75 3 5.76 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
      </svg>
    </label>
  </div>

  <div class="product-card-minimal__head">
    <h2 class="product-card-minimal__name"><a href="#">Lull Watch 2</a></h2>
    <p class="product-card-minimal__price">€219</p>
  </div>
  <p class="product-card-minimal__tagline">Sleep and recovery tracker</p>

  <div class="product-card-minimal__actions">
    <fieldset class="product-card-minimal__colours">
      <legend class="product-card-minimal__sr-only">Colour</legend>
      <label class="product-card-minimal__colour">
        <input type="radio" name="product-card-minimal-colour" value="chalk" checked class="product-card-minimal__sr-only" />
        <span aria-hidden="true" class="product-card-minimal__swatch product-card-minimal__swatch--chalk"></span>
        Chalk
      </label>
      <label class="product-card-minimal__colour">
        <input type="radio" name="product-card-minimal-colour" value="fog" class="product-card-minimal__sr-only" />
        <span aria-hidden="true" class="product-card-minimal__swatch product-card-minimal__swatch--fog"></span>
        Fog
      </label>
      <label class="product-card-minimal__colour">
        <input type="radio" name="product-card-minimal-colour" value="ink" class="product-card-minimal__sr-only" />
        <span aria-hidden="true" class="product-card-minimal__swatch product-card-minimal__swatch--ink"></span>
        Ink
      </label>
    </fieldset>

    <button type="button" aria-label="Add Lull Watch 2 to bag" class="product-card-minimal__add">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M8 3.5v9M3.5 8h9" />
      </svg>
      Add
    </button>
  </div>
</article>
