<fieldset class="inputs-date-range">
  <legend class="inputs-date-range__legend">Date range</legend>
  <div class="inputs-date-range__date-fields">
    <div>
      <label for="inputs-date-range-start" class="inputs-date-range__field-label">Start date</label>
      <div class="inputs-date-range__date-focus-frame">
        <input id="inputs-date-range-start" type="date" aria-describedby="inputs-date-range-hint" name="start" value="2026-10-11" class="inputs-date-range__date-field">
      </div>
    </div>
    <div>
      <label for="inputs-date-range-end" class="inputs-date-range__field-label">End date</label>
      <div class="inputs-date-range__date-focus-frame">
        <input id="inputs-date-range-end" type="date" aria-describedby="inputs-date-range-hint" name="end" value="2026-10-18" class="inputs-date-range__date-field">
      </div>
    </div>
  </div>
  <p id="inputs-date-range-hint" class="inputs-date-range__range-hint">Dates follow your local timezone.</p>
</fieldset>
