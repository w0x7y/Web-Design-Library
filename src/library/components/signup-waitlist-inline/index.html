<section class="signup-waitlist-inline">
  <div class="signup-waitlist-inline__container">
    <div class="signup-waitlist-inline__content">
      <header class="signup-waitlist-inline__header">
        <span class="signup-waitlist-inline__badge">Opens Mar 14</span>
        <h1 class="signup-waitlist-inline__title">Headline inviting early interest</h1>
        <p class="signup-waitlist-inline__lede">A short introduction explaining what opens next and why readers should join.</p>
      </header>
      <form class="signup-waitlist-inline__form">
        <div class="signup-waitlist-inline__email-row">
          <div class="signup-waitlist-inline__email-field"><label for="signup-waitlist-inline-email" class="signup-waitlist-inline__label">Email</label><input id="signup-waitlist-inline-email" type="email" autocomplete="email" required aria-describedby="signup-waitlist-inline-email-hint" placeholder="name@example.com" name="email" class="signup-waitlist-inline__input"></div>
          <button type="submit" class="signup-waitlist-inline__submit">Join the waitlist</button>
        </div>
        <p id="signup-waitlist-inline-email-hint" class="signup-waitlist-inline__email-hint">Hint explaining when emails arrive and how the address is used.</p>
      </form>
      <div class="signup-waitlist-inline__social-proof">
        <div aria-hidden="true" class="signup-waitlist-inline__avatars">
          <span class="signup-waitlist-inline__avatar">AR</span>
          <span class="signup-waitlist-inline__avatar signup-waitlist-inline__avatar--overlap">JL</span>
          <span class="signup-waitlist-inline__avatar signup-waitlist-inline__avatar--overlap">MK</span>
        </div>
        <p class="signup-waitlist-inline__join-count">1,284 people have joined</p>
      </div>
    </div>
  </div>
</section>
