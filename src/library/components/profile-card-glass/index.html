<article class="profile-card-glass">
  <div aria-hidden="true" class="profile-card-glass__glow"></div>
  <div aria-hidden="true" class="profile-card-glass__orb"></div>

  <div class="profile-card-glass__card">
    <img
      src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400&q=80"
      alt=""
      width="400"
      height="599"
      class="profile-card-glass__avatar"
    />

    <h2 class="profile-card-glass__name">
      Clara Ibsen
      <svg role="img" aria-label="Verified account" viewBox="0 0 20 20" fill="currentColor" class="profile-card-glass__verified">
        <path
          fill-rule="evenodd"
          d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z"
          clip-rule="evenodd"
        />
      </svg>
    </h2>
    <p class="profile-card-glass__role">Landscape photographer, Oslo</p>

    <dl class="profile-card-glass__stats">
      <div class="profile-card-glass__stat">
        <dt>Photos</dt>
        <dd>1.2k</dd>
      </div>
      <div class="profile-card-glass__stat">
        <dt>Followers</dt>
        <dd>48.2k</dd>
      </div>
      <div class="profile-card-glass__stat">
        <dt>Following</dt>
        <dd>312</dd>
      </div>
    </dl>

    <div class="profile-card-glass__actions">
      <button type="button" class="profile-card-glass__follow">
        <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <path d="M8 3.5v9M3.5 8h9" />
        </svg>
        Follow
      </button>
      <button type="button" aria-label="Message Clara" class="profile-card-glass__message">
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M6.5 3h7A2.5 2.5 0 0 1 16 5.5v5a2.5 2.5 0 0 1-2.5 2.5h-4L6 16v-3h.5A2.5 2.5 0 0 1 4 10.5v-5A2.5 2.5 0 0 1 6.5 3Z" />
        </svg>
      </button>
    </div>
  </div>
</article>
