<div class="inputs-textarea-counter">
  <div class="inputs-textarea-counter__label-row">
    <label for="counter-message" class="inputs-textarea-counter__label">Message</label>
    <span class="inputs-textarea-counter__optional">Optional</span>
  </div>
  <div class="inputs-textarea-counter__composer">
    <textarea id="counter-message" name="message" maxlength="280" aria-describedby="counter-count counter-hint" placeholder="Write a short message" class="inputs-textarea-counter__textarea"></textarea>
    <div class="inputs-textarea-counter__toolbar">
      <div class="inputs-textarea-counter__utilities">
        <button type="button" aria-label="Attach a file" class="inputs-textarea-counter__action inputs-textarea-counter__action--utility">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="inputs-textarea-counter__icon">
            <path d="m8 12 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l9-9M7 13l7-7"></path>
          </svg>
        </button>
        <button type="button" aria-label="Mention a person" class="inputs-textarea-counter__action inputs-textarea-counter__action--utility">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="inputs-textarea-counter__icon">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M16 8v6a2 2 0 0 0 4 0v-2a8 8 0 1 0-3 6.2"></path>
          </svg>
        </button>
      </div>
      <div class="inputs-textarea-counter__submit-group">
        <span id="counter-count" class="inputs-textarea-counter__count">0 / 280</span>
        <button type="button" class="inputs-textarea-counter__action inputs-textarea-counter__action--post">Post</button>
      </div>
    </div>
  </div>
  <p id="counter-hint" class="inputs-textarea-counter__hint">Hint about what to include.</p>
</div>
