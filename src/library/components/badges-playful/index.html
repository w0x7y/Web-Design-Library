<div class="badges-playful">
  <!-- Status stickers -->
  <ul role="list" class="badges-playful__row badges-playful__row--status">
    <li class="badges-playful__status badges-playful__status--available">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 14s-6-3.5-6-8.1A3.2 3.2 0 0 1 8 4.2a3.2 3.2 0 0 1 6 1.7C14 10.5 8 14 8 14Z" />
      </svg>
      Available
    </li>
    <li class="badges-playful__status badges-playful__status--reserved">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6" />
        <path d="M8 5v3l2 1.5" />
      </svg>
      Reserved
    </li>
    <li class="badges-playful__status badges-playful__status--adopted">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="currentColor">
        <path d="M7.4 1.9a1 1 0 0 1 1.2 0l5.5 4.4a1 1 0 0 1 .4.8V13a1.5 1.5 0 0 1-1.5 1.5H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4H3A1.5 1.5 0 0 1 1.5 13V7.1a1 1 0 0 1 .4-.8l5.5-4.4Z" />
      </svg>
      Adopted!
    </li>
    <li class="badges-playful__status badges-playful__status--vet">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="currentColor">
        <path d="M6.5 2h3a.5.5 0 0 1 .5.5V6h3.5a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-.5.5H10v3.5a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5V10H2.5a.5.5 0 0 1-.5-.5v-3a.5.5 0 0 1 .5-.5H6V2.5a.5.5 0 0 1 .5-.5Z" />
      </svg>
      Vet care
    </li>
  </ul>

  <!-- Trait tags -->
  <ul role="list" class="badges-playful__row badges-playful__row--traits">
    <li class="badges-playful__trait">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
        <circle cx="8" cy="8" r="6" />
        <path d="M5.75 9.5a2.6 2.6 0 0 0 4.5 0M6 6.25v.5M10 6.25v.5" />
      </svg>
      Good with kids
    </li>
    <li class="badges-playful__trait">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.75 13.25V3l3.5 2.75h3.5L13.25 3v10.25Z" />
      </svg>
      Cat-friendly
    </li>
    <li class="badges-playful__trait">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 8.5 3 3 7-7.5" />
      </svg>
      House-trained
    </li>
    <li class="badges-playful__trait">
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 3h4.5L2.5 9H7M9 8h4.5L9 13h4.5" />
      </svg>
      Snores a little
    </li>
  </ul>

  <!-- Counter, sticker, live dot and removable filter -->
  <ul role="list" class="badges-playful__row badges-playful__row--extras">
    <li class="badges-playful__count">
      New arrivals
      <span class="badges-playful__count-number">12</span>
    </li>
    <li class="badges-playful__burst">
      <svg aria-hidden="true" viewBox="0 0 56 56" stroke-linejoin="round">
        <path d="M28 1.5 33.6 7.2 41.3 5.1 43.2 12.8 50.9 14.8 48.8 22.4 54.5 28 48.8 33.6 50.9 41.3 43.2 43.2 41.3 50.9 33.6 48.8 28 54.5 22.4 48.8 14.8 50.9 12.8 43.2 5.1 41.3 7.2 33.6 1.5 28 7.2 22.4 5.1 14.7 12.8 12.8 14.7 5.1 22.4 7.2Z" />
      </svg>
      <span>New</span>
    </li>
    <li class="badges-playful__live">
      <span aria-hidden="true" class="badges-playful__dot">
        <span class="badges-playful__dot-ping"></span>
        <span class="badges-playful__dot-core"></span>
      </span>
      Open for visits
    </li>
    <li class="badges-playful__chip">
      Dogs
      <button type="button" aria-label="Remove filter: Dogs" class="badges-playful__remove">
        <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="m4.5 4.5 7 7m0-7-7 7" />
        </svg>
      </button>
    </li>
  </ul>
</div>
