<div class="inputs-linked-url-preview">
  <label for="inputs-linked-url-preview-url" class="inputs-linked-url-preview__url-label">Page URL</label><input id="inputs-linked-url-preview-url" type="url" aria-describedby="inputs-linked-url-preview-hint" name="url" value="https://example.com" class="inputs-linked-url-preview__url-input">
  <p id="inputs-linked-url-preview-hint" class="inputs-linked-url-preview__url-hint">Enter the full address, including https://.</p>
  <div class="inputs-linked-url-preview__link-preview">
    <span class="inputs-linked-url-preview__page-icon">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="inputs-linked-url-preview__icon">
        <path d="m10 13 4-2m-6 4H6a4 4 0 0 1 0-8h4m4 0h4a4 4 0 0 1 0 8h-4"></path>
      </svg>
    </span>
    <div class="inputs-linked-url-preview__page-summary">
      <p class="inputs-linked-url-preview__page-title">Linked page title</p>
      <p class="inputs-linked-url-preview__page-domain">example.com</p>
    </div>
    <button type="button" aria-label="Remove linked page preview" class="inputs-linked-url-preview__remove-preview">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="inputs-linked-url-preview__icon-sm">
        <path d="m6 6 12 12M6 18 18 6"></path>
      </svg>
    </button>
  </div>
</div>
