<details open class="dropdowns-display-settings">
  <summary class="dropdowns-display-settings__trigger">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dropdowns-display-settings__icon">
      <path d="M4 7h16M4 17h16"></path>
      <circle cx="9" cy="7" r="3"></circle>
      <circle cx="15" cy="17" r="3"></circle>
    </svg>
    <span class="dropdowns-display-settings__trigger-label">Display options</span>
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dropdowns-display-settings__icon">
      <path d="m6 9 6 6 6-6"></path>
    </svg>
  </summary>
  <div class="dropdowns-display-settings__settings-panel">
    <div class="dropdowns-display-settings__setting-fields">
      <div><label for="dropdowns-display-settings-density" class="dropdowns-display-settings__setting-label">Density</label><select id="dropdowns-display-settings-density" name="density" aria-describedby="dropdowns-display-settings-hint" class="dropdowns-display-settings__setting-select"><option>Comfortable</option><option>Compact</option></select></div>
      <div><label for="dropdowns-display-settings-grouping" class="dropdowns-display-settings__setting-label">Group by</label><select id="dropdowns-display-settings-grouping" name="grouping" aria-describedby="dropdowns-display-settings-hint" class="dropdowns-display-settings__setting-select"><option>None</option><option>Status</option><option>Owner</option></select></div>
    </div>
    <p id="dropdowns-display-settings-hint" class="dropdowns-display-settings__setting-hint">Choose how the collection is arranged.</p>
  </div>
</details>
