<fieldset aria-describedby="toggles-checkbox-tile-grid-hint toggles-checkbox-tile-grid-note" class="toggles-checkbox-tile-grid">
  <legend class="toggles-checkbox-tile-grid__title">Choose days</legend>
  <p id="toggles-checkbox-tile-grid-hint" class="toggles-checkbox-tile-grid__hint">Select every day that applies</p>
  <div class="toggles-checkbox-tile-grid__days">
    <label class="toggles-checkbox-tile-grid__day">
      <input type="checkbox" aria-label="Monday" name="toggles-checkbox-tile-grid-days" checked value="monday" class="toggles-checkbox-tile-grid__input">
      <span aria-hidden="true">Mon</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="toggles-checkbox-tile-grid__check">
        <path d="m5 12 4 4L19 6"></path>
      </svg>
    </label>
    <label class="toggles-checkbox-tile-grid__day">
      <input type="checkbox" aria-label="Tuesday" name="toggles-checkbox-tile-grid-days" value="tuesday" class="toggles-checkbox-tile-grid__input">
      <span aria-hidden="true">Tue</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="toggles-checkbox-tile-grid__check">
        <path d="m5 12 4 4L19 6"></path>
      </svg>
    </label>
    <label class="toggles-checkbox-tile-grid__day">
      <input type="checkbox" aria-label="Wednesday" name="toggles-checkbox-tile-grid-days" checked value="wednesday" class="toggles-checkbox-tile-grid__input">
      <span aria-hidden="true">Wed</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="toggles-checkbox-tile-grid__check">
        <path d="m5 12 4 4L19 6"></path>
      </svg>
    </label>
    <label class="toggles-checkbox-tile-grid__day">
      <input type="checkbox" aria-label="Thursday" name="toggles-checkbox-tile-grid-days" value="thursday" class="toggles-checkbox-tile-grid__input">
      <span aria-hidden="true">Thu</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="toggles-checkbox-tile-grid__check">
        <path d="m5 12 4 4L19 6"></path>
      </svg>
    </label>
    <label class="toggles-checkbox-tile-grid__day">
      <input type="checkbox" aria-label="Friday" name="toggles-checkbox-tile-grid-days" checked value="friday" class="toggles-checkbox-tile-grid__input">
      <span aria-hidden="true">Fri</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="toggles-checkbox-tile-grid__check">
        <path d="m5 12 4 4L19 6"></path>
      </svg>
    </label>
    <label class="toggles-checkbox-tile-grid__day">
      <input type="checkbox" aria-label="Saturday" name="toggles-checkbox-tile-grid-days" value="saturday" class="toggles-checkbox-tile-grid__input">
      <span aria-hidden="true">Sat</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="toggles-checkbox-tile-grid__check">
        <path d="m5 12 4 4L19 6"></path>
      </svg>
    </label>
    <label class="toggles-checkbox-tile-grid__day">
      <input type="checkbox" aria-label="Sunday" disabled name="toggles-checkbox-tile-grid-days" value="sunday" class="toggles-checkbox-tile-grid__input">
      <span aria-hidden="true">Sun</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="toggles-checkbox-tile-grid__check">
        <path d="m5 12 4 4L19 6"></path>
      </svg>
    </label>
  </div>
  <p id="toggles-checkbox-tile-grid-note" class="toggles-checkbox-tile-grid__note">Short schedule guidance</p>
</fieldset>
