<section aria-labelledby="toggles-arcade-scoreboard-title" class="toggles-arcade-scoreboard">
  <p class="toggles-arcade-scoreboard__eyebrow">PIXELPOUR / CABINET 07</p>
  <h2 id="toggles-arcade-scoreboard-title" class="toggles-arcade-scoreboard__title">One more credit.</h2>
  <div class="toggles-arcade-scoreboard__score">
    <p class="toggles-arcade-scoreboard__points">84,600</p>
    <p class="toggles-arcade-scoreboard__unit">points / tonight’s best</p>
  </div>
  <div class="toggles-arcade-scoreboard__publishing">
    <div>
      <label for="toggles-arcade-scoreboard-publish" class="toggles-arcade-scoreboard__label">Post high score</label>
      <p id="toggles-arcade-scoreboard-publish-hint" class="toggles-arcade-scoreboard__hint">Show initials on the board.</p>
    </div>
    <input
      id="toggles-arcade-scoreboard-publish"
      name="toggles-arcade-scoreboard-publish"
      type="checkbox"
      role="switch"
      checked
      aria-describedby="toggles-arcade-scoreboard-publish-hint"
      class="toggles-arcade-scoreboard__switch"
    >
  </div>
  <dl class="toggles-arcade-scoreboard__session">
    <div>
      <dt class="toggles-arcade-scoreboard__fact-label">Player</dt>
      <dd>JAX</dd>
    </div>
    <div>
      <dt class="toggles-arcade-scoreboard__fact-label">Credits</dt>
      <dd>03 left</dd>
    </div>
  </dl>
</section>
