<fieldset class="toggles-radio-cards">
  <legend class="toggles-radio-cards__title">Plan selection</legend>
  <div class="toggles-radio-cards__plans">
    <label class="toggles-radio-cards__plan">
      <input type="radio" aria-describedby="toggles-radio-cards-description-1" name="toggles-radio-cards-plan" checked value="1" class="toggles-radio-cards__input">
      <span aria-hidden="true" class="toggles-radio-cards__indicator">
        <span class="toggles-radio-cards__dot"></span>
      </span>
      <span class="toggles-radio-cards__copy"><span class="toggles-radio-cards__name">Plan name</span><span id="toggles-radio-cards-description-1" class="toggles-radio-cards__description">Description of plan scope</span></span>
      <span class="toggles-radio-cards__figure">$29</span>
    </label>
    <label class="toggles-radio-cards__plan">
      <input type="radio" aria-describedby="toggles-radio-cards-description-2" name="toggles-radio-cards-plan" value="2" class="toggles-radio-cards__input">
      <span aria-hidden="true" class="toggles-radio-cards__indicator">
        <span class="toggles-radio-cards__dot"></span>
      </span>
      <span class="toggles-radio-cards__copy"><span class="toggles-radio-cards__name">Plan label</span><span id="toggles-radio-cards-description-2" class="toggles-radio-cards__description">Summary of included access</span></span>
      <span class="toggles-radio-cards__figure">$59</span>
    </label>
    <label class="toggles-radio-cards__plan">
      <input type="radio" aria-describedby="toggles-radio-cards-description-3" disabled name="toggles-radio-cards-plan" value="3" class="toggles-radio-cards__input">
      <span aria-hidden="true" class="toggles-radio-cards__indicator">
        <span class="toggles-radio-cards__dot"></span>
      </span>
      <span class="toggles-radio-cards__copy"><span class="toggles-radio-cards__name">Plan title</span><span id="toggles-radio-cards-description-3" class="toggles-radio-cards__description">Details of available options</span></span>
      <span class="toggles-radio-cards__figure">$99</span>
    </label>
  </div>
</fieldset>
