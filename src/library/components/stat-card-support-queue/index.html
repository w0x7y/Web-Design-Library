<article class="stat-card-support-queue">
  <div class="stat-card-support-queue__header">
    <h2 class="stat-card-support-queue__title">A little help needed</h2>
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="stat-card-support-queue__message-icon">
      <path d="M7 4h10a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-5l-5 4v-4a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z" />
      <path d="M8 9h8m-8 4h5" />
    </svg>
  </div>
  <p class="stat-card-support-queue__total">12</p>
  <p class="stat-card-support-queue__description">Conversations waiting for a reply</p>
  <!-- Priority is always named in text -->
  <dl class="stat-card-support-queue__priorities">
    <div class="stat-card-support-queue__priority">
      <dt class="stat-card-support-queue__term">
        <span aria-hidden="true" class="stat-card-support-queue__dot stat-card-support-queue__dot--urgent"></span>
        Urgent
      </dt>
      <dd class="stat-card-support-queue__count">2</dd>
    </div>
    <div class="stat-card-support-queue__priority">
      <dt class="stat-card-support-queue__term">
        <span aria-hidden="true" class="stat-card-support-queue__dot stat-card-support-queue__dot--normal"></span>
        Normal
      </dt>
      <dd class="stat-card-support-queue__count">7</dd>
    </div>
    <div class="stat-card-support-queue__priority">
      <dt class="stat-card-support-queue__term">
        <span aria-hidden="true" class="stat-card-support-queue__dot stat-card-support-queue__dot--low"></span>
        Low
      </dt>
      <dd class="stat-card-support-queue__count">3</dd>
    </div>
  </dl>
  <p class="stat-card-support-queue__response"><span class="stat-card-support-queue__response-time">18 min</span> average first response today</p>
</article>
