<section class="login-flower-market">
  <div class="login-flower-market__inner">
    <header class="login-flower-market__header">
      <p class="login-flower-market__brand">Petalshift</p>
      <p class="login-flower-market__trade">Early stems. Independent florists.</p>
    </header>
    <div class="login-flower-market__body">
      <div class="login-flower-market__access">
        <h1 class="login-flower-market__heading">The market is open.</h1>
        <p
          id="login-flower-market-hint"
          class="login-flower-market__hint"
        >
          Sign in to see today’s grower availability and build your next wholesale order.
        </p>
        <form action="#" method="post" class="login-flower-market__form">
          <label for="login-flower-market-email" class="login-flower-market__label">
            Buyer email
            <input
              id="login-flower-market-email"
              name="email"
              type="email"
              autocomplete="username"
              required
              aria-describedby="login-flower-market-hint"
              class="login-flower-market__input"
            >
          </label>
          <label for="login-flower-market-password" class="login-flower-market__label">
            Password
            <input
              id="login-flower-market-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="login-flower-market__input"
            >
          </label>
          <button type="submit" class="login-flower-market__submit">Open the stem list</button>
          <a href="#" class="login-flower-market__help">Trouble signing in?</a>
        </form>
        <p class="login-flower-market__cutoff">Order by 11am for next-morning collection. Trade accounts only.</p>
      </div>
      <figure class="login-flower-market__illustration">
        <svg viewBox="0 0 360 300" aria-hidden="true" class="login-flower-market__flowers">
          <path d="M100 270V105M180 270V70M270 270V120" stroke="#365314" stroke-width="7" stroke-linecap="round" />
          <path
            d="M99 224C52 222 40 188 44 169c43 5 52 26 55 55M181 185c36-8 63-34 59-65-43 9-54 32-59 65M269 240c-40-1-60-24-61-50 37 3 55 21 61 50"
            fill="#365314"
           />
          <path
            d="M63 62 99 82l37-20v35c0 48-73 48-73 0ZM143 27l37 20 37-20v35c0 48-74 48-74 0ZM233 75l37 20 37-20v35c0 48-74 48-74 0Z"
            fill="#be123c"
           />
          <path d="M50 276h270" stroke="#881337" stroke-width="2" />
        </svg>
        <figcaption class="login-flower-market__caption">
          <span>Grower direct</span>
          <span>Sold by the bunch</span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
