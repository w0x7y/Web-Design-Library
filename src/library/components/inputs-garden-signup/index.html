<section aria-label="Garden club signup fields" class="inputs-garden-signup">
  <div class="inputs-garden-signup__header">
    <span aria-hidden="true" class="inputs-garden-signup__leaf-tile">
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" class="inputs-garden-signup__leaf-icon">
        <path d="M16 3c0 9-5 12-11 9C2 6 7 3 16 3ZM5 15l7-7" />
      </svg>
    </span>
    <div>
      <p class="inputs-garden-signup__eyebrow">Good things grow here</p>
      <h2 class="inputs-garden-signup__heading">Join the garden</h2>
    </div>
  </div>
  <label for="inputs-garden-signup-name" class="inputs-garden-signup__label inputs-garden-signup__label--name">What should we call you?</label>
  <input
    id="inputs-garden-signup-name"
    type="text"
    autocomplete="given-name"
    placeholder="Your first name"
    class="inputs-garden-signup__input"
    name="name"
  />
  <label for="inputs-garden-signup-email" class="inputs-garden-signup__label inputs-garden-signup__label--email">Your email</label>
  <input
    id="inputs-garden-signup-email"
    type="email"
    autocomplete="email"
    placeholder="you@example.com"
    class="inputs-garden-signup__input"
    name="email"
  />
  <label class="inputs-garden-signup__volunteer">
    <input
      type="checkbox"
      class="inputs-garden-signup__checkbox"
      name="inputs-garden-signup-volunteer"
    />
    <span>I'd like to help at the next planting day.</span>
  </label>
</section>
