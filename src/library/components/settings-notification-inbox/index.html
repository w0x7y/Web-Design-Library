<section class="settings-notification-inbox">
  <form class="settings-notification-inbox__form" action="#">
    <header class="settings-notification-inbox__header">
      <p class="settings-notification-inbox__eyebrow">ACCOUNT / NOTIFICATIONS</p>
      <h2 class="settings-notification-inbox__heading">Keep the useful updates.</h2>
      <p class="settings-notification-inbox__description">Choose what reaches you and where.</p>
    </header>
    <div class="settings-notification-inbox__channels">
      <fieldset class="settings-notification-inbox__channel">
        <legend class="settings-notification-inbox__legend">Email</legend>
        <label class="settings-notification-inbox__preference" for="settings-notification-inbox-email-mentions">
          <input
            class="settings-notification-inbox__checkbox"
            type="checkbox"
            id="settings-notification-inbox-email-mentions"
            aria-labelledby="settings-notification-inbox-email-mentions-label"
            aria-describedby="settings-notification-inbox-email-mentions-hint"
            name="email-mentions"
            checked=""
          >
          <span class="settings-notification-inbox__preference-copy">
            <span id="settings-notification-inbox-email-mentions-label" class="settings-notification-inbox__preference-title">Mentions and replies</span>
            <span class="settings-notification-inbox__hint" id="settings-notification-inbox-email-mentions-hint">When someone needs your input.</span>
          </span>
        </label>
        <label class="settings-notification-inbox__preference" for="settings-notification-inbox-email-digest">
          <input
            class="settings-notification-inbox__checkbox"
            type="checkbox"
            id="settings-notification-inbox-email-digest"
            aria-labelledby="settings-notification-inbox-email-digest-label"
            aria-describedby="settings-notification-inbox-email-digest-hint"
            name="email-digest"
            checked=""
          >
          <span class="settings-notification-inbox__preference-copy">
            <span id="settings-notification-inbox-email-digest-label" class="settings-notification-inbox__preference-title">Weekly project digest</span>
            <span class="settings-notification-inbox__hint" id="settings-notification-inbox-email-digest-hint">A summary every Monday.</span>
          </span>
        </label>
        <label class="settings-notification-inbox__preference" for="settings-notification-inbox-email-news">
          <input
            class="settings-notification-inbox__checkbox"
            type="checkbox"
            id="settings-notification-inbox-email-news"
            aria-labelledby="settings-notification-inbox-email-news-label"
            aria-describedby="settings-notification-inbox-email-news-hint"
            name="email-news"
          >
          <span class="settings-notification-inbox__preference-copy">
            <span id="settings-notification-inbox-email-news-label" class="settings-notification-inbox__preference-title">Product news</span>
            <span class="settings-notification-inbox__hint" id="settings-notification-inbox-email-news-hint">Occasional feature announcements.</span>
          </span>
        </label>
      </fieldset>
      <fieldset class="settings-notification-inbox__channel">
        <legend class="settings-notification-inbox__legend">In-app</legend>
        <label class="settings-notification-inbox__preference" for="settings-notification-inbox-app-assignments">
          <input
            class="settings-notification-inbox__checkbox"
            type="checkbox"
            id="settings-notification-inbox-app-assignments"
            aria-labelledby="settings-notification-inbox-app-assignments-label"
            aria-describedby="settings-notification-inbox-app-assignments-hint"
            name="app-assignments"
            checked=""
          >
          <span class="settings-notification-inbox__preference-copy">
            <span id="settings-notification-inbox-app-assignments-label" class="settings-notification-inbox__preference-title">New assignments</span>
            <span class="settings-notification-inbox__hint" id="settings-notification-inbox-app-assignments-hint">Tasks added to your queue.</span>
          </span>
        </label>
        <label class="settings-notification-inbox__preference" for="settings-notification-inbox-app-status">
          <input
            class="settings-notification-inbox__checkbox"
            type="checkbox"
            id="settings-notification-inbox-app-status"
            aria-labelledby="settings-notification-inbox-app-status-label"
            aria-describedby="settings-notification-inbox-app-status-hint"
            name="app-status"
            checked=""
          >
          <span class="settings-notification-inbox__preference-copy">
            <span id="settings-notification-inbox-app-status-label" class="settings-notification-inbox__preference-title">Project status changes</span>
            <span class="settings-notification-inbox__hint" id="settings-notification-inbox-app-status-hint">Milestones and delivery updates.</span>
          </span>
        </label>
        <label class="settings-notification-inbox__preference" for="settings-notification-inbox-app-reminders">
          <input
            class="settings-notification-inbox__checkbox"
            type="checkbox"
            id="settings-notification-inbox-app-reminders"
            aria-labelledby="settings-notification-inbox-app-reminders-label"
            aria-describedby="settings-notification-inbox-app-reminders-hint"
            name="app-reminders"
          >
          <span class="settings-notification-inbox__preference-copy">
            <span id="settings-notification-inbox-app-reminders-label" class="settings-notification-inbox__preference-title">Due-date reminders</span>
            <span class="settings-notification-inbox__hint" id="settings-notification-inbox-app-reminders-hint">A nudge before your deadline.</span>
          </span>
        </label>
      </fieldset>
    </div>
    <footer class="settings-notification-inbox__footer">
      <p class="settings-notification-inbox__note">Critical account alerts always reach you.</p>
      <button class="settings-notification-inbox__save" type="button">Save notifications</button>
    </footer>
  </form>
</section>
