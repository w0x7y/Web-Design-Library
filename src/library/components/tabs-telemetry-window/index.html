<section aria-label="API response time windows" class="tabs-telemetry-window">
  <div class="tabs-telemetry-window__header">
    <h2 class="tabs-telemetry-window__title">Response time</h2>
    <span class="tabs-telemetry-window__metric-label">API / P95</span>
  </div>

  <fieldset class="tabs-telemetry-window__windows">
    <legend class="tabs-telemetry-window__sr-only">Choose monitoring window</legend>
    <div class="tabs-telemetry-window__tabs">
      <label class="tabs-telemetry-window__tab">
        <input id="tabs-telemetry-window-hour" type="radio" name="tabs-telemetry-window-range" value="hour" checked class="tabs-telemetry-window__radio" />
        1 hour
      </label>
      <label class="tabs-telemetry-window__tab">
        <input id="tabs-telemetry-window-day" type="radio" name="tabs-telemetry-window-range" value="day" class="tabs-telemetry-window__radio" />
        24 hours
      </label>
      <label class="tabs-telemetry-window__tab">
        <input id="tabs-telemetry-window-week" type="radio" name="tabs-telemetry-window-range" value="week" class="tabs-telemetry-window__radio" />
        7 days
      </label>
    </div>
  </fieldset>

  <div class="tabs-telemetry-window__summary tabs-telemetry-window__summary--hour">
    <p class="tabs-telemetry-window__value">124<span class="tabs-telemetry-window__unit">ms</span></p>
    <p class="tabs-telemetry-window__comparison">↓ 8 ms from the previous hour</p>
  </div>
  <div class="tabs-telemetry-window__summary tabs-telemetry-window__summary--day">
    <p class="tabs-telemetry-window__value">138<span class="tabs-telemetry-window__unit">ms</span></p>
    <p class="tabs-telemetry-window__comparison">↓ 12 ms from the previous day</p>
  </div>
  <div class="tabs-telemetry-window__summary tabs-telemetry-window__summary--week">
    <p class="tabs-telemetry-window__value">146<span class="tabs-telemetry-window__unit">ms</span></p>
    <p class="tabs-telemetry-window__comparison">↓ 19 ms from the previous week</p>
  </div>

  <!-- Decorative chart; the selected value is provided as text above -->
  <div aria-hidden="true" class="tabs-telemetry-window__chart">
    <span class="tabs-telemetry-window__bar tabs-telemetry-window__bar--low"></span>
    <span class="tabs-telemetry-window__bar tabs-telemetry-window__bar--high"></span>
    <span class="tabs-telemetry-window__bar tabs-telemetry-window__bar--medium"></span>
    <span class="tabs-telemetry-window__bar tabs-telemetry-window__bar--peak"></span>
    <span class="tabs-telemetry-window__bar tabs-telemetry-window__bar--elevated"></span>
    <span class="tabs-telemetry-window__bar tabs-telemetry-window__bar--minimum"></span>
    <span class="tabs-telemetry-window__bar tabs-telemetry-window__bar--low tabs-telemetry-window__bar--latest"></span>
  </div>
  <p class="tabs-telemetry-window__health"><span aria-hidden="true" class="tabs-telemetry-window__health-dot">●</span> All regions within target</p>
</section>
