<section aria-label="Recording tools" class="buttons-studio-tools">
  <p class="buttons-studio-tools__eyebrow">Studio / take 04</p>
  <h2 class="buttons-studio-tools__heading">Morning field notes</h2>
  <div class="buttons-studio-tools__tools">
    <button type="button" class="buttons-studio-tools__button buttons-studio-tools__button--tool">
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" class="buttons-studio-tools__tool-icon">
        <path d="M6 3v14M14 3v14M3 7h6M11 13h6" />
        <circle cx="6" cy="7" r="2" fill="currentColor" />
        <circle cx="14" cy="13" r="2" fill="currentColor" />
      </svg>
      Mix levels
    </button>
    <button type="button" class="buttons-studio-tools__button buttons-studio-tools__button--tool">
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" class="buttons-studio-tools__tool-icon">
        <path d="M3 10h14M6 5v10M10 3v14M14 6v8" />
      </svg>
      Clean audio
    </button>
    <button type="button" class="buttons-studio-tools__button buttons-studio-tools__button--tool">
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" class="buttons-studio-tools__tool-icon">
        <path d="M4 4h12v9H8l-4 3zM7 7h6M7 10h4" />
      </svg>
      Transcript
    </button>
    <button type="button" class="buttons-studio-tools__button buttons-studio-tools__button--tool">
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" class="buttons-studio-tools__tool-icon">
        <path d="M10 3v10m-4-4 4 4 4-4M4 14v3h12v-3" />
      </svg>
      Export WAV
    </button>
  </div>
  <button type="button" class="buttons-studio-tools__button buttons-studio-tools__button--review">
    Send for review
    <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="buttons-studio-tools__review-icon">
      <path d="M4 12 12 4M4 4h8v8" />
    </svg>
  </button>
</section>
