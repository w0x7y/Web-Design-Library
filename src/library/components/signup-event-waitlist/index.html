<section class="signup-event-waitlist">
  <div class="signup-event-waitlist__ticket">
    <header class="signup-event-waitlist__header">
      <p class="signup-event-waitlist__header-label">OFFSCRIPT / 2027</p>
      <p class="signup-event-waitlist__header-label">EARLY ACCESS LIST</p>
    </header>
    <div class="signup-event-waitlist__columns">
      <div class="signup-event-waitlist__announcement">
        <h2 class="signup-event-waitlist__heading">Ideas worth gathering for.</h2>
        <p class="signup-event-waitlist__description">Two days. One room. A hundred different ways to see what comes next.</p>
        <p class="signup-event-waitlist__date">LISBON · MAY 14—15</p>
      </div>
      <form class="signup-event-waitlist__form" action="#" method="post">
        <p class="signup-event-waitlist__form-title">Be first in line when tickets open.</p>
        <label class="signup-event-waitlist__field" for="signup-event-waitlist-email">
          Your email
          <input class="signup-event-waitlist__input" id="signup-event-waitlist-email" aria-describedby="signup-event-waitlist-hint" name="email" type="email" autocomplete="email" placeholder="" required>
        </label>
        <button class="signup-event-waitlist__submit" type="submit">
          Join the waitlist
          <svg class="signup-event-waitlist__arrow" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12l8-8M4 4h8v8"></path>
          </svg>
        </button>
        <p class="signup-event-waitlist__hint" id="signup-event-waitlist-hint">One announcement. No newsletters.</p>
      </form>
    </div>
  </div>
</section>
