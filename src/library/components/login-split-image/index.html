<section class="login-split-image">
  <figure class="login-split-image__photo">
    <img
      src="https://images.unsplash.com/photo-1524230572899-a752b3835840?w=1600&q=80"
      alt="A white plastered arcade of repeating arches above a flight of stone steps"
      width="1600"
      height="2133"
    />
    <figcaption class="login-split-image__caption">
      <dl class="login-split-image__title-block">
        <div class="login-split-image__cell login-split-image__cell--wide">
          <dt>Project</dt>
          <dd>Casa Ferro, Porto</dd>
        </div>
        <div class="login-split-image__cell">
          <dt>Sheet</dt>
          <dd class="login-split-image__nums">A-302 Stair</dd>
        </div>
        <div class="login-split-image__cell">
          <dt>Revision</dt>
          <dd>C, approved</dd>
        </div>
      </dl>
    </figcaption>
  </figure>

  <div class="login-split-image__panel">
    <div class="login-split-image__column">
      <a href="#" class="login-split-image__logo">
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M2 2h16v16H2Zm5.5 16v-5.5a2.5 2.5 0 0 1 5 0V18Z" />
        </svg>
        Plinth
      </a>

      <div class="login-split-image__main">
        <h1 class="login-split-image__title">Sign in to Plinth</h1>
        <p class="login-split-image__lede">Drawings, revisions and client sign-off for your studio.</p>

        <div class="login-split-image__providers">
          <button type="button" class="login-split-image__provider">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="login-split-image__google">
              <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.46a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.58-5.17 3.58-8.81Z" />
              <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.88-3c-1.07.72-2.45 1.15-4.06 1.15-3.12 0-5.77-2.11-6.71-4.95H1.28v3.1A12 12 0 0 0 12 24Z" />
              <path fill="#FBBC05" d="M5.29 14.29A7.2 7.2 0 0 1 4.91 12c0-.79.14-1.57.38-2.29v-3.1H1.28A12 12 0 0 0 0 12c0 1.94.46 3.77 1.28 5.39l4.01-3.1Z" />
              <path fill="#EA4335" d="M12 4.77c1.76 0 3.34.61 4.59 1.8l3.44-3.44A11.5 11.5 0 0 0 12 0 12 12 0 0 0 1.28 6.61l4.01 3.1C6.23 6.88 8.88 4.77 12 4.77Z" />
            </svg>
            <span><span class="login-split-image__sr-only">Sign in with </span>Google</span>
          </button>
          <button type="button" class="login-split-image__provider">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="login-split-image__microsoft">
              <path fill="#F25022" d="M1 1h10.5v10.5H1z" />
              <path fill="#7FBA00" d="M12.5 1H23v10.5H12.5z" />
              <path fill="#00A4EF" d="M1 12.5h10.5V23H1z" />
              <path fill="#FFB900" d="M12.5 12.5H23V23H12.5z" />
            </svg>
            <span><span class="login-split-image__sr-only">Sign in with </span>Microsoft</span>
          </button>
        </div>

        <div class="login-split-image__divider">
          <span></span>
          or with email
          <span></span>
        </div>

        <form class="login-split-image__form">
          <div>
            <label for="login-split-image-email" class="login-split-image__label">Email</label>
            <input
              id="login-split-image-email"
              type="email"
              name="email"
              autocomplete="username"
              required
              class="login-split-image__input"
            />
          </div>

          <div>
            <label for="login-split-image-password" class="login-split-image__label">Password</label>
            <input
              id="login-split-image-password"
              type="password"
              name="password"
              autocomplete="current-password"
              required
              class="login-split-image__input"
            />
          </div>

          <div class="login-split-image__row">
            <div class="login-split-image__remember">
              <span class="login-split-image__checkbox">
                <input id="login-split-image-remember" type="checkbox" name="remember" checked />
                <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m4.5 8.25 2.25 2.25 4.75-5" />
                </svg>
              </span>
              <label for="login-split-image-remember">Keep me signed in</label>
            </div>
            <a href="#" class="login-split-image__link">Forgot password?</a>
          </div>

          <button type="submit" class="login-split-image__submit">Sign in</button>
        </form>

        <p class="login-split-image__signup">
          New to Plinth?
          <a href="#" class="login-split-image__link login-split-image__link--strong">Start a 30-day trial</a>
        </p>
      </div>

      <div class="login-split-image__footer">
        <p>© 2026 Plinth Software Ltd.</p>
        <div class="login-split-image__legal">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
        </div>
      </div>
    </div>
  </div>
</section>
