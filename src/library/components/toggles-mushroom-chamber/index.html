<section aria-labelledby="toggles-mushroom-chamber-title" class="toggles-mushroom-chamber">
  <p class="toggles-mushroom-chamber__eyebrow">MYCORA / GROW ROOM</p>
  <div class="toggles-mushroom-chamber__summary">
    <img
      src="https://images.unsplash.com/photo-1504545102780-26774c1bb073?w=800&q=80"
      alt="Harvested brown mushrooms on a stone surface"
      width="800"
      height="1098"
      class="toggles-mushroom-chamber__photo"
    >
    <div>
      <h2 id="toggles-mushroom-chamber-title" class="toggles-mushroom-chamber__title">Chamber 04</h2>
      <p class="toggles-mushroom-chamber__readout">86% RH · 18.4°C</p>
      <p class="toggles-mushroom-chamber__strain">Chestnut batch / M-042</p>
    </div>
  </div>
  <div class="toggles-mushroom-chamber__controls">
    <div class="toggles-mushroom-chamber__control-row">
      <div>
        <label for="toggles-mushroom-chamber-mist" class="toggles-mushroom-chamber__label">Timed misting</label>
        <p id="toggles-mushroom-chamber-mist-hint" class="toggles-mushroom-chamber__hint">15 seconds every half hour.</p>

      <input
        id="toggles-mushroom-chamber-mist"
        name="toggles-mushroom-chamber-mist"

        role="switch"

        class="toggles-mushroom-chamber__switch"
      >
    </div>
    <div class="toggles-mushroom-chamber__control-row">
      <div>
        <label for="toggles-mushroom-chamber-air" class="toggles-mushroom-chamber__label">Fresh-air cycle</label>
        <p id="toggles-mushroom-chamber-air-hint" class="toggles-mushroom-chamber__hint">Run the vent between mists.</p>

      <input
        id="toggles-mushroom-chamber-air"
        name="toggles-mushroom-chamber-air"
        type="checkbox"
        role="switch"
        aria-describedby="toggles-mushroom-chamber-air-hint"
        class="toggles-mushroom-chamber__switch"

  <p class="toggles-mushroom-chamber__footnote">Last sensor check: 10:42</p>
