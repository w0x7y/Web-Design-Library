<section class="cta-email-signup">
  <div class="cta-email-signup__container">
    <div>
      <h2 class="cta-email-signup__title">Heading for the email update invitation</h2>
      <p class="cta-email-signup__lede">Supporting copy that explains the kind of updates readers can expect and how often they arrive.</p>
    </div>
    <form action="#" method="get">
      <label for="cta-email-signup-email" class="cta-email-signup__label">Email</label>
      <div class="cta-email-signup__fields">
        <input id="cta-email-signup-email" type="email" autocomplete="email" required placeholder="name@example.com" aria-describedby="cta-email-signup-hint" name="email" class="cta-email-signup__input">
        <button type="submit" class="cta-email-signup__submit">Sign up</button>
      </div>
      <p id="cta-email-signup-hint" class="cta-email-signup__hint">Hint that explains email frequency and how to unsubscribe.</p>
    </form>
  </div>
</section>
