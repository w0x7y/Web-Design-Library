<section class="inputs-derby-roster" aria-label="Jamjar roller derby roster">
  <header class="inputs-derby-roster__header">
    <div>
      <p class="inputs-derby-roster__brand">Jamjar / Roller derby</p>
      <h2 class="inputs-derby-roster__heading">Roster ready.</h2>
    </div>
    <span class="inputs-derby-roster__jersey" aria-hidden="true">08</span>
  </header>
  <label class="inputs-derby-roster__label" for="inputs-derby-roster-alias">Skate alias</label>
  <input
    class="inputs-derby-roster__alias"
    id="inputs-derby-roster-alias"
    name="alias"
    type="text"
    maxlength="24"
    value="Crash Cassidy"
  >
  <div class="inputs-derby-roster__grid">
    <div>
      <label class="inputs-derby-roster__label" for="inputs-derby-roster-number">Jersey no.</label>
      <input
        class="inputs-derby-roster__field"
        id="inputs-derby-roster-number"
        name="jersey"
        type="text"
        inputmode="numeric"
        pattern="[0-9]{1,4}"
        maxlength="4"
        value="08"
      >
    </div>
    <div>
      <label class="inputs-derby-roster__label" for="inputs-derby-roster-position">Position</label>
      <select class="inputs-derby-roster__field" id="inputs-derby-roster-position" name="position">
        <option class="inputs-derby-roster__option" value="jammer">Jammer</option>
        <option class="inputs-derby-roster__option" value="blocker">Blocker</option>
        <option class="inputs-derby-roster__option" value="pivot">Pivot</option>
      </select>
    </div>
  </div>
</section>
