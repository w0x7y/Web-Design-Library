<section aria-label="Foldlet origami pocket instructions" class="tabs-origami-folds">
  <header class="tabs-origami-folds__header">
    <h2 class="tabs-origami-folds__brand">Foldlet</h2>
    <span class="tabs-origami-folds__series">PAPER STUDY 06</span>
  </header>
  <p class="tabs-origami-folds__project">A pocket for small treasures</p>
  <div class="tabs-origami-folds__workbench">
    <fieldset class="tabs-origami-folds__selector">
      <legend class="tabs-origami-folds__legend">Choose paper folding step</legend>
      <label id="tabs-origami-folds-square-label" class="tabs-origami-folds__tab">
        <input id="tabs-origami-folds-square" aria-label="Step 1: Start square" type="radio" name="tabs-origami-folds-view" value="square" checked aria-controls="tabs-origami-folds-square-panel" class="tabs-origami-folds__radio">
        01
      </label>
      <label id="tabs-origami-folds-diagonal-label" class="tabs-origami-folds__tab">
        <input id="tabs-origami-folds-diagonal" aria-label="Step 2: Fold in half" type="radio" name="tabs-origami-folds-view" value="diagonal" aria-controls="tabs-origami-folds-diagonal-panel" class="tabs-origami-folds__radio">
        02
      </label>
      <label id="tabs-origami-folds-pocket-label" class="tabs-origami-folds__tab">
        <input id="tabs-origami-folds-pocket" aria-label="Step 3: Tuck the corners" type="radio" name="tabs-origami-folds-view" value="pocket" aria-controls="tabs-origami-folds-pocket-panel" class="tabs-origami-folds__radio">
        03
      </label>
    </fieldset>
    <div>
      <section id="tabs-origami-folds-square-panel" aria-labelledby="tabs-origami-folds-square-label" class="tabs-origami-folds__panel tabs-origami-folds__panel--square">
        <svg aria-hidden="true" viewBox="0 0 120 120" class="tabs-origami-folds__diagram">
          <path d="M15 15H105V105H15Z" fill="#fecdd3" stroke="#881337" stroke-width="2" stroke-linejoin="round"></path>
          <path d="M15 15 105 105M105 15 15 105" fill="none" stroke="#881337" stroke-width="1.5" stroke-dasharray="4 4"></path>
        </svg>
        <h3 class="tabs-origami-folds__fold-title">Start square</h3>
        <p class="tabs-origami-folds__fold-note">Colour side down. Mark both diagonals.</p>
      </section>
      <section id="tabs-origami-folds-diagonal-panel" aria-labelledby="tabs-origami-folds-diagonal-label" class="tabs-origami-folds__panel tabs-origami-folds__panel--diagonal">
        <svg aria-hidden="true" viewBox="0 0 120 120" class="tabs-origami-folds__diagram">
          <path d="M15 95 60 15 105 95Z" fill="#fecdd3" stroke="#881337" stroke-width="2" stroke-linejoin="round"></path>
          <path d="M60 15V95" fill="none" stroke="#881337" stroke-width="1.5" stroke-dasharray="4 4"></path>
        </svg>
        <h3 class="tabs-origami-folds__fold-title">Fold in half</h3>
        <p class="tabs-origami-folds__fold-note">Bring opposite corners together; crease.</p>
      </section>
      <section id="tabs-origami-folds-pocket-panel" aria-labelledby="tabs-origami-folds-pocket-label" class="tabs-origami-folds__panel tabs-origami-folds__panel--pocket">
        <svg aria-hidden="true" viewBox="0 0 120 120" class="tabs-origami-folds__diagram">
          <path d="M15 45 60 15 105 45 85 100H35Z" fill="#fecdd3" stroke="#881337" stroke-width="2" stroke-linejoin="round"></path>
          <path d="M15 45 85 100M105 45 35 100" fill="none" stroke="#881337" stroke-width="1.5" stroke-dasharray="4 4"></path>
        </svg>
        <h3 class="tabs-origami-folds__fold-title">Tuck the corners</h3>
        <p class="tabs-origami-folds__fold-note">Cross the tips, then open the top flap.</p>
      </section>
    </div>
  </div>
</section>
