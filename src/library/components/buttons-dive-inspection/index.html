<section aria-label="Keelmark dive inspection actions" class="buttons-dive-inspection">
  <div class="buttons-dive-inspection__brand">
    <span>Keelmark</span>
    <span>DIVE / 08</span>
  </div>
  <h2 class="buttons-dive-inspection__heading">Below the waterline.</h2>
  <p class="buttons-dive-inspection__hint">Hull inspection · Berth C12</p>
  <div class="buttons-dive-inspection__actions">
    <button type="button" class="buttons-dive-inspection__permit">
      <span>Open dive permit</span>
      <svg
        aria-hidden="true"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="buttons-dive-inspection__arrow"
      >
        <path d="M3 8h10M9 4l4 4-4 4" />
      </svg>
    </button>
    <button type="button" class="buttons-dive-inspection__scan">
      <span>Upload hull scan</span>
      <span aria-hidden="true">↑</span>
    </button>
    <button type="button" class="buttons-dive-inspection__report">
      <span>Inspection report</span>
      <span aria-hidden="true">↗</span>
    </button>
  </div>
</section>
