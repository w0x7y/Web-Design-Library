<section class="inputs-farm-pledge" aria-label="Fieldfund farm crowdfunding pledge">
  <p class="inputs-farm-pledge__brand">Fieldfund / Farm crowdfunding</p>
  <h2 class="inputs-farm-pledge__heading">Back the next harvest</h2>
  <div class="inputs-farm-pledge__glass">
    <label class="inputs-farm-pledge__label" for="inputs-farm-pledge-campaign">Farm campaign</label>
    <input
      class="inputs-farm-pledge__campaign"
      id="inputs-farm-pledge-campaign"
      name="campaign"
      type="text"
      value="Eastfield cold store"
    >
    <label class="inputs-farm-pledge__pledge-label" for="inputs-farm-pledge-pledge">Your pledge</label>
    <div class="inputs-farm-pledge__pledge-row">
      <input
        class="inputs-farm-pledge__pledge"
        id="inputs-farm-pledge-pledge"
        name="pledge"
        type="number"
        min="5"
        max="100000"
        step="5"
        value="125"
        aria-describedby="inputs-farm-pledge-unit inputs-farm-pledge-hint"
      >
      <span class="inputs-farm-pledge__unit" id="inputs-farm-pledge-unit">GBP</span>
    </div>
    <p class="inputs-farm-pledge__hint" id="inputs-farm-pledge-hint">Pledges help build the farm's new cold store.</p>
  </div>
  <div class="inputs-farm-pledge__campaign-summary">
    <span>Farm EF-12</span>
    <span>16 days / £8,400 goal</span>
  </div>
</section>
