<div class="inputs-otp-row">
  <fieldset aria-describedby="otp-instruction">
    <legend class="inputs-otp-row__legend">Verification code</legend>
    <p id="otp-instruction" class="inputs-otp-row__instruction">Enter the six-digit code.</p>
    <div class="inputs-otp-row__digits">
      <div class="inputs-otp-row__digit-group">
        <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1 of 6" aria-describedby="otp-instruction" placeholder="" name="digit-1" value="1" class="inputs-otp-row__digit">
        <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Digit 2 of 6" aria-describedby="otp-instruction" placeholder="" name="digit-2" value="2" class="inputs-otp-row__digit">
        <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Digit 3 of 6" aria-describedby="otp-instruction" placeholder="" name="digit-3" value="3" class="inputs-otp-row__digit">
      </div>
      <span aria-hidden="true" class="inputs-otp-row__separator">-</span>
      <div class="inputs-otp-row__digit-group">
        <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Digit 4 of 6" aria-describedby="otp-instruction" placeholder="" name="digit-4" class="inputs-otp-row__digit">
        <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Digit 5 of 6" aria-describedby="otp-instruction" placeholder="" name="digit-5" class="inputs-otp-row__digit">
        <input type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Digit 6 of 6" aria-describedby="otp-instruction" placeholder="" name="digit-6" class="inputs-otp-row__digit">
      </div>
    </div>
  </fieldset><button type="button" class="inputs-otp-row__verify">Verify</button>
  <p class="inputs-otp-row__resend-note">Didn't get a code? <a href="#" class="inputs-otp-row__resend">Resend</a></p>
</div>
