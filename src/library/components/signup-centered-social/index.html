<section class="signup-centered-social">
  <div class="signup-centered-social__container">
    <div class="signup-centered-social__card">
      <header class="signup-centered-social__header">
        <div class="signup-centered-social__logo">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="signup-centered-social__logo-glyph">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
          </svg>
          <span>Logo</span>
        </div>
        <p class="signup-centered-social__account">Have an account? <a href="#" class="signup-centered-social__link">Log in</a></p>
      </header>
      <h1 class="signup-centered-social__title">Create an account</h1>
      <p class="signup-centered-social__lede">Short introduction to joining and getting started.</p>
      <div class="signup-centered-social__providers">
        <button type="button" aria-label="Continue with primary provider name" class="signup-centered-social__action signup-centered-social__action--secondary">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="signup-centered-social__provider-glyph">
            <rect x="4" y="4" width="16" height="16" rx="3"></rect>
            <path d="M8 12h8M12 8v8"></path>
          </svg>
          <span class="signup-centered-social__provider-label"><span class="signup-centered-social__provider-label--short">Provider</span><span class="signup-centered-social__provider-label--full">Continue with provider name</span></span>
        </button>
        <button type="button" aria-label="Continue with alternative provider name" class="signup-centered-social__action signup-centered-social__action--secondary">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="signup-centered-social__provider-glyph">
            <rect x="4" y="4" width="16" height="16" rx="3"></rect>
            <path d="M8 12h8M12 8v8"></path>
          </svg>
          <span class="signup-centered-social__provider-label"><span class="signup-centered-social__provider-label--short">Provider</span><span class="signup-centered-social__provider-label--full">Continue with provider name</span></span>
        </button>
      </div>
      <div class="signup-centered-social__divider"><span aria-hidden="true" class="signup-centered-social__divider-line"></span>or<span aria-hidden="true" class="signup-centered-social__divider-line"></span></div>
      <form class="signup-centered-social__form">
        <div>
          <label for="signup-centered-social-name" class="signup-centered-social__label">Name</label><input id="signup-centered-social-name" type="text" autocomplete="name" required placeholder="Full name" name="name" class="signup-centered-social__input">
        </div>
        <div>
          <label for="signup-centered-social-email" class="signup-centered-social__label">Email</label><input id="signup-centered-social-email" type="email" autocomplete="email" required aria-invalid="true" aria-describedby="signup-centered-social-email-error" placeholder="name@example.com" name="email" class="signup-centered-social__input">
          <p id="signup-centered-social-email-error" class="signup-centered-social__email-error">Error text explaining what to correct.</p>
        </div>
        <div>
          <label for="signup-centered-social-password" class="signup-centered-social__label">Password</label><input id="signup-centered-social-password" type="password" autocomplete="new-password" aria-describedby="signup-centered-social-password-hint" required minlength="12" name="password" class="signup-centered-social__input">
          <p id="signup-centered-social-password-hint" class="signup-centered-social__password-hint">Password rules and minimum length.</p>
        </div>
        <button type="submit" class="signup-centered-social__action signup-centered-social__action--primary">Create account</button>
      </form>
      <p class="signup-centered-social__terms">By signing up, you accept the <a href="#" class="signup-centered-social__link">Terms</a> and <a href="#" class="signup-centered-social__link">Privacy policy</a>.</p>
    </div>
  </div>
</section>
