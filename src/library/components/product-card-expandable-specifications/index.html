<article class="product-card-expandable-specifications">
  <div class="product-card-expandable-specifications__product-overview">
    <div role="img" aria-label="Image placeholder: product overview" class="product-card-expandable-specifications__media">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="product-card-expandable-specifications__glyph-image-size-10">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <circle cx="9" cy="9" r="2"></circle>
        <path d="m21 15-5-5L5 21"></path>
      </svg>
    </div>
    <div class="product-card-expandable-specifications__product-identity">
      <h3 class="product-card-expandable-specifications__product-name">Product name</h3>
      <p class="product-card-expandable-specifications__product-price">$48</p>
    </div>
  </div>
  <details open class="product-card-expandable-specifications__specification-disclosure">
    <summary class="product-card-expandable-specifications__specification-toggle">Specifications</summary>
    <dl class="product-card-expandable-specifications__specifications">
      <div class="product-card-expandable-specifications__specification-row">

        <dd class="product-card-expandable-specifications__specification-value">24-bit</dd>
      </div>
      <div class="product-card-expandable-specifications__specification-row">
        <dt class="product-card-expandable-specifications__specification-label">Size</dt>
        <dd class="product-card-expandable-specifications__specification-value">1.2 GB</dd>
      </div>
      <div class="product-card-expandable-specifications__specification-row">
        <dt class="product-card-expandable-specifications__specification-label">Files</dt>
        <dd class="product-card-expandable-specifications__specification-value">120</dd>
      </div>
    </dl>
  </details>
  <a href="#" class="product-card-expandable-specifications__action-primary">View product</a>
</article>
