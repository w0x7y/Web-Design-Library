<section class="login-sso-first">
  <div class="login-sso-first__container">
    <div class="login-sso-first__card">
      <div class="login-sso-first__logo">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="login-sso-first__logo-glyph">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        <span>Logo</span>
      </div>
      <h1 class="login-sso-first__title">Sign in</h1>
      <ul role="list" class="login-sso-first__list">
        <li><button type="button" aria-label="Continue with primary provider name" class="login-sso-first__action login-sso-first__action--secondary">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="login-sso-first__provider-glyph">
            <rect x="4" y="4" width="16" height="16" rx="3"></rect>
            <path d="M8 12h8M12 8v8"></path>
          </svg>
          <span class="login-sso-first__provider-label">Continue with provider name</span>
        </button></li>
        <li><button type="button" aria-label="Continue with alternative provider name" class="login-sso-first__action login-sso-first__action--secondary">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="login-sso-first__provider-glyph">
            <rect x="4" y="4" width="16" height="16" rx="3"></rect>
            <path d="M8 12h8M12 8v8"></path>
          </svg>
          <span class="login-sso-first__provider-label">Continue with provider name</span>
        </button></li>
        <li><button type="button" aria-label="Continue with SSO" class="login-sso-first__action login-sso-first__action--secondary">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="login-sso-first__provider-glyph">
            <rect x="4" y="4" width="16" height="16" rx="3"></rect>
            <path d="M8 12h8M12 8v8"></path>
          </svg>
          <span class="login-sso-first__provider-label">Continue with SSO</span>
        </button></li>
      </ul>
      <div class="login-sso-first__divider"><span aria-hidden="true" class="login-sso-first__divider-line"></span>or<span aria-hidden="true" class="login-sso-first__divider-line"></span></div>
      <form class="login-sso-first__form">
        <div>
          <label for="login-sso-first-email" class="login-sso-first__label">Email</label><input id="login-sso-first-email" type="email" autocomplete="username" required placeholder="name@example.com" name="email" class="login-sso-first__input">
        </div>
        <button type="submit" class="login-sso-first__action login-sso-first__action--primary">Continue</button>
      </form>
      <p class="login-sso-first__terms">By continuing, you accept the <a href="#" class="login-sso-first__link">Terms</a> and <a href="#" class="login-sso-first__link">Privacy policy</a>.</p>
    </div>
    <p class="login-sso-first__workspace-switch"><a href="#" class="login-sso-first__link">Use a different workspace</a></p>
  </div>
</section>
