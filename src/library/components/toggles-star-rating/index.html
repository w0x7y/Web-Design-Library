<fieldset aria-describedby="toggles-star-rating-hint" class="toggles-star-rating">
  <legend class="toggles-star-rating__title">Rate your experience</legend>
  <p id="toggles-star-rating-hint" class="toggles-star-rating__hint">Choose from 1 to 5 stars</p>
  <div class="toggles-star-rating__rating">
    <div class="toggles-star-rating__stars">
      <label class="toggles-star-rating__star">
        <input type="radio" id="toggles-star-rating-1" name="toggles-star-rating-score" value="1" class="toggles-star-rating__input">
        <span class="toggles-star-rating__name">1 star</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" class="toggles-star-rating__icon">
          <path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.85 6.75 19.6l1-5.8L3.5 9.7l5.9-.9z"></path>
        </svg>
      </label>
      <label class="toggles-star-rating__star">
        <input type="radio" id="toggles-star-rating-2" name="toggles-star-rating-score" value="2" class="toggles-star-rating__input">
        <span class="toggles-star-rating__name">2 stars</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" class="toggles-star-rating__icon">
          <path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.85 6.75 19.6l1-5.8L3.5 9.7l5.9-.9z"></path>
        </svg>
      </label>
      <label class="toggles-star-rating__star">
        <input type="radio" id="toggles-star-rating-3" name="toggles-star-rating-score" value="3" class="toggles-star-rating__input">
        <span class="toggles-star-rating__name">3 stars</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" class="toggles-star-rating__icon">
          <path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.85 6.75 19.6l1-5.8L3.5 9.7l5.9-.9z"></path>
        </svg>
      </label>
      <label class="toggles-star-rating__star">
        <input type="radio" id="toggles-star-rating-4" name="toggles-star-rating-score" checked value="4" class="toggles-star-rating__input">
        <span class="toggles-star-rating__name">4 stars</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" class="toggles-star-rating__icon">
          <path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.85 6.75 19.6l1-5.8L3.5 9.7l5.9-.9z"></path>
        </svg>
      </label>
      <label class="toggles-star-rating__star">
        <input type="radio" id="toggles-star-rating-5" name="toggles-star-rating-score" value="5" class="toggles-star-rating__input">
        <span class="toggles-star-rating__name">5 stars</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" class="toggles-star-rating__icon">
          <path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.85 6.75 19.6l1-5.8L3.5 9.7l5.9-.9z"></path>
        </svg>
      </label>
    </div>
    <p aria-hidden="true" class="toggles-star-rating__caption"><span class="toggles-star-rating__unrated">Not rated</span><span class="toggles-star-rating__word toggles-star-rating__word--poor">Poor</span><span class="toggles-star-rating__word toggles-star-rating__word--fair">Fair</span><span class="toggles-star-rating__word toggles-star-rating__word--good">Good</span><span class="toggles-star-rating__word toggles-star-rating__word--very-good">Very good</span><span class="toggles-star-rating__word toggles-star-rating__word--excellent">Excellent</span></p>
  </div>
</fieldset>
