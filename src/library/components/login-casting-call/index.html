<section class="login-casting-call">
  <div class="login-casting-call__inner">
    <header class="login-casting-call__masthead">
      <p>SLATECAST</p>
      <p>PERFORMER PORTAL / 2026</p>
    </header>
    <div class="login-casting-call__poster">
      <h1 class="login-casting-call__heading">THE NEXT TAKE IS YOURS.</h1>
      <div class="login-casting-call__stamp">
        <span class="login-casting-call__number">01</span>
        <p>Self-tapes. Callbacks. Your audition record.</p>
      </div>
    </div>
    <div class="login-casting-call__access">
      <div class="login-casting-call__intro">
        <h2 class="login-casting-call__form-heading">CHECK IN</h2>
        <p
          id="login-casting-call-hint"
          class="login-casting-call__hint"
        >
          Sign in with your performer account. Agency logins have a separate entrance.
        </p>
      </div>
      <form action="#" method="post" class="login-casting-call__form">
        <label for="login-casting-call-email" class="login-casting-call__label">
          Performer email
          <input
            id="login-casting-call-email"
            name="email"
            type="email"
            autocomplete="username"
            required
            aria-describedby="login-casting-call-hint"
            class="login-casting-call__input"
          >
        </label>
        <label for="login-casting-call-password" class="login-casting-call__label">
          Password
          <input
            id="login-casting-call-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            class="login-casting-call__input"
          >
        </label>
        <button type="submit" class="login-casting-call__submit">Enter the casting room</button>
        <a href="#" class="login-casting-call__help">Trouble signing in?</a>
      </form>
    </div>
  </div>
</section>
