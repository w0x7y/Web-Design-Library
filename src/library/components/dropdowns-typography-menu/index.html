<details open class="dropdowns-typography-menu">
  <summary class="dropdowns-typography-menu__summary">
    <span aria-hidden="true" class="dropdowns-typography-menu__tile">Aa</span>
    <span class="dropdowns-typography-menu__title">Text style</span>
    <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="dropdowns-typography-menu__chevron">
      <path d="m4 6 4 4 4-4" />
    </svg>
  </summary>

  <fieldset class="dropdowns-typography-menu__families">
    <legend class="dropdowns-typography-menu__sr-only">Font family</legend>
    <p class="dropdowns-typography-menu__eyebrow">Font family</p>
    <label class="dropdowns-typography-menu__family">
      <input type="radio" name="dropdowns-typography-menu-family" value="sans" aria-labelledby="dropdowns-typography-menu-sans-name" aria-describedby="dropdowns-typography-menu-sans-hint" checked class="dropdowns-typography-menu__radio" />
      <span aria-hidden="true" class="dropdowns-typography-menu__sample">Aa</span>
      <span>
        <span id="dropdowns-typography-menu-sans-name" class="dropdowns-typography-menu__family-name">Modern sans</span>
        <span id="dropdowns-typography-menu-sans-hint" class="dropdowns-typography-menu__family-description">Clean and familiar</span>
      </span>
    </label>
    <label class="dropdowns-typography-menu__family">
      <input type="radio" name="dropdowns-typography-menu-family" value="serif" aria-labelledby="dropdowns-typography-menu-serif-name" aria-describedby="dropdowns-typography-menu-serif-hint" class="dropdowns-typography-menu__radio" />
      <span aria-hidden="true" class="dropdowns-typography-menu__sample dropdowns-typography-menu__sample--serif">Aa</span>
      <span>
        <span id="dropdowns-typography-menu-serif-name" class="dropdowns-typography-menu__family-name">Classic serif</span>
        <span id="dropdowns-typography-menu-serif-hint" class="dropdowns-typography-menu__family-description">A little more character</span>
      </span>
    </label>
    <label class="dropdowns-typography-menu__family">
      <input type="radio" name="dropdowns-typography-menu-family" value="mono" aria-labelledby="dropdowns-typography-menu-mono-name" aria-describedby="dropdowns-typography-menu-mono-hint" class="dropdowns-typography-menu__radio" />
      <span aria-hidden="true" class="dropdowns-typography-menu__sample dropdowns-typography-menu__sample--mono">Aa</span>
      <span>
        <span id="dropdowns-typography-menu-mono-name" class="dropdowns-typography-menu__family-name">Monospace</span>
        <span id="dropdowns-typography-menu-mono-hint" class="dropdowns-typography-menu__family-description">Precise, even spacing</span>
      </span>
    </label>
  </fieldset>

  <div class="dropdowns-typography-menu__size-row">
    <label for="dropdowns-typography-menu-size" class="dropdowns-typography-menu__size-label">Type size</label>
    <select id="dropdowns-typography-menu-size" name="size" class="dropdowns-typography-menu__size">
      <option value="14">14 px</option>
      <option value="16" selected>16 px</option>
      <option value="18">18 px</option>
      <option value="20">20 px</option>
    </select>
  </div>
</details>
