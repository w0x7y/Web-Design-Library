<section aria-label="Arcade actions" class="buttons-arcade-controls">
  <p class="buttons-arcade-controls__eyebrow">Pocket arcade / 02</p>
  <h2 class="buttons-arcade-controls__heading">One more round?</h2>
  <button type="button" class="buttons-arcade-controls__button buttons-arcade-controls__button--play">
    <svg aria-hidden="true" viewBox="0 0 16 16" fill="currentColor" class="buttons-arcade-controls__play-icon">
      <path d="M4 2.5 13 8l-9 5.5z" />
    </svg>
    Let's play
  </button>
  <div class="buttons-arcade-controls__utilities">
    <button type="button" class="buttons-arcade-controls__button buttons-arcade-controls__button--utility">
      <span aria-hidden="true" class="buttons-arcade-controls__star">★</span>
      High scores
    </button>
    <button type="button" class="buttons-arcade-controls__button buttons-arcade-controls__button--utility">
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" class="buttons-arcade-controls__sound-icon">
        <path d="M4 8h3l4-4v12l-4-4H4zM14 7a4 4 0 0 1 0 6M16 4a8 8 0 0 1 0 12" />
      </svg>
      Sound settings
    </button>
  </div>
  <p class="buttons-arcade-controls__caption">No coins needed. Just good reflexes.</p>
</section>
