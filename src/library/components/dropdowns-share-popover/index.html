<div class="dropdowns-share-popover">
  <details open class="dropdowns-share-popover__disclosure">
    <summary class="dropdowns-share-popover__trigger"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dropdowns-share-popover__icon">
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"></path>
    </svg>Share<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dropdowns-share-popover__chevron">
      <path d="m6 9 6 6 6-6"></path>
    </svg></summary>
    <div class="dropdowns-share-popover__panel">
      <h2 class="dropdowns-share-popover__title">Share this item</h2>
      <form action="#" class="dropdowns-share-popover__invite">
        <label for="dropdowns-share-popover-email" class="dropdowns-share-popover__visually-hidden">Invite people by email</label>
        <input id="dropdowns-share-popover-email" type="email" autocomplete="off" placeholder="Add people by email" name="email" class="dropdowns-share-popover__input">
        <button type="submit" class="dropdowns-share-popover__action dropdowns-share-popover__action--primary">Invite</button>
      </form>
      <h3 class="dropdowns-share-popover__people-heading">People with access</h3>
      <ul role="list" class="dropdowns-share-popover__people">
        <li class="dropdowns-share-popover__person">
          <span aria-hidden="true" class="dropdowns-share-popover__avatar">AR</span>
          <span class="dropdowns-share-popover__person-text"><span class="dropdowns-share-popover__person-name">Alex Rivera</span><span class="dropdowns-share-popover__person-email">alex@example.com</span></span>
          <span class="dropdowns-share-popover__role">Owner</span>
        </li>
        <li class="dropdowns-share-popover__person">
          <span aria-hidden="true" class="dropdowns-share-popover__avatar">SL</span>
          <span class="dropdowns-share-popover__person-text"><span class="dropdowns-share-popover__person-name">Sam Lee</span><span class="dropdowns-share-popover__person-email">sam@example.com</span></span>
          <select aria-label="Access for Sam Lee" class="dropdowns-share-popover__role-select"><option value="edit" selected>Editor</option><option value="view">Viewer</option></select>
        </li>
      </ul>
      <div class="dropdowns-share-popover__link-access">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dropdowns-share-popover__globe-icon">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path>
        </svg>
        <p class="dropdowns-share-popover__link-note">Anyone with the link can view</p>
        <button type="button" class="dropdowns-share-popover__action dropdowns-share-popover__action--secondary"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dropdowns-share-popover__icon">
          <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path>
          <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path>
        </svg>Copy link</button>
      </div>
    </div>
  </details>
</div>
