<div class="dropdowns-kite-configurator">
  <p class="dropdowns-kite-configurator__brand"><span>WINDPATCH</span><span class="dropdowns-kite-configurator__tag">Made for wind</span></p>
  <details open class="dropdowns-kite-configurator__disclosure">
    <summary class="dropdowns-kite-configurator__summary">
      <span>Canopy fabric</span>
      <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="dropdowns-kite-configurator__chevron">
        <path d="m4 6 4 4 4-4" />
      </svg>
    </summary>
    <fieldset class="dropdowns-kite-configurator__fabrics">
      <legend class="dropdowns-kite-configurator__legend">Kite fabric colour</legend>
      <label class="dropdowns-kite-configurator__fabric">
        <svg aria-hidden="true" viewBox="0 0 40 48" fill="none" class="dropdowns-kite-configurator__swatch dropdowns-kite-configurator__swatch--citron">
          <path d="M20 2 37 18 20 40 3 18Z" fill="currentColor" />
          <path d="M20 2v38M3 18h34M20 40l-3 5 5 1" stroke="currentColor" stroke-width="1.5" />
          <path d="M20 3v35M5 18h30" stroke="#351019" stroke-width="1" />
        </svg>
        <span class="dropdowns-kite-configurator__choice">
          <input type="radio" name="dropdowns-kite-configurator-fabric" value="citron" aria-label="Citron fabric" checked class="dropdowns-kite-configurator__radio" /><span>Citron</span></span>
      </label>
      <label class="dropdowns-kite-configurator__fabric">
        <svg aria-hidden="true" viewBox="0 0 40 48" fill="none" class="dropdowns-kite-configurator__swatch dropdowns-kite-configurator__swatch--ember">
          <path d="M20 2 37 18 20 40 3 18Z" fill="currentColor" />
          <path d="M20 2v38M3 18h34M20 40l-3 5 5 1" stroke="currentColor" stroke-width="1.5" />
          <path d="M20 3v35M5 18h30" stroke="#351019" stroke-width="1" />
        </svg>
        <span class="dropdowns-kite-configurator__choice">
          <input type="radio" name="dropdowns-kite-configurator-fabric" value="ember" aria-label="Ember fabric" class="dropdowns-kite-configurator__radio" /><span>Ember</span></span>
      </label>
      <label class="dropdowns-kite-configurator__fabric">
        <svg aria-hidden="true" viewBox="0 0 40 48" fill="none" class="dropdowns-kite-configurator__swatch dropdowns-kite-configurator__swatch--cloud">
          <path d="M20 2 37 18 20 40 3 18Z" fill="currentColor" />
          <path d="M20 2v38M3 18h34M20 40l-3 5 5 1" stroke="currentColor" stroke-width="1.5" />
          <path d="M20 3v35M5 18h30" stroke="#351019" stroke-width="1" />
        </svg>
        <span class="dropdowns-kite-configurator__choice">
          <input type="radio" name="dropdowns-kite-configurator-fabric" value="cloud" aria-label="Cloud fabric" class="dropdowns-kite-configurator__radio" /><span>Cloud</span></span>
      </label>
    </fieldset>
    <div class="dropdowns-kite-configurator__span-row">
      <label for="dropdowns-kite-configurator-span" class="dropdowns-kite-configurator__span-label">Wing span</label>
      <select id="dropdowns-kite-configurator-span" name="wing-span" class="dropdowns-kite-configurator__size">
        <option value="1.2">1.2 metres</option>
        <option value="1.6">1.6 metres</option>
      </select>
    </div>
    <p class="dropdowns-kite-configurator__note">Ripstop nylon / 40 g/m² / Reinforced seams</p>
  </details>
</div>
