<section class="settings-appearance-studio">
  <form class="settings-appearance-studio__form" action="#">
    <h2 class="settings-appearance-studio__heading">Make it feel like yours</h2>
    <p class="settings-appearance-studio__description">Choose the look of your canvas.</p>
    <fieldset class="settings-appearance-studio__themes">
      <legend class="settings-appearance-studio__legend">Canvas theme</legend>
      <div class="settings-appearance-studio__choices">
        <label class="settings-appearance-studio__choice">
          <div class="settings-appearance-studio__swatch settings-appearance-studio__swatch--paper"></div>
          <span class="settings-appearance-studio__choice-label">
            Paper
            <input class="settings-appearance-studio__radio" type="radio" name="settings-appearance-studio-theme" checked="" value="paper">
          </span>
        </label>
        <label class="settings-appearance-studio__choice">
          <div class="settings-appearance-studio__swatch settings-appearance-studio__swatch--midnight"></div>
          <span class="settings-appearance-studio__choice-label">
            Midnight
            <input class="settings-appearance-studio__radio" type="radio" name="settings-appearance-studio-theme" value="midnight">
          </span>
        </label>
        <label class="settings-appearance-studio__choice">
          <div class="settings-appearance-studio__swatch settings-appearance-studio__swatch--moss"></div>
          <span class="settings-appearance-studio__choice-label">
            Moss
            <input class="settings-appearance-studio__radio" type="radio" name="settings-appearance-studio-theme" value="moss">
          </span>
        </label>
      </div>
    </fieldset>
    <div class="settings-appearance-studio__compact">
      <label class="settings-appearance-studio__checkbox-label" for="settings-appearance-studio-compact">
        <input
          class="settings-appearance-studio__checkbox"
          type="checkbox"
          id="settings-appearance-studio-compact"
          aria-labelledby="settings-appearance-studio-compact-label"
          aria-describedby="settings-appearance-studio-compact-hint"
          name="compact"
        >
        <span class="settings-appearance-studio__checkbox-copy">
          <span id="settings-appearance-studio-compact-label" class="settings-appearance-studio__checkbox-title">Compact spacing</span>
          <span class="settings-appearance-studio__hint" id="settings-appearance-studio-compact-hint">Fit more work into each view.</span>
        </span>
      </label>
    </div>
    <div class="settings-appearance-studio__footer">
      <p class="settings-appearance-studio__note">Changes apply to your account only.</p>
      <button class="settings-appearance-studio__save" type="button">Save preferences</button>
    </div>
  </form>
</section>
