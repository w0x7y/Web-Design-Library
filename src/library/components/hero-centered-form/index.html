<section class="hero-centered-form">
  <div class="hero-centered-form__container">
    <div class="hero-centered-form__intro">
      <p class="hero-centered-form__eyebrow">Eyebrow for the signup invitation</p>
      <h1 class="hero-centered-form__title">Headline that introduces the main benefit</h1>
      <p class="hero-centered-form__lede">Supporting copy that explains what readers will receive and why they should join.</p>
      <form action="#" method="get" class="hero-centered-form__form">
        <label for="hero-centered-form-email" class="hero-centered-form__email-label">Email</label>
        <div class="hero-centered-form__fields">
          <input id="hero-centered-form-email" type="email" autocomplete="email" required placeholder="name@example.com" aria-describedby="hero-centered-form-hint" name="email" class="hero-centered-form__input">
          <button type="submit" class="hero-centered-form__submit">Join waitlist</button>
        </div>
        <p id="hero-centered-form-hint" class="hero-centered-form__hint">Hint that sets expectations for email updates and privacy.</p>
      </form>
      <div class="hero-centered-form__proof">
        <div class="hero-centered-form__avatars">
          <span aria-hidden="true" class="hero-centered-form__avatar">AR</span>
          <span aria-hidden="true" class="hero-centered-form__avatar">JC</span>
          <span aria-hidden="true" class="hero-centered-form__avatar">MP</span>
          <span aria-hidden="true" class="hero-centered-form__avatar">SK</span>
          <span aria-hidden="true" class="hero-centered-form__avatar">TL</span>
        </div>
        <p class="hero-centered-form__proof-label">Join 1,284 people on the waitlist</p>
      </div>
    </div>
  </div>
</section>
