<section class="inputs-skate-hire" aria-label="Glidewell skate reservation">
  <p class="inputs-skate-hire__brand">Glidewell / Skate hire</p>
  <h2 class="inputs-skate-hire__heading">Find your glide.</h2>
  <fieldset class="inputs-skate-hire__fieldset">
    <legend class="inputs-skate-hire__legend">Skate size / EU</legend>
    <div class="inputs-skate-hire__sizes">
      <label class="inputs-skate-hire__size">
        <input
          class="inputs-skate-hire__radio"
          name="inputs-skate-hire-size"
          type="radio"
          value="37"
          aria-describedby="inputs-skate-hire-hint"
        >
        <span>37</span>
      </label>
      <label class="inputs-skate-hire__size">
        <input
          class="inputs-skate-hire__radio"
          name="inputs-skate-hire-size"
          type="radio"
          value="38"
          checked
          aria-describedby="inputs-skate-hire-hint"
        >
        <span>38</span>
      </label>
      <label class="inputs-skate-hire__size">
        <input
          class="inputs-skate-hire__radio"
          name="inputs-skate-hire-size"
          type="radio"
          value="39"
          aria-describedby="inputs-skate-hire-hint"
        >
        <span>39</span>
      </label>
      <label class="inputs-skate-hire__size">
        <input
          class="inputs-skate-hire__radio"
          name="inputs-skate-hire-size"
          type="radio"
          value="40"
          aria-describedby="inputs-skate-hire-hint"
        >
        <span>40</span>
      </label>
    </div>
  </fieldset>
  <p class="inputs-skate-hire__hint" id="inputs-skate-hire-hint">Choose your usual EU shoe size. Try them on at the desk.</p>
  <label class="inputs-skate-hire__socks">
    <input class="inputs-skate-hire__checkbox" name="own-socks" type="checkbox" checked>
    <span>I'll bring a pair of long socks.</span>
  </label>
</section>
