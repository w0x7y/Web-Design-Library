<div class="buttons-hierarchy">
  <button type="button" class="buttons-hierarchy__button buttons-hierarchy__button--primary">Primary action</button>
  <button type="button" class="buttons-hierarchy__button buttons-hierarchy__button--secondary">Secondary action</button>
  <button type="button" class="buttons-hierarchy__button buttons-hierarchy__button--tertiary">Tertiary action</button>
  <button type="button" class="buttons-hierarchy__button buttons-hierarchy__button--secondary"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="buttons-hierarchy__icon">
    <path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"></path>
  </svg>Delete item</button>
  <button type="button" aria-label="More actions" class="buttons-hierarchy__button buttons-hierarchy__button--secondary buttons-hierarchy__button--icon">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="buttons-hierarchy__icon">
      <circle cx="5" cy="12" r="1"></circle>
      <circle cx="12" cy="12" r="1"></circle>
      <circle cx="19" cy="12" r="1"></circle>
    </svg>
  </button>
  <button type="button" disabled class="buttons-hierarchy__button buttons-hierarchy__button--disabled">Unavailable action</button>
  <button type="button" disabled aria-busy="true" class="buttons-hierarchy__button buttons-hierarchy__button--loading"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" class="buttons-hierarchy__spinner">
    <path d="M12 3a9 9 0 1 1-9 9"></path>
  </svg>Loading action</button>
</div>
